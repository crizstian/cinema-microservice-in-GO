service:
  name: seatservice-gitops
  identifier: seatservicegitops
  orgIdentifier: sandbox
  projectIdentifier: CristianRamirez
  gitOpsEnabled: true
  serviceDefinition:
    type: Kubernetes
    spec:
      appsetConfigs:
        - appset:
            agentIdentifier: gitops
            identifier: seat_service_appset
            appSetIdentifier: cinema-services
      manifests:
        - manifest:
            identifier: release_repo
            type: ReleaseRepo
            spec:
              store:
                type: Github
                spec:
                  connectorRef: CristianConnector
                  gitFetchType: Branch
                  paths:
                    - platform/deploy/gitops/cluster-config/<+cluster.name>/config.json
                  branch: monorepo
                  repoName: cinema-microservice-in-GO
        - manifest:
            identifier: deployment_repo
            type: DeploymentRepo
            spec:
              store:
                type: Github
                spec:
                  connectorRef: CristianConnector
                  gitFetchType: Branch
                  paths:
                    - platform/deploy/gitops/services/seat/overlays/<+env.identifier>
                  branch: monorepo
                  repoName: cinema-microservice-in-GO
      artifacts:
        primary:
          primaryArtifactRef: serviceimage
          sources:
            - spec:
                connectorRef: DockerCristian
                imagePath: crizstian/seat-service
                tag: <+input>
                digest: ""
              identifier: serviceimage
              type: DockerRegistry
      variables:
        - name: harness_service
          type: String
          description: "Harness service identifier"
          required: false
          value: <+service.identifier>
        - name: service_name
          type: String
          description: "Service name"
          required: false
          value: seat
        - name: environment
          type: String
          description: "Target environment"
          required: false
          value: <+env.identifier>
        - name: image_tag
          type: String
          description: "Docker image tag"
          required: false
          value: <+artifact.tag>
        - name: replicas
          type: String
          description: "Number of replicas"
          required: false
          value: "1"
        - name: namespace
          type: String
          description: "Kubernetes namespace"
          required: false
          value: cinema-<+env.identifier>
        - name: port
          type: String
          description: "Service port"
          required: false
          value: "8005"
