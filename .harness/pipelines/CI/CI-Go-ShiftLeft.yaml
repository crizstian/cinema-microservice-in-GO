pipeline:
  name: CI - Go Shift Left
  identifier: CI_Unified_v3
  orgIdentifier: sandbox
  projectIdentifier: CristianRamirez
  tags:
    version: "1.0"
    language: go
    type: shift-left
  description: |
    Shift-left CI pipeline for Go monorepo:
    - PR Open: Security Code + Test Code stages
    - PR Merge: Push and Release stage
  properties:
    ci:
      codebase:
        connectorRef: CristianConnector
        repoName: cinema-microservice-in-GO
        build: <+input>
        prCloneStrategy: SourceBranch
        sparseCheckout: []
        depth: 50
  variables:
    - name: RUN_MODE
      type: String
      description: "pr_open: Security + Tests | pr_merge: Build + Release | full: All
        stages"
      required: true
      value: <+input>.allowedValues(pr_open,pr_merge,full)
    - name: SERVICES
      type: String
      description: Comma-separated list of services to process
      required: true
      value: <+input>
    - name: GOLANGCI_LINT_VERSION
      type: String
      description: golangci-lint version (must support Go version in go.mod)
      value: v2.11.4
    - name: DOCKER_REGISTRY
      type: String
      description: Docker registry prefix
      value: crizstian
    - name: DOCKERFILE_PATH
      type: String
      description: Path to Dockerfile
      value: platform/docker/go-service/Dockerfile
    - name: COVERAGE_THRESHOLD
      type: Number
      description: Minimum code coverage percentage
      value: 80
    - name: COMPLEXITY_THRESHOLD
      type: Number
      description: Max cyclomatic complexity per function
      value: 15
    - name: SECURITY_GATE_CRITICAL
      type: Number
      description: Max critical vulnerabilities allowed (code)
      value: 0
    - name: SECURITY_GATE_HIGH
      type: Number
      description: Max high vulnerabilities allowed (code)
      value: 5
    - name: SECURITY_GATE_SECRETS
      type: Number
      description: Max secrets allowed
      value: 0
    - name: CONTAINER_GATE_CRITICAL
      type: Number
      description: Max critical container vulnerabilities
      value: 0
    - name: CONTAINER_GATE_HIGH
      type: Number
      description: Max high container vulnerabilities
      value: 3
  stages:
    - stage:
        name: Security Code
        identifier: security_code
        description: Code quality and security analysis with policy enforcement
        type: SecurityTests
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.RUN_MODE> == "pr_open" ||
            <+pipeline.variables.RUN_MODE> == "full"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            key: go-security-<+hashFiles("**/go.sum")>
            paths:
              - /harness/.go
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Linting
                  identifier: linting
                  steps:
                    - parallel:
                        - step:
                            name: golangci-lint
                            identifier: golangci_lint
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: golangci/golangci-lint:<+pipeline.variables.GOLANGCI_LINT_VERSION>
                              shell: Sh
                              command: |
                                set -e
                                cd services/<+repeat.item>
                                echo "=== Running golangci-lint (warnings only, non-blocking) ==="
                                golangci-lint run --timeout 3m --output.formats=json > lint-report.json 2>&1 || true
                                golangci-lint run --timeout 3m || echo "⚠️ Lint issues found - review lint-report.json"
                        - step:
                            type: Gitleaks
                            name: Gitleaks
                            identifier: Gitleaks
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                            enforce:
                              policySets:
                                - security_secrets
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - stepGroup:
                  name: SCA Scans
                  identifier: sca_scans
                  steps:
                    - parallel:
                        - step:
                            type: HarnessSAST
                            name: HarnessSCA
                            identifier: HarnessSCA
                            spec:
                              mode: orchestration
                              config: sca
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              tool:
                                app_name: <+repeat.item>
                            enforce:
                              policySets:
                                - STO_Policy
                        - step:
                            type: Snyk
                            name: Snyk SCA
                            identifier: Snyk_SCA
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: manual
                                name: <+repeat.item>
                                variant: <+codebase.branch>
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                                args:
                                  cli: "--skip-unresolved"
                              privileged: true
                              auth:
                                access_token: <+secrets.getValue("snyk_token")>
                              sbom:
                                format: spdx-json
                              tool:
                                ingest_tool_severity: false
                            enforce:
                              policySets:
                                - STO_Policy
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 3
              - stepGroup:
                  name: SAST Scans
                  identifier: sast_scans
                  steps:
                    - parallel:
                        - step:
                            type: HarnessSAST
                            name: HarnessSAST
                            identifier: HarnessSAST
                            spec:
                              mode: orchestration
                              config: sast
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              tool:
                                app_name: <+repeat.item>
                            enforce:
                              policySets:
                                - STO_Policy
                        - step:
                            type: Snyk
                            name: Snyk SAST
                            identifier: Snyk_SAST
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                name: <+repeat.item>
                                variant: <+codebase.branch>
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                                args:
                                  cli: "--skip-unresolved"
                              privileged: true
                              auth:
                                access_token: <+secrets.getValue("snyk_token")>
                              sbom:
                                format: spdx-json
                              tool:
                                ingest_tool_severity: true
                            enforce:
                              policySets:
                                - STO_Policy
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 3
              - step:
                  type: Run
                  name: Evaluate Code Gate
                  identifier: evaluate_code_gate
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      #!/bin/sh
                      set -e

                      sanitize() {
                        val="$1"
                        [ -z "$val" ] || [ "$val" = "null" ] || [ "$val" = "<+null>" ] && echo "0" || echo "$val"
                      }

                      # Thresholds from pipeline variables
                      MAX_CRITICAL=$GATE_CRITICAL
                      MAX_HIGH=$GATE_HIGH
                      MAX_SECRETS=$GATE_SECRETS

                      # Sanitize scanner outputs
                      H_SCA_C=$(sanitize "$HARNESS_SCA_CRITICAL"); H_SCA_H=$(sanitize "$HARNESS_SCA_HIGH")
                      S_SCA_C=$(sanitize "$SNYK_SCA_CRITICAL"); S_SCA_H=$(sanitize "$SNYK_SCA_HIGH")
                      H_SAST_C=$(sanitize "$HARNESS_SAST_CRITICAL"); H_SAST_H=$(sanitize "$HARNESS_SAST_HIGH")
                      S_SAST_C=$(sanitize "$SNYK_SAST_CRITICAL"); S_SAST_H=$(sanitize "$SNYK_SAST_HIGH")
                      GL_T=$(sanitize "$GITLEAKS_TOTAL")

                      # Calculate totals
                      TOTAL_CRITICAL=$((H_SCA_C + S_SCA_C + H_SAST_C + S_SAST_C))
                      TOTAL_HIGH=$((H_SCA_H + S_SCA_H + H_SAST_H + S_SAST_H))
                      TOTAL_SECRETS=$GL_T

                      # Evaluate gate
                      GATE_PASSED=true
                      VIOLATIONS=""
                      [ "$TOTAL_CRITICAL" -gt "$MAX_CRITICAL" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}CRITICAL:${TOTAL_CRITICAL}(max:${MAX_CRITICAL}) "
                      [ "$TOTAL_HIGH" -gt "$MAX_HIGH" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}HIGH:${TOTAL_HIGH}(max:${MAX_HIGH}) "
                      [ "$TOTAL_SECRETS" -gt "$MAX_SECRETS" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}SECRETS:${TOTAL_SECRETS}(max:${MAX_SECRETS})"

                      # Report
                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║              CODE SECURITY GATE - EVALUATION                 ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      printf "║  Critical: %-3s (max: %-3s)                                   ║\n" "$TOTAL_CRITICAL" "$MAX_CRITICAL"
                      printf "║  High:     %-3s (max: %-3s)                                   ║\n" "$TOTAL_HIGH" "$MAX_HIGH"
                      printf "║  Secrets:  %-3s (max: %-3s)                                   ║\n" "$TOTAL_SECRETS" "$MAX_SECRETS"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      if [ "$GATE_PASSED" = "true" ]; then
                        echo "║  ✅ GATE PASSED - All thresholds met                         ║"
                      else
                        echo "║  ⚠️  GATE FAILED - Violations: $VIOLATIONS"
                        echo "║  ⏳ Pending manual approval (4h timeout)                     ║"
                      fi
                      echo "╚══════════════════════════════════════════════════════════════╝"

                      # Export outputs
                      {
                        echo "TOTAL_CRITICAL=$TOTAL_CRITICAL"
                        echo "TOTAL_HIGH=$TOTAL_HIGH"
                        echo "TOTAL_SECRETS=$TOTAL_SECRETS"
                        echo "CODE_GATE_PASSED=$GATE_PASSED"
                        echo "CODE_VIOLATIONS=$VIOLATIONS"
                      } >> $HARNESS_OUTPUT_FILE

                      [ "$GATE_PASSED" = "false" ] && exit 1 || exit 0
                    envVariables:
                      GATE_CRITICAL: <+pipeline.variables.SECURITY_GATE_CRITICAL>
                      GATE_HIGH: <+pipeline.variables.SECURITY_GATE_HIGH>
                      GATE_SECRETS: <+pipeline.variables.SECURITY_GATE_SECRETS>
                      HARNESS_SCA_CRITICAL: <+execution.steps.sca_scans.steps.HarnessSCA.output.outputVariables.CRITICAL>
                      HARNESS_SCA_HIGH: <+execution.steps.sca_scans.steps.HarnessSCA.output.outputVariables.HIGH>
                      SNYK_SCA_CRITICAL: <+execution.steps.sca_scans.steps.Snyk_SCA.output.outputVariables.CRITICAL>
                      SNYK_SCA_HIGH: <+execution.steps.sca_scans.steps.Snyk_SCA.output.outputVariables.HIGH>
                      HARNESS_SAST_CRITICAL: <+execution.steps.sast_scans.steps.HarnessSAST.output.outputVariables.CRITICAL>
                      HARNESS_SAST_HIGH: <+execution.steps.sast_scans.steps.HarnessSAST.output.outputVariables.HIGH>
                      SNYK_SAST_CRITICAL: <+execution.steps.sast_scans.steps.Snyk_SAST.output.outputVariables.CRITICAL>
                      SNYK_SAST_HIGH: <+execution.steps.sast_scans.steps.Snyk_SAST.output.outputVariables.HIGH>
                      GITLEAKS_TOTAL: <+execution.steps.Gitleaks.output.outputVariables.TOTAL>
                    outputVariables:
                      - name: TOTAL_CRITICAL
                      - name: TOTAL_HIGH
                      - name: TOTAL_SECRETS
                      - name: CODE_GATE_PASSED
                      - name: CODE_VIOLATIONS
                  enforce:
                    policySets:
                      - security_gate_code
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 4h
                            onTimeout:
                              action:
                                type: Abort
        policySetRef:
          - security_gate_code
    - stage:
        name: Test Code
        identifier: test_code
        description: Code complexity analysis and test execution
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.RUN_MODE> == "pr_open" ||
            <+pipeline.variables.RUN_MODE> == "full"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            key: go-test-<+hashFiles("**/go.sum")>
            paths:
              - /harness/.go
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Detect Go Versions
                  identifier: detect_versions
                  steps:
                    - step:
                        name: Detect Go Version
                        identifier: detect_go_version
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          command: |
                            cd services/<+repeat.item>
                            GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
                            echo "Detected Go version for <+repeat.item>: $GO_VERSION"
                            echo "GO_VERSION=$GO_VERSION" >> $HARNESS_OUTPUT_FILE
                          outputVariables:
                            - name: GO_VERSION
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - stepGroup:
                  name: Tests
                  identifier: tests
                  steps:
                    - step:
                        name: gocyclo
                        identifier: gocyclo
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: golang:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_go_version.output.outputVariables.GO_VERSION>-alpine
                          shell: Sh
                          envVariables:
                            GOWORK: "off"
                            THRESHOLD: <+pipeline.variables.COMPLEXITY_THRESHOLD>
                          command: |
                            cd services/<+repeat.item>
                            echo "=== Complexity Report for <+repeat.item> ==="
                            echo "Go version: $(go version)"
                            echo "Threshold: $THRESHOLD"

                            go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
                            export PATH=$(go env GOPATH)/bin:$PATH

                            # Get top 10 most complex functions
                            gocyclo -top 10 . || true

                            # Fail if any function exceeds threshold
                            COMPLEX=$(gocyclo -over $THRESHOLD . 2>/dev/null | wc -l)
                            if [ "$COMPLEX" -gt 0 ]; then
                              echo "⚠️  Warning: $COMPLEX functions exceed complexity threshold of $THRESHOLD"
                              gocyclo -over $THRESHOLD .
                            fi
                      contextType: Pipeline
                    - parallel:
                        - step:
                            type: Test
                            name: Unit Tests
                            identifier: unit_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: golang:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_go_version.output.outputVariables.GO_VERSION>-alpine
                              shell: Sh
                              envVariables:
                                GOWORK: "off"
                              command: |
                                cd services/<+repeat.item>
                                echo "=== Running unit tests for <+repeat.item> ==="
                                echo "Go version: $(go version)"

                                go install github.com/jstemmer/go-junit-report/v2@latest
                                export PATH=$(go env GOPATH)/bin:$PATH

                                # Exclude integration tests and contracts (tested separately)
                                PACKAGES=$(go list ./... | grep -v -E '(integration_tests|contracts)')

                                set -o pipefail
                                go test -v -short -coverprofile=coverage.out $PACKAGES 2>&1 | tee test-output.txt
                                TEST_EXIT=$?

                                echo "=== Coverage Report ==="
                                COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
                                echo "Coverage: ${COVERAGE}%"
                                echo "Threshold: <+pipeline.variables.COVERAGE_THRESHOLD>%"

                                go-junit-report -set-exit-code < test-output.txt > report.xml
                                exit $TEST_EXIT
                              reports:
                                type: JUnit
                                spec:
                                  paths:
                                    - services/**/report.xml
                              intelligenceMode: true
                        - step:
                            name: Contract Tests
                            identifier: contract_tests
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: golang:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_go_version.output.outputVariables.GO_VERSION>-alpine
                              shell: Sh
                              envVariables:
                                GOWORK: "off"
                              command: |
                                cd services/<+repeat.item>

                                # Check if contract tests exist
                                if ls *_contract_test.go 1> /dev/null 2>&1 || [ -d "contracts" ]; then
                                  echo "=== Running Contract Tests for <+repeat.item> ==="
                                  echo "Go version (go.mod): $GO_MOD_VERSION"
                                  go test -v -tags=contract ./... 2>&1 || true
                                else
                                  echo "ℹ️  No contract tests found for <+repeat.item>"
                                fi
                        - step:
                            name: OpenAPI Validation
                            identifier: openapi_validation
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: node:20-alpine
                              shell: Sh
                              command: |
                                npm install -g @stoplight/spectral-cli > /dev/null 2>&1

                                SPEC="services/<+repeat.item>/api/openapi.yaml"
                                SPEC_ALT="services/<+repeat.item>/api/openapi.yml"
                                SPEC_JSON="services/<+repeat.item>/api/openapi.json"

                                if [ -f "$SPEC" ]; then
                                  echo "=== Validating OpenAPI spec for <+repeat.item> ==="
                                  spectral lint "$SPEC" --fail-severity=error
                                elif [ -f "$SPEC_ALT" ]; then
                                  spectral lint "$SPEC_ALT" --fail-severity=error
                                elif [ -f "$SPEC_JSON" ]; then
                                  spectral lint "$SPEC_JSON" --fail-severity=error
                                else
                                  echo "ℹ️  No OpenAPI spec found for <+repeat.item>"
                                fi
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 3
    - stage:
        name: Push and Release
        identifier: push_and_release
        description: Build, scan containers, and release if security gates pass
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.RUN_MODE> == "pr_merge" ||
            <+pipeline.variables.RUN_MODE> == "full"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            key: go-release-<+hashFiles("**/go.sum")>
            paths:
              - /harness/.go
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Detect and Version
                  identifier: detect_versions
                  steps:
                    - step:
                        name: Detect Go Version
                        identifier: detect_go_version
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          command: |
                            cd services/<+repeat.item>
                            GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
                            echo "Detected Go version for <+repeat.item>: $GO_VERSION"
                            echo "GO_VERSION=$GO_VERSION" >> $HARNESS_OUTPUT_FILE
                          outputVariables:
                            - name: GO_VERSION
                    - step:
                        name: Semantic Version
                        identifier: semantic_version
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          command: |
                            apk add --no-cache curl jq > /dev/null 2>&1

                            # Auto-detect bump type from branch prefix
                            BUMP="patch"
                            PREFIX=$(echo "$BRANCH" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
                            case "$PREFIX" in
                              major|breaking) BUMP="major" ;;
                              feature|feat) BUMP="minor" ;;
                              fix|hotfix|patch) BUMP="patch" ;;
                            esac

                            # Get latest tag for this service
                            TAGS=$(curl -s "https://api.github.com/repos/${GITHUB_REPO}/tags?per_page=100" \
                              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                              -H "Accept: application/vnd.github.v3+json")

                            LATEST=$(echo "$TAGS" | jq -r --arg svc "$SERVICE" \
                              '[.[] | select(.name | startswith($svc + "-v"))] | sort_by(.name | ltrimstr($svc + "-v") | split(".") | map(tonumber)) | reverse | .[0].name // ""')

                            # Parse or initialize version
                            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
                              MAJOR=0; MINOR=0; PATCH=0
                            else
                              VER="${LATEST#${SERVICE}-v}"
                              MAJOR=$(echo "$VER" | cut -d. -f1)
                              MINOR=$(echo "$VER" | cut -d. -f2)
                              PATCH=$(echo "$VER" | cut -d. -f3)
                            fi

                            # Calculate new version
                            case "$BUMP" in
                              major) NEW_VERSION="v$((MAJOR + 1)).0.0" ;;
                              minor) NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0" ;;
                              *) NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                            esac

                            TAG_NAME="${SERVICE}-${NEW_VERSION}"
                            IMAGE_TAG="${NEW_VERSION#v}"

                            echo "╔══════════════════════════════════════════════════════════════╗"
                            echo "║  Service: $SERVICE"
                            echo "║  Branch:  $BRANCH → Bump: $BUMP"
                            echo "║  Current: ${LATEST:-none} → New: $NEW_VERSION"
                            echo "║  Tag:     $TAG_NAME"
                            echo "╚══════════════════════════════════════════════════════════════╝"

                            {
                              echo "VERSION=$NEW_VERSION"
                              echo "IMAGE_TAG=$IMAGE_TAG"
                              echo "TAG_NAME=$TAG_NAME"
                            } >> $HARNESS_OUTPUT_FILE
                          envVariables:
                            SERVICE: <+repeat.item>
                            BRANCH: <+codebase.branch>
                            GITHUB_REPO: crizstian/cinema-microservice-in-GO
                            GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                          outputVariables:
                            - name: VERSION
                            - name: IMAGE_TAG
                            - name: TAG_NAME
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - stepGroup:
                  name: Build and Scan
                  identifier: build_and_scan
                  steps:
                    - step:
                        name: Build Binary
                        identifier: build_binary
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: golang:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_go_version.output.outputVariables.GO_VERSION>-alpine
                          shell: Sh
                          command: |
                            SERVICE_DIR="services/<+repeat.item>"
                            BINARY_PATH="${SERVICE_DIR}/<+repeat.item>"

                            echo "=== Building binary for <+repeat.item> ${VERSION} ==="
                            echo "Go version: $(go version)"
                            echo "Working directory: $(pwd)"
                            echo "Binary output path: ${BINARY_PATH}"

                            cd ${SERVICE_DIR}

                            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
                              go build \
                              -ldflags="-s -w -X main.Version=${VERSION} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                              -o <+repeat.item> \
                              ./cmd/<+repeat.item>

                            cd /harness

                            # Verify binary exists at expected path for Docker context
                            if [ -f "${BINARY_PATH}" ]; then
                              ls -lh ${BINARY_PATH}
                              file ${BINARY_PATH} || true
                              echo "✅ Binary ready at: ${BINARY_PATH}"
                            else
                              echo "❌ Binary not found at: ${BINARY_PATH}"
                              ls -la ${SERVICE_DIR}/
                              exit 1
                            fi
                          envVariables:
                            GOWORK: "off"
                            VERSION: <+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.VERSION>
                    - step:
                        name: Build Docker Image
                        identifier: build_docker_image
                        type: BuildAndPushDockerRegistry
                        spec:
                          connectorRef: DockerCristian
                          repo: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                          tags:
                            - <+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                          dockerfile: <+pipeline.variables.DOCKERFILE_PATH>
                          context: .
                          buildArgs:
                            SERVICE_NAME: <+repeat.item>
                            SERVICE_PORT: "8000"
                            VERSION: <+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                          target: runtime
                          caching: true
                          envVariables:
                            PLUGIN_NO_PUSH: "true"
                            PLUGIN_BUILDX_LOAD: "true"
                            PLUGIN_TAR_PATH: /harness/images/<+repeat.item>-service.tar
                    - parallel:
                        - step:
                            type: AquaTrivy
                            name: Trivy Scan
                            identifier: trivy_scan
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                workspace: /harness/images/<+repeat.item>-service.tar
                                name: <+repeat.item>-service
                                variant: <+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              privileged: true
                              image:
                                type: local_archive
                                tag: <+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                                name: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                              sbom:
                                format: spdx-json
                            enforce:
                              policySets:
                                - security_container
                        - step:
                            type: HarnessSCA
                            name: Harness Container
                            identifier: harness_container
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                workspace: /harness/images/<+repeat.item>-service.tar
                                detection: auto
                              advanced:
                                log:
                                  level: info
                              privileged: true
                              image:
                                type: local_archive
                                tag: <+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                                name: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 2
              - step:
                  type: Run
                  name: Evaluate Container Gate
                  identifier: evaluate_container_gate
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      #!/bin/sh
                      set -e

                      sanitize() {
                        val="$1"
                        [ -z "$val" ] || [ "$val" = "null" ] || [ "$val" = "<+null>" ] && echo "0" || echo "$val"
                      }

                      # Thresholds from pipeline variables
                      MAX_CRITICAL=$GATE_CRITICAL
                      MAX_HIGH=$GATE_HIGH

                      # Sanitize scanner outputs
                      TRIVY_C=$(sanitize "$TRIVY_CRITICAL"); TRIVY_H=$(sanitize "$TRIVY_HIGH")
                      HARNESS_C=$(sanitize "$HARNESS_CRITICAL"); HARNESS_H=$(sanitize "$HARNESS_HIGH")
                      NEW_CRIT=$(sanitize "$TRIVY_NEW_CRITICAL")

                      # Calculate totals
                      TOTAL_CRITICAL=$((TRIVY_C + HARNESS_C))
                      TOTAL_HIGH=$((TRIVY_H + HARNESS_H))

                      # Evaluate gate
                      GATE_PASSED=true
                      VIOLATIONS=""
                      [ "$TOTAL_CRITICAL" -gt "$MAX_CRITICAL" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}CRITICAL:${TOTAL_CRITICAL}(max:${MAX_CRITICAL}) "
                      [ "$TOTAL_HIGH" -gt "$MAX_HIGH" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}HIGH:${TOTAL_HIGH}(max:${MAX_HIGH}) "
                      [ "$NEW_CRIT" -gt 0 ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}NEW_CRITICAL:${NEW_CRIT}"

                      # Report
                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║            CONTAINER SECURITY GATE - EVALUATION              ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      printf "║  Critical:     %-3s (max: %-3s)                               ║\n" "$TOTAL_CRITICAL" "$MAX_CRITICAL"
                      printf "║  High:         %-3s (max: %-3s)                               ║\n" "$TOTAL_HIGH" "$MAX_HIGH"
                      printf "║  New Critical: %-3s                                          ║\n" "$NEW_CRIT"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      if [ "$GATE_PASSED" = "true" ]; then
                        echo "║  ✅ GATE PASSED - Image approved for release                 ║"
                      else
                        echo "║  ⚠️  GATE FAILED - Violations: $VIOLATIONS"
                        echo "║  ⏳ Pending manual approval (4h timeout)                     ║"
                      fi
                      echo "╚══════════════════════════════════════════════════════════════╝"

                      # Export outputs
                      {
                        echo "CONTAINER_CRITICAL=$TOTAL_CRITICAL"
                        echo "CONTAINER_HIGH=$TOTAL_HIGH"
                        echo "CONTAINER_GATE_PASSED=$GATE_PASSED"
                        echo "CONTAINER_VIOLATIONS=$VIOLATIONS"
                      } >> $HARNESS_OUTPUT_FILE

                      [ "$GATE_PASSED" = "false" ] && exit 1 || exit 0
                    envVariables:
                      GATE_CRITICAL: <+pipeline.variables.CONTAINER_GATE_CRITICAL>
                      GATE_HIGH: <+pipeline.variables.CONTAINER_GATE_HIGH>
                      TRIVY_CRITICAL: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.CRITICAL>
                      TRIVY_HIGH: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.HIGH>
                      TRIVY_NEW_CRITICAL: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.NEW_CRITICAL>
                      HARNESS_CRITICAL: <+execution.steps.build_and_scan.steps.harness_container.output.outputVariables.CRITICAL>
                      HARNESS_HIGH: <+execution.steps.build_and_scan.steps.harness_container.output.outputVariables.HIGH>
                    outputVariables:
                      - name: CONTAINER_CRITICAL
                      - name: CONTAINER_HIGH
                      - name: CONTAINER_GATE_PASSED
                      - name: CONTAINER_VIOLATIONS
                  enforce:
                    policySets:
                      - security_gate_container
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 4h
                            onTimeout:
                              action:
                                type: Abort
              - stepGroup:
                  name: Release
                  identifier: release
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.evaluate_container_gate.output.outputVariables.CONTAINER_GATE_PASSED>
                      == "true"
                  steps:
                    - step:
                        type: BuildAndPushDockerRegistry
                        name: Push Docker Image
                        identifier: push_docker_image
                        spec:
                          connectorRef: DockerCristian
                          repo: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                          tags:
                            - <+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                            - latest
                          caching: true
                          envVariables:
                            PLUGIN_PUSH_ONLY: "true"
                            PLUGIN_SOURCE_TAR_PATH: /harness/images/<+repeat.item>-service.tar
                    - step:
                        name: Create Git Tag
                        identifier: create_git_tag
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          command: |
                            apk add --no-cache curl jq > /dev/null 2>&1

                            TAG_NAME="<+execution.steps.detect_versions_<+repeat.item>.steps.semantic_version.output.outputVariables.TAG_NAME>"

                            echo "=== Creating Git Tag: $TAG_NAME ==="

                            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                              "https://api.github.com/repos/${GITHUB_REPO}/git/refs" \
                              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                              -H "Accept: application/vnd.github.v3+json" \
                              -d "{\"ref\":\"refs/tags/${TAG_NAME}\",\"sha\":\"${COMMIT_SHA}\"}")

                            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                            BODY=$(echo "$RESPONSE" | sed '$d')

                            if [ "$HTTP_CODE" = "201" ]; then
                              echo "✅ Tag created: $TAG_NAME"
                            elif [ "$HTTP_CODE" = "422" ]; then
                              echo "ℹ️  Tag already exists: $TAG_NAME"
                            else
                              echo "❌ Failed to create tag: $HTTP_CODE"
                              echo "$BODY"
                              exit 1
                            fi
                          envVariables:
                            GITHUB_REPO: crizstian/cinema-microservice-in-GO
                            GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                            COMMIT_SHA: <+codebase.commitSha>
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 2
              - step:
                  name: Release Summary
                  identifier: release_summary
                  type: Run
                  when:
                    stageStatus: Success
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      apk add --no-cache curl jq > /dev/null 2>&1

                      # Find associated PR
                      PR_DATA=$(curl -s "https://api.github.com/repos/${GITHUB_REPO}/commits/${COMMIT_SHA}/pulls" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github.v3+json")
                      PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number // empty')

                      GATE_STATUS="<+execution.steps.evaluate_container_gate.output.outputVariables.CONTAINER_GATE_PASSED>"
                      if [ "$GATE_STATUS" = "true" ]; then
                        STATUS_ICON="✅"
                        STATUS_TEXT="Released"
                      else
                        STATUS_ICON="⚠️"
                        STATUS_TEXT="Blocked"
                      fi

                      SUMMARY_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

                      COMMENT="## ${STATUS_ICON} Release Summary

                      **Pipeline:** ${PIPELINE_NAME} #${PIPELINE_SEQ}
                      **Date:** ${SUMMARY_DATE}
                      **Status:** ${STATUS_TEXT}

                      ### Services

                      | Service | Version | Image | Status |
                      |---------|---------|-------|--------|"

                      for svc in $(echo "$SERVICES" | tr ',' ' '); do
                        COMMENT="${COMMENT}
                      | ${svc} | See tags | \`${DOCKER_REGISTRY}/${svc}-service\` | ${STATUS_ICON} |"
                      done

                      COMMENT="${COMMENT}

                      ### Security Gates

                      | Gate | Status |
                      |------|--------|
                      | Container Security | ${STATUS_ICON} ${STATUS_TEXT} |

                      ---

                      [View Execution](${EXECUTION_URL}) | Commit: \`${COMMIT_SHA:0:7}\`"

                      # Post to PR if exists
                      if [ -n "$PR_NUMBER" ]; then
                        curl -s -X POST \
                          "https://api.github.com/repos/${GITHUB_REPO}/issues/${PR_NUMBER}/comments" \
                          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                          -H "Accept: application/vnd.github.v3+json" \
                          -d "$(jq -n --arg body "$COMMENT" '{body: $body}')" > /dev/null
                        echo "✅ Summary posted to PR #${PR_NUMBER}"
                      fi

                      # Update commit status
                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        -d "{\"state\":\"success\",\"target_url\":\"${EXECUTION_URL}\",\"description\":\"Release ${STATUS_TEXT}\",\"context\":\"harness-ci/release\"}" > /dev/null

                      echo "✅ Commit status updated"
                    envVariables:
                      SERVICES: <+pipeline.variables.SERVICES>
                      DOCKER_REGISTRY: <+pipeline.variables.DOCKER_REGISTRY>
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      PIPELINE_NAME: <+pipeline.name>
                      PIPELINE_SEQ: <+pipeline.sequenceId>
        policySetRef:
          - security_gate_container
  allowStageExecutions: true
