pipeline:
  name: CI - Unified Pipeline v3
  identifier: CI_Unified_v3
  orgIdentifier: sandbox
  projectIdentifier: CristianRamirez
  tags:
    version: "3.0"
    language: go
    type: unified
    approach: shift-left
    artifact: single
  description: |
    Production-ready CI pipeline:
    - RUN_MODE driven: validate (PR) / build (test) / full (release)
    - Single artifact: one image, one semantic version tag
    - GitHub status checks: blocks merge until compliance
    - Consistent PR comments across all stages
  properties:
    ci:
      codebase:
        connectorRef: CristianConnector
        repoName: cinema-microservice-in-GO
        build: <+input>
        prCloneStrategy: SourceBranch
        sparseCheckout: []
        depth: 50
  variables:
    - name: RUN_MODE
      type: String
      description: |
        Execution mode:
        - validate: Code quality + security only (PR open)
        - build: Validate + Build + Scan container (testing)
        - full: Complete pipeline with push and release (PR merged)
      required: true
      value: <+input>.allowedValues(validate,build,full)
    - name: SERVICES
      type: String
      description: Comma-separated list of services
      required: true
      value: <+input>
    - name: GO_VERSION
      type: String
      description: Go version for builds
      required: false
      value: <+input>.default(1.26).selectOneFrom(1.24,1.23,1.22,1.26)
    - name: COVERAGE_THRESHOLD
      type: String
      description: Minimum test coverage percentage
      required: false
      value: "80"
    - name: SECURITY_GATE_CRITICAL
      type: String
      description: Max critical vulnerabilities (0 = block all)
      required: false
      value: "0"
    - name: SECURITY_GATE_HIGH
      type: String
      description: Max high vulnerabilities
      required: false
      value: "5"
    - name: SECURITY_GATE_SECRETS
      type: String
      description: Max secrets allowed
      required: false
      value: "0"
    - name: CONTAINER_GATE_CRITICAL
      type: String
      description: Max critical container vulnerabilities
      required: false
      value: "0"
    - name: CONTAINER_GATE_HIGH
      type: String
      description: Max high container vulnerabilities
      required: false
      value: "3"
    - name: VERSION_BUMP
      type: String
      description: |
        Auto-detected from branch naming:
        - major/*, breaking/* → major
        - feature/*, feat/* → minor
        - fix/*, bugfix/*, hotfix/*, chore/*, docs/* → patch
        - Manual execution → patch (default)
      required: false
      value: auto
    - name: DOCKER_REGISTRY
      type: String
      description: Docker registry for images
      required: false
      value: docker.io/crizstian
  stages:
    - stage:
        name: Validate Code
        identifier: validate_code
        description: Code quality, security scans, and tests
        type: SecurityTests
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.RUN_MODE> == "validate" ||
            <+pipeline.variables.RUN_MODE> == "build" ||
            <+pipeline.variables.RUN_MODE> == "full"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            key: go-mod-<+hashFiles("**/go.sum")>
            paths:
              - /harness/.go
            override: false
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: GitHub Status - Code Pending
                  identifier: github_status_code_pending
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # Skip GitHub status for manual executions without PR context
                      if [ "$TRIGGER_TYPE" = "MANUAL" ] && [ -z "$PR_NUMBER" -o "$PR_NUMBER" = "null" ]; then
                        echo "ℹ️  Manual execution without PR - skipping GitHub status"
                        exit 0
                      fi

                      apk add --no-cache curl > /dev/null 2>&1

                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        -d "{
                          \"state\": \"pending\",
                          \"target_url\": \"${EXECUTION_URL}\",
                          \"description\": \"Code validation in progress...\",
                          \"context\": \"harness-ci/code-security\"
                        }" > /dev/null

                      echo "GitHub status [code-security]: PENDING"
                    envVariables:
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      PR_NUMBER: <+codebase.prNumber>
              - stepGroup:
                  name: Code Quality
                  identifier: code_quality
                  steps:
                    - parallel:
                        - step:
                            name: Complexity Analysis
                            identifier: complexity_analysis
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: golang:<+pipeline.variables.GO_VERSION>
                              shell: Sh
                              envVariables:
                                MAX_COMPLEXITY: "15"
                              command: |
                                echo "=== Complexity Analysis: <+repeat.item> ==="
                                cd services/<+repeat.item>

                                go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
                                export PATH=$(go env GOPATH)/bin:$PATH

                                echo "Checking cyclomatic complexity (max: $MAX_COMPLEXITY)..."
                                COMPLEX=$(gocyclo -over $MAX_COMPLEXITY . 2>/dev/null || true)

                                if [ -n "$COMPLEX" ]; then
                                  echo "WARNING: Functions exceeding complexity threshold:"
                                  echo "$COMPLEX"
                                  echo ""
                                  echo "Consider refactoring these functions."
                                else
                                  echo "OK - No functions exceed complexity $MAX_COMPLEXITY"
                                fi
                        - step:
                            name: Code Duplication
                            identifier: code_duplication
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: golang:<+pipeline.variables.GO_VERSION>
                              shell: Sh
                              envVariables:
                                MIN_TOKENS: "100"
                              command: |
                                echo "=== Code Duplication Check: <+repeat.item> ==="
                                cd services/<+repeat.item>

                                go install github.com/mibk/dupl@latest
                                export PATH=$(go env GOPATH)/bin:$PATH

                                echo "Checking for duplicated code blocks (threshold: $MIN_TOKENS tokens)..."
                                DUPES=$(dupl -threshold $MIN_TOKENS -plumbing . 2>/dev/null || true)

                                if [ -n "$DUPES" ]; then
                                  echo "WARNING: Duplicated code detected:"
                                  dupl -threshold $MIN_TOKENS .
                                  echo ""
                                  echo "Consider extracting common code to reduce duplication."
                                else
                                  echo "OK - No significant code duplication found"
                                fi
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - stepGroup:
                  name: Security Scans
                  identifier: security_scans
                  steps:
                    - parallel:
                        - step:
                            type: HarnessSAST
                            name: SAST - Harness
                            identifier: harness_sast
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              tool:
                                app_name: <+repeat.item>
                            enforce:
                              policySets:
                                - STO_Policy
                        - step:
                            type: HarnessSCA
                            name: SCA - Harness
                            identifier: harness_sca
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              privileged: true
                              tool:
                                app_name: <+repeat.item>
                            enforce:
                              policySets:
                                - STO_Policy
                        - step:
                            type: Snyk
                            name: SAST/SCA - Snyk
                            identifier: snyk_scan
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: manual
                                name: <+repeat.item>
                                variant: <+codebase.branch>
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                                args:
                                  cli: "--skip-unresolved"
                              privileged: true
                              auth:
                                access_token: <+secrets.getValue("snyk_token")>
                              sbom:
                                format: spdx-json
                            enforce:
                              policySets:
                                - STO_Policy
                        - step:
                            type: Gitleaks
                            name: Secrets - Gitleaks
                            identifier: gitleaks
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: repository
                                workspace: services/<+repeat.item>
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                            enforce:
                              policySets:
                                - security_secrets
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - stepGroup:
                  name: Tests
                  identifier: tests
                  steps:
                    - parallel:
                        - step:
                            type: Test
                            name: Unit Tests
                            identifier: unit_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: golang:<+pipeline.variables.GO_VERSION>
                              shell: Bash
                              command: |
                                echo "=== Running unit tests for <+repeat.item> ==="
                                cd services/<+repeat.item>

                                go install github.com/jstemmer/go-junit-report/v2@latest
                                export PATH=$(go env GOPATH)/bin:$PATH

                                # Exclude integration tests and contracts (tested separately)
                                PACKAGES=$(go list ./... | grep -v -E '(integration_tests|contracts)')

                                set -o pipefail
                                go test -v -race -short -coverprofile=coverage.out $PACKAGES 2>&1 | tee test-output.txt
                                TEST_EXIT=$?

                                echo "=== Coverage Report ==="
                                COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
                                echo "Coverage: ${COVERAGE}%"
                                echo "Threshold: <+pipeline.variables.COVERAGE_THRESHOLD>%"

                                go-junit-report -set-exit-code < test-output.txt > report.xml
                                exit $TEST_EXIT
                              reports:
                                type: JUnit
                                spec:
                                  paths:
                                    - "**/report.xml"
                              intelligenceMode: true
                        - step:
                            type: Test
                            name: Benchmark Tests
                            identifier: benchmark_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: golang:<+pipeline.variables.GO_VERSION>
                              shell: Bash
                              command: |
                                echo "=== Running benchmarks for <+repeat.item> ==="
                                cd services/<+repeat.item>

                                go install github.com/jstemmer/go-junit-report/v2@latest
                                export PATH=$(go env GOPATH)/bin:$PATH

                                # Exclude integration tests and contracts
                                PACKAGES=$(go list ./... | grep -v -E '(integration_tests|contracts)')

                                set -o pipefail
                                go test -v -short -bench=. -benchmem -benchtime=1s $PACKAGES 2>&1 | tee benchmark-output.txt

                                echo "=== Benchmark Summary ==="
                                grep -E "^Benchmark" benchmark-output.txt || echo "No benchmarks found"

                                go-junit-report < benchmark-output.txt > benchmark-report.xml || true
                              reports:
                                type: JUnit
                                spec:
                                  paths:
                                    - "**/benchmark-report.xml"
                              intelligenceMode: true
                        - step:
                            type: Test
                            name: Contract Tests
                            identifier: contract_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: golang:<+pipeline.variables.GO_VERSION>
                              shell: Bash
                              command: |
                                echo "=== Running contract tests for <+repeat.item> ==="
                                cd services/<+repeat.item>

                                go install github.com/jstemmer/go-junit-report/v2@latest
                                export PATH=$(go env GOPATH)/bin:$PATH

                                set -o pipefail

                                # Check for consumer contract tests (Pact-based)
                                if [ -d "contracts/consumer" ] && ls contracts/consumer/*_test.go >/dev/null 2>&1; then
                                  echo "Found consumer contract tests in contracts/consumer/"
                                  go test -v ./contracts/consumer/... 2>&1 | tee contract-output.txt || true
                                  go-junit-report < contract-output.txt > contract-report.xml
                                # Check for provider contract tests
                                elif [ -d "contracts/provider" ] && ls contracts/provider/*_test.go >/dev/null 2>&1; then
                                  echo "Found provider contract tests in contracts/provider/"
                                  PACT_PROVIDER_VERIFICATION=true go test -v ./contracts/provider/... 2>&1 | tee contract-output.txt || true
                                  go-junit-report < contract-output.txt > contract-report.xml
                                # Check for contracts directory with tests
                                elif [ -d "contracts" ] && ls contracts/*_test.go >/dev/null 2>&1; then
                                  echo "Found contract tests in contracts/"
                                  go test -v ./contracts/... 2>&1 | tee contract-output.txt || true
                                  go-junit-report < contract-output.txt > contract-report.xml
                                else
                                  echo "No contract tests found - skipping"
                                  echo '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="contract" tests="0" failures="0" errors="0" skipped="0"></testsuite></testsuites>' > contract-report.xml
                                fi
                              reports:
                                type: JUnit
                                spec:
                                  paths:
                                    - "**/contract-report.xml"
                              intelligenceMode: true
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - stepGroup:
                  name: API Validation
                  identifier: api_validation
                  steps:
                    - step:
                        type: Run
                        name: Spectral OpenAPI Lint
                        identifier: spectral_lint
                        spec:
                          connectorRef: account.harnessImage
                          image: stoplight/spectral:6
                          shell: Sh
                          command: |
                            echo "=== Spectral OpenAPI Validation for <+repeat.item> ==="
                            cd /harness
                            SERVICE="<+repeat.item>"

                            # Check for OpenAPI spec in standard locations
                            SPEC_FILE="services/${SERVICE}/api/openapi.yaml"
                            if [ ! -f "$SPEC_FILE" ]; then
                              SPEC_FILE="services/${SERVICE}/api/openapi.json"
                            fi
                            if [ ! -f "$SPEC_FILE" ]; then
                              SPEC_FILE="services/${SERVICE}/openapi.yaml"
                            fi

                            if [ ! -f "$SPEC_FILE" ]; then
                              echo "No OpenAPI spec found for ${SERVICE} - skipping"
                              echo "Checked: services/${SERVICE}/api/openapi.yaml"
                              exit 0
                            fi

                            echo "Found OpenAPI spec: $SPEC_FILE"
                            echo ""

                            # Run Spectral lint - fail on errors
                            if [ -f ".spectral.yaml" ]; then
                              echo "Using ruleset: .spectral.yaml"
                              spectral lint "$SPEC_FILE" --ruleset .spectral.yaml
                            else
                              echo "Using default Spectral rules"
                              spectral lint "$SPEC_FILE"
                            fi

                            echo ""
                            echo "OpenAPI validation completed"
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - step:
                  type: Run
                  name: Code Security Gate
                  identifier: code_security_gate
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      #!/bin/sh
                      sanitize() { val="$1"; [ -z "$val" ] || [ "$val" = "null" ] && echo "0" || echo "$val"; }

                      MAX_CRIT=$GATE_CRITICAL; MAX_HIGH=$GATE_HIGH; MAX_SEC=$GATE_SECRETS

                      H_SAST_C=$(sanitize "$HARNESS_SAST_C"); H_SAST_H=$(sanitize "$HARNESS_SAST_H")
                      H_SCA_C=$(sanitize "$HARNESS_SCA_C"); H_SCA_H=$(sanitize "$HARNESS_SCA_H")
                      SNYK_C=$(sanitize "$SNYK_C"); SNYK_H=$(sanitize "$SNYK_H")
                      SEMGREP_C=$(sanitize "$SEMGREP_C"); SEMGREP_H=$(sanitize "$SEMGREP_H")
                      GL_T=$(sanitize "$GITLEAKS_T")

                      TOTAL_C=$((H_SAST_C + H_SCA_C + SNYK_C + SEMGREP_C))
                      TOTAL_H=$((H_SAST_H + H_SCA_H + SNYK_H + SEMGREP_H))
                      TOTAL_S=$GL_T

                      PASSED=true; VIOL=""
                      [ "$TOTAL_C" -gt "$MAX_CRIT" ] && PASSED=false && VIOL="${VIOL}CRIT:${TOTAL_C}/${MAX_CRIT} "
                      [ "$TOTAL_H" -gt "$MAX_HIGH" ] && PASSED=false && VIOL="${VIOL}HIGH:${TOTAL_H}/${MAX_HIGH} "
                      [ "$TOTAL_S" -gt "$MAX_SEC" ] && PASSED=false && VIOL="${VIOL}SECRETS:${TOTAL_S}/${MAX_SEC}"

                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║              CODE SECURITY GATE                              ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      printf "║  HarnessSAST: Crit=%-2s High=%-2s                               ║\n" "$H_SAST_C" "$H_SAST_H"
                      printf "║  HarnessSCA:  Crit=%-2s High=%-2s                               ║\n" "$H_SCA_C" "$H_SCA_H"
                      printf "║  Snyk:        Crit=%-2s High=%-2s                               ║\n" "$SNYK_C" "$SNYK_H"
                      printf "║  Semgrep:     Crit=%-2s High=%-2s                               ║\n" "$SEMGREP_C" "$SEMGREP_H"
                      printf "║  Gitleaks:    Secrets=%-2s                                     ║\n" "$GL_T"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      printf "║  TOTAL: Crit=%-2s (max:%s) High=%-2s (max:%s) Secrets=%-2s (max:%s)  ║\n" \
                        "$TOTAL_C" "$MAX_CRIT" "$TOTAL_H" "$MAX_HIGH" "$TOTAL_S" "$MAX_SEC"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      [ "$PASSED" = "true" ] && echo "║  ✅ CODE SECURITY GATE: PASSED                               ║" \
                                             || echo "║  ⚠️  CODE SECURITY GATE: FAILED - ${VIOL}"
                      echo "╚══════════════════════════════════════════════════════════════╝"

                      echo "CODE_CRITICAL=$TOTAL_C" >> $HARNESS_OUTPUT_FILE
                      echo "CODE_HIGH=$TOTAL_H" >> $HARNESS_OUTPUT_FILE
                      echo "CODE_SECRETS=$TOTAL_S" >> $HARNESS_OUTPUT_FILE
                      echo "CODE_GATE_PASSED=$PASSED" >> $HARNESS_OUTPUT_FILE
                      echo "CODE_VIOLATIONS=$VIOL" >> $HARNESS_OUTPUT_FILE

                      [ "$PASSED" = "false" ] && exit 1
                      exit 0
                    envVariables:
                      GATE_CRITICAL: <+pipeline.variables.SECURITY_GATE_CRITICAL>
                      GATE_HIGH: <+pipeline.variables.SECURITY_GATE_HIGH>
                      GATE_SECRETS: <+pipeline.variables.SECURITY_GATE_SECRETS>
                      HARNESS_SAST_C: <+execution.steps.security_scans.steps.harness_sast.output.outputVariables.CRITICAL>
                      HARNESS_SAST_H: <+execution.steps.security_scans.steps.harness_sast.output.outputVariables.HIGH>
                      HARNESS_SCA_C: <+execution.steps.security_scans.steps.harness_sca.output.outputVariables.CRITICAL>
                      HARNESS_SCA_H: <+execution.steps.security_scans.steps.harness_sca.output.outputVariables.HIGH>
                      SNYK_C: <+execution.steps.security_scans.steps.snyk_scan.output.outputVariables.CRITICAL>
                      SNYK_H: <+execution.steps.security_scans.steps.snyk_scan.output.outputVariables.HIGH>
                      SEMGREP_C: <+execution.steps.security_scans.steps.semgrep_scan.output.outputVariables.CRITICAL>
                      SEMGREP_H: <+execution.steps.security_scans.steps.semgrep_scan.output.outputVariables.HIGH>
                      GITLEAKS_T: <+execution.steps.security_scans.steps.gitleaks.output.outputVariables.TOTAL>
                    outputVariables:
                      - name: CODE_CRITICAL
                        type: String
                        value: CODE_CRITICAL
                      - name: CODE_HIGH
                        type: String
                        value: CODE_HIGH
                      - name: CODE_SECRETS
                        type: String
                        value: CODE_SECRETS
                      - name: CODE_GATE_PASSED
                        type: String
                        value: CODE_GATE_PASSED
                      - name: CODE_VIOLATIONS
                        type: String
                        value: CODE_VIOLATIONS
                  enforce:
                    policySets:
                      - security_gate_code
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 4h
                            onTimeout:
                              action:
                                type: Abort
              - step:
                  type: Run
                  name: GitHub Status - Code Final
                  identifier: github_status_code_final
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # Skip GitHub status for manual executions without PR context
                      if [ "$TRIGGER_TYPE" = "MANUAL" ] && [ -z "$PR_NUMBER" -o "$PR_NUMBER" = "null" ]; then
                        echo "ℹ️  Manual execution without PR - skipping GitHub status"
                        exit 0
                      fi

                      apk add --no-cache curl > /dev/null 2>&1

                      if [ "$CODE_GATE_PASSED" = "true" ]; then
                        STATE="success"
                        DESC="Code security validation passed"
                      else
                        STATE="failure"
                        DESC="Code security failed: ${CODE_VIOLATIONS}"
                      fi

                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        -d "{
                          \"state\": \"${STATE}\",
                          \"target_url\": \"${EXECUTION_URL}\",
                          \"description\": \"${DESC}\",
                          \"context\": \"harness-ci/code-security\"
                        }" > /dev/null

                      echo "GitHub status [code-security]: ${STATE}"
                    envVariables:
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      PR_NUMBER: <+codebase.prNumber>
                      CODE_GATE_PASSED: <+execution.steps.code_security_gate.output.outputVariables.CODE_GATE_PASSED>
                      CODE_VIOLATIONS: <+execution.steps.code_security_gate.output.outputVariables.CODE_VIOLATIONS>
                  when:
                    stageStatus: All
        policySetRef:
          - security_gate_code
    - stage:
        name: Validate Container
        identifier: validate_container
        description: Build Docker image and security scan BEFORE push
        type: SecurityTests
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.RUN_MODE> == "build" ||
            <+pipeline.variables.RUN_MODE> == "full"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            key: go-docker-<+hashFiles("**/go.sum", "**/Dockerfile")>
            paths:
              - /harness/.docker-cache
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: GitHub Status - Container Pending
                  identifier: github_status_container_pending
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # Skip GitHub status for manual executions without PR context
                      if [ "$TRIGGER_TYPE" = "MANUAL" ] && [ -z "$PR_NUMBER" -o "$PR_NUMBER" = "null" ]; then
                        echo "ℹ️  Manual execution without PR - skipping GitHub status"
                        exit 0
                      fi

                      apk add --no-cache curl > /dev/null 2>&1

                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        -d "{
                          \"state\": \"pending\",
                          \"target_url\": \"${EXECUTION_URL}\",
                          \"description\": \"Container build and scan in progress...\",
                          \"context\": \"harness-ci/container-security\"
                        }" > /dev/null

                      echo "GitHub status [container-security]: PENDING"
                    envVariables:
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      PR_NUMBER: <+codebase.prNumber>
              - stepGroup:
                  name: Build and Scan
                  identifier: build_and_scan
                  steps:
                    - step:
                        name: Build Binary
                        identifier: build_binary
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: golang:<+pipeline.variables.GO_VERSION>
                          shell: Sh
                          envVariables:
                            SERVICE: <+repeat.item>
                            VERSION: <+codebase.shortCommitSha>
                            COMMIT_SHA: <+codebase.commitSha>
                          command: |
                            echo "=== Building Go binary for $SERVICE ==="
                            cd services/$SERVICE

                            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
                              go build -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitSHA=${COMMIT_SHA}" \
                              -o $SERVICE \
                              ./cmd/$SERVICE

                            echo "Binary built: $(ls -lh $SERVICE)"
                    - step:
                        name: Build Image
                        identifier: build_image
                        type: BuildAndPushDockerRegistry
                        spec:
                          connectorRef: DockerCristian
                          repo: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                          tags:
                            - <+codebase.shortCommitSha>
                          caching: true
                          dockerfile: platform/docker/go-service/Dockerfile
                          context: .
                          target: runtime-prebuilt
                          buildArgs:
                            SERVICE_NAME: <+repeat.item>
                            SERVICE_PORT: "8000"
                            VERSION: <+codebase.shortCommitSha>
                          optimize: true
                          envVariables:
                            PLUGIN_TAR_PATH: /harness/<+repeat.item>-service.tar
                            PLUGIN_NO_PUSH: "true"
                    - parallel:
                        - step:
                            type: AquaTrivy
                            name: Trivy Scan
                            identifier: trivy_scan
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                name: <+repeat.item>-service
                                variant: <+codebase.shortCommitSha>
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              privileged: true
                              image:
                                type: local_image
                                tag: <+codebase.shortCommitSha>
                                name: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                              sbom:
                                format: spdx-json
                            enforce:
                              policySets:
                                - security_container
                            when:
                              stageStatus: Success
                        - step:
                            type: HarnessSCA
                            name: Harness Container SCA
                            identifier: harness_container_sca
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                detection: auto
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              privileged: true
                              image:
                                type: local_image
                                tag: <+codebase.shortCommitSha>
                                name: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                            enforce:
                              policySets:
                                - security_container
                            when:
                              stageStatus: Success
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 2
              - step:
                  type: Run
                  name: Container Security Gate
                  identifier: container_security_gate
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      #!/bin/sh
                      sanitize() { val="$1"; [ -z "$val" ] || [ "$val" = "null" ] && echo "0" || echo "$val"; }

                      MAX_CRIT=$GATE_CRITICAL; MAX_HIGH=$GATE_HIGH

                      TRIVY_C=$(sanitize "$TRIVY_C"); TRIVY_H=$(sanitize "$TRIVY_H")
                      HARNESS_C=$(sanitize "$HARNESS_C"); HARNESS_H=$(sanitize "$HARNESS_H")

                      TOTAL_C=$((TRIVY_C + HARNESS_C))
                      TOTAL_H=$((TRIVY_H + HARNESS_H))

                      PASSED=true; VIOL=""
                      [ "$TOTAL_C" -gt "$MAX_CRIT" ] && PASSED=false && VIOL="${VIOL}CRIT:${TOTAL_C}/${MAX_CRIT} "
                      [ "$TOTAL_H" -gt "$MAX_HIGH" ] && PASSED=false && VIOL="${VIOL}HIGH:${TOTAL_H}/${MAX_HIGH}"

                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║            CONTAINER SECURITY GATE                           ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      printf "║  Trivy:   Critical=%-2s High=%-2s                               ║\n" "$TRIVY_C" "$TRIVY_H"
                      printf "║  Harness: Critical=%-2s High=%-2s                               ║\n" "$HARNESS_C" "$HARNESS_H"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      printf "║  TOTAL: Critical=%-2s (max:%s) High=%-2s (max:%s)                 ║\n" \
                        "$TOTAL_C" "$MAX_CRIT" "$TOTAL_H" "$MAX_HIGH"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      if [ "$PASSED" = "true" ]; then
                        echo "║  ✅ CONTAINER GATE: PASSED                                    ║"
                      else
                        echo "║  ⚠️  CONTAINER GATE: FAILED - ${VIOL}"
                      fi
                      echo "╚══════════════════════════════════════════════════════════════╝"

                      echo "CONTAINER_CRITICAL=$TOTAL_C" >> $HARNESS_OUTPUT_FILE
                      echo "CONTAINER_HIGH=$TOTAL_H" >> $HARNESS_OUTPUT_FILE
                      echo "CONTAINER_GATE_PASSED=$PASSED" >> $HARNESS_OUTPUT_FILE
                      echo "CONTAINER_VIOLATIONS=$VIOL" >> $HARNESS_OUTPUT_FILE

                      [ "$PASSED" = "false" ] && exit 1
                      exit 0
                    envVariables:
                      GATE_CRITICAL: <+pipeline.variables.CONTAINER_GATE_CRITICAL>
                      GATE_HIGH: <+pipeline.variables.CONTAINER_GATE_HIGH>
                      TRIVY_C: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.CRITICAL>
                      TRIVY_H: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.HIGH>
                      HARNESS_C: <+execution.steps.build_and_scan.steps.harness_container_sca.output.outputVariables.CRITICAL>
                      HARNESS_H: <+execution.steps.build_and_scan.steps.harness_container_sca.output.outputVariables.HIGH>
                    outputVariables:
                      - name: CONTAINER_CRITICAL
                        type: String
                        value: CONTAINER_CRITICAL
                      - name: CONTAINER_HIGH
                        type: String
                        value: CONTAINER_HIGH
                      - name: CONTAINER_GATE_PASSED
                        type: String
                        value: CONTAINER_GATE_PASSED
                      - name: CONTAINER_VIOLATIONS
                        type: String
                        value: CONTAINER_VIOLATIONS
                  enforce:
                    policySets:
                      - security_gate_container
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 4h
                            onTimeout:
                              action:
                                type: Abort
              - step:
                  type: Run
                  name: GitHub Status - Container Final
                  identifier: github_status_container_final
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # Skip GitHub status for manual executions without PR context
                      if [ "$TRIGGER_TYPE" = "MANUAL" ] && [ -z "$PR_NUMBER" -o "$PR_NUMBER" = "null" ]; then
                        echo "ℹ️  Manual execution without PR - skipping GitHub status"
                        exit 0
                      fi

                      apk add --no-cache curl > /dev/null 2>&1

                      if [ "$CONTAINER_GATE_PASSED" = "true" ]; then
                        STATE="success"
                        DESC="Container security validation passed"
                      else
                        STATE="failure"
                        DESC="Container security failed: ${CONTAINER_VIOLATIONS}"
                      fi

                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        -d "{
                          \"state\": \"${STATE}\",
                          \"target_url\": \"${EXECUTION_URL}\",
                          \"description\": \"${DESC}\",
                          \"context\": \"harness-ci/container-security\"
                        }" > /dev/null

                      echo "GitHub status [container-security]: ${STATE}"
                    envVariables:
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      PR_NUMBER: <+codebase.prNumber>
                      CONTAINER_GATE_PASSED: <+execution.steps.container_security_gate.output.outputVariables.CONTAINER_GATE_PASSED>
                      CONTAINER_VIOLATIONS: <+execution.steps.container_security_gate.output.outputVariables.CONTAINER_VIOLATIONS>
                  when:
                    stageStatus: All
          buildIntelligence:
            enabled: true
        policySetRef:
          - security_gate_container
    - stage:
        name: Push and Release
        identifier: push_release
        description: Push verified image with BuildAndPushDockerRegistry
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.RUN_MODE> == "full"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            key: go-release-<+hashFiles("**/go.sum")>
            paths:
              - /harness/.go
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: GitHub Status - Release Pending
                  identifier: github_status_release_pending
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # Skip GitHub status for manual executions without PR context
                      if [ "$TRIGGER_TYPE" = "MANUAL" ] && [ -z "$PR_NUMBER" -o "$PR_NUMBER" = "null" ]; then
                        echo "ℹ️  Manual execution without PR - skipping GitHub status"
                        exit 0
                      fi

                      apk add --no-cache curl > /dev/null 2>&1

                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        -d "{
                          \"state\": \"pending\",
                          \"target_url\": \"${EXECUTION_URL}\",
                          \"description\": \"Pushing image and creating release...\",
                          \"context\": \"harness-ci/release\"
                        }" > /dev/null

                      echo "GitHub status [release]: PENDING"
                    envVariables:
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      PR_NUMBER: <+codebase.prNumber>
              - step:
                  type: Run
                  name: Detect Version Bump
                  identifier: detect_version_bump
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    envVariables:
                      BRANCH: <+codebase.branch>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      PR_TITLE: <+codebase.prTitle>
                    command: |
                      #!/bin/sh
                      echo "=== Version Bump Detection ==="
                      echo "Branch: $BRANCH"
                      echo "Trigger: $TRIGGER_TYPE"
                      echo "PR Title: ${PR_TITLE:-N/A}"

                      # Default to patch
                      BUMP="patch"

                      # Extract prefix from branch name (e.g., feature/xyz -> feature)
                      PREFIX=$(echo "$BRANCH" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')

                      case "$PREFIX" in
                        major|breaking)
                          BUMP="major"
                          ;;
                        feature|feat|minor)
                          BUMP="minor"
                          ;;
                        fix|bugfix|hotfix|patch|chore|docs|refactor|ci|test)
                          BUMP="patch"
                          ;;
                        release)
                          # Check if release branch specifies bump type
                          # e.g., release/major-2.0 or release/v2.0-major
                          if echo "$BRANCH" | grep -qi "major"; then
                            BUMP="major"
                          elif echo "$BRANCH" | grep -qi "minor"; then
                            BUMP="minor"
                          else
                            BUMP="minor"  # Default for release branches
                          fi
                          ;;
                        main|master|develop)
                          # For direct pushes to main, check PR title if available
                          if echo "$PR_TITLE" | grep -qiE "^(breaking|major)"; then
                            BUMP="major"
                          elif echo "$PR_TITLE" | grep -qiE "^(feat|feature)"; then
                            BUMP="minor"
                          else
                            BUMP="patch"
                          fi
                          ;;
                        *)
                          # Unknown pattern, default to patch
                          BUMP="patch"
                          ;;
                      esac

                      # Manual execution info
                      if [ "$TRIGGER_TYPE" = "MANUAL" ]; then
                        echo "ℹ️  Manual execution detected - using detected bump or patch default"
                      fi

                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║              VERSION BUMP DETECTION                          ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║  Branch:  $BRANCH"
                      echo "║  Prefix:  $PREFIX"
                      echo "║  Trigger: $TRIGGER_TYPE"
                      echo "║  ──────────────────────────────────────────────────────────  ║"
                      echo "║  VERSION_BUMP: $BUMP"
                      echo "╚══════════════════════════════════════════════════════════════╝"

                      echo "VERSION_BUMP=$BUMP" >> $HARNESS_OUTPUT_FILE
                    outputVariables:
                      - name: VERSION_BUMP
                        type: String
                        value: VERSION_BUMP
              - stepGroup:
                  name: Release
                  identifier: release
                  steps:
                    - step:
                        name: Semantic Version
                        identifier: semantic_version
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          envVariables:
                            SERVICE: <+repeat.item>
                            VERSION_BUMP: <+execution.steps.detect_version_bump.output.outputVariables.VERSION_BUMP>
                            GITHUB_REPO: crizstian/cinema-microservice-in-GO
                            GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                            DOCKER_REGISTRY: <+pipeline.variables.DOCKER_REGISTRY>
                          command: |
                            apk add --no-cache jq curl > /dev/null 2>&1

                            TAGS=$(curl -s "https://api.github.com/repos/${GITHUB_REPO}/tags?per_page=100" \
                              -H "Authorization: Bearer ${GITHUB_TOKEN}")

                            LATEST=$(echo "$TAGS" | jq -r --arg svc "$SERVICE" \
                              '[.[] | select(.name | startswith($svc + "-v"))] | sort_by(.name) | reverse | .[0].name // ""')

                            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
                              MAJOR=0; MINOR=0; PATCH=0
                            else
                              VER="${LATEST#${SERVICE}-v}"
                              MAJOR=$(echo "$VER" | cut -d. -f1)
                              MINOR=$(echo "$VER" | cut -d. -f2)
                              PATCH=$(echo "$VER" | cut -d. -f3)
                            fi

                            case "$VERSION_BUMP" in
                              major) NEW="v$((MAJOR + 1)).0.0" ;;
                              minor) NEW="v${MAJOR}.$((MINOR + 1)).0" ;;
                              *) NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                            esac

                            echo ""
                            echo "╔══════════════════════════════════════════════════════════════╗"
                            echo "║              SEMANTIC VERSION                                ║"
                            echo "╠══════════════════════════════════════════════════════════════╣"
                            echo "║  Service: $SERVICE"
                            echo "║  Current: ${LATEST:-none}"
                            echo "║  Bump: $VERSION_BUMP"
                            echo "║  New: $NEW"
                            echo "║  Image: ${DOCKER_REGISTRY}/${SERVICE}-service:${NEW}"
                            echo "╚══════════════════════════════════════════════════════════════╝"

                            echo "VERSION=$NEW" >> $HARNESS_OUTPUT_FILE
                            echo "TAG_NAME=${SERVICE}-${NEW}" >> $HARNESS_OUTPUT_FILE
                            echo "IMAGE_NAME=${DOCKER_REGISTRY}/${SERVICE}-service" >> $HARNESS_OUTPUT_FILE
                            echo "FULL_IMAGE=${DOCKER_REGISTRY}/${SERVICE}-service:${NEW}" >> $HARNESS_OUTPUT_FILE
                          outputVariables:
                            - name: VERSION
                              type: String
                              value: VERSION
                            - name: TAG_NAME
                              type: String
                              value: TAG_NAME
                            - name: IMAGE_NAME
                              type: String
                              value: IMAGE_NAME
                            - name: FULL_IMAGE
                              type: String
                              value: FULL_IMAGE
                    - step:
                        name: Build Binary
                        identifier: build_binary
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: golang:<+pipeline.variables.GO_VERSION>
                          shell: Sh
                          envVariables:
                            SERVICE: <+repeat.item>
                            VERSION: <+stepGroup.steps.semantic_version.output.outputVariables.VERSION>
                            COMMIT_SHA: <+codebase.commitSha>
                          command: |
                            echo "=== Building Go binary for $SERVICE ==="
                            cd services/$SERVICE

                            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
                              go build -ldflags="-s -w -X main.Version=${VERSION} -X main.CommitSHA=${COMMIT_SHA}" \
                              -o $SERVICE \
                              ./cmd/$SERVICE

                            echo "Binary built: $(ls -lh $SERVICE)"
                    - step:
                        type: BuildAndPushDockerRegistry
                        name: Build and Push Docker
                        identifier: build_push_docker
                        spec:
                          connectorRef: DockerCristian
                          repo: crizstian/<+repeat.item>-service
                          tags:
                            - <+stepGroup.steps.semantic_version.output.outputVariables.VERSION>
                            - latest
                          caching: true
                          dockerfile: platform/docker/go-service/Dockerfile
                          context: .
                          target: runtime-prebuilt
                          buildArgs:
                            SERVICE_NAME: <+repeat.item>
                            SERVICE_PORT: "8000"
                            VERSION: <+stepGroup.steps.semantic_version.output.outputVariables.VERSION>
                          optimize: true
                    - step:
                        name: Create Git Tag
                        identifier: create_git_tag
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          envVariables:
                            TAG_NAME: <+stepGroup.steps.semantic_version.output.outputVariables.TAG_NAME>
                            COMMIT_SHA: <+codebase.commitSha>
                            GITHUB_REPO: crizstian/cinema-microservice-in-GO
                            GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                          command: |
                            apk add --no-cache curl > /dev/null 2>&1

                            echo "Creating tag: $TAG_NAME -> $COMMIT_SHA"

                            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                              "https://api.github.com/repos/${GITHUB_REPO}/git/refs" \
                              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                              -H "Accept: application/vnd.github+json" \
                              -d "{\"ref\": \"refs/tags/${TAG_NAME}\", \"sha\": \"${COMMIT_SHA}\"}")

                            [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] \
                              && echo "✅ Tag created: $TAG_NAME" \
                              || echo "⚠️ Tag creation failed (HTTP $HTTP_CODE)"
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 2
              - step:
                  type: Run
                  name: GitHub Status - Release Final
                  identifier: github_status_release_final
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # Skip GitHub status for manual executions without PR context
                      if [ "$TRIGGER_TYPE" = "MANUAL" ] && [ -z "$PR_NUMBER" -o "$PR_NUMBER" = "null" ]; then
                        echo "ℹ️  Manual execution without PR - skipping GitHub status"
                        exit 0
                      fi

                      apk add --no-cache curl > /dev/null 2>&1

                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        -d "{
                          \"state\": \"success\",
                          \"target_url\": \"${EXECUTION_URL}\",
                          \"description\": \"Release completed: ${VERSION}\",
                          \"context\": \"harness-ci/release\"
                        }" > /dev/null

                      echo "GitHub status [release]: SUCCESS"
                    envVariables:
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      PR_NUMBER: <+codebase.prNumber>
                      VERSION: <+execution.steps.release.steps.semantic_version.output.outputVariables.VERSION>
                  when:
                    stageStatus: Success
              - step:
                  type: Run
                  name: PR Comment - Release Summary
                  identifier: pr_comment_summary
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      # Skip PR comment for manual executions or when no PR context
                      if [ "$TRIGGER_TYPE" = "MANUAL" ]; then
                        echo "ℹ️  Manual execution - skipping PR comment"
                        exit 0
                      fi
                      [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ] && echo "No PR context" && exit 0

                      apk add --no-cache curl jq > /dev/null 2>&1

                      BADGES=""
                      for svc in $(echo "$SERVICES" | tr ',' ' '); do
                        BADGES="${BADGES}![${svc}](https://img.shields.io/badge/${svc}-${VERSION}-blue) "
                      done

                      COMMENT=$(cat <<EOF
                      # 🚀 Release Completed

                      ${BADGES}

                      ## Pipeline Summary

                      | Stage | Status | Details |
                      |-------|:------:|---------|
                      | Code Security | ✅ | Crit: ${CODE_CRIT:-0}, High: ${CODE_HIGH:-0}, Secrets: ${CODE_SEC:-0} |
                      | Container Build | ✅ | Image built and scanned |
                      | Container Security | ✅ | Crit: ${CONT_CRIT:-0}, High: ${CONT_HIGH:-0} |
                      | Push to Registry | ✅ | crizstian/*:${VERSION} |
                      | Git Tag | ✅ | ${TAG_NAME} |

                      ## Artifact

                      | Image | Tags |
                      |-------|------|
                      | crizstian/${SERVICES}-service | \`${VERSION}\`, \`latest\` |

                      > **Single Artifact**: This image is deployed to all environments (no rebuild, no retag)

                      ## Security Thresholds

                      | Gate | Critical | High | Secrets | Status |
                      |------|:--------:|:----:|:-------:|:------:|
                      | Code | ${CODE_CRIT:-0}/${GATE_CODE_CRIT} | ${CODE_HIGH:-0}/${GATE_CODE_HIGH} | ${CODE_SEC:-0}/${GATE_CODE_SEC} | ✅ |
                      | Container | ${CONT_CRIT:-0}/${GATE_CONT_CRIT} | ${CONT_HIGH:-0}/${GATE_CONT_HIGH} | - | ✅ |

                      ---

                      **Mode:** \`${RUN_MODE}\` | **Version Bump:** \`${VERSION_BUMP}\`

                      [View Execution](${EXECUTION_URL})
                      EOF
                      )

                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/issues/${PR_NUMBER}/comments" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github+json" \
                        -d "$(jq -n --arg body "$COMMENT" '{body: $body}')" > /dev/null

                      echo "PR comment posted"
                    envVariables:
                      SERVICES: <+pipeline.variables.SERVICES>
                      RUN_MODE: <+pipeline.variables.RUN_MODE>
                      TRIGGER_TYPE: <+pipeline.triggerType>
                      VERSION_BUMP: <+execution.steps.detect_version_bump.output.outputVariables.VERSION_BUMP>
                      VERSION: <+execution.steps.release.steps.semantic_version.output.outputVariables.VERSION>
                      TAG_NAME: <+execution.steps.release.steps.semantic_version.output.outputVariables.TAG_NAME>
                      PR_NUMBER: <+codebase.prNumber>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      CODE_CRIT: <+pipeline.stages.validate_code.spec.execution.steps.code_security_gate.output.outputVariables.CODE_CRITICAL>
                      CODE_HIGH: <+pipeline.stages.validate_code.spec.execution.steps.code_security_gate.output.outputVariables.CODE_HIGH>
                      CODE_SEC: <+pipeline.stages.validate_code.spec.execution.steps.code_security_gate.output.outputVariables.CODE_SECRETS>
                      CONT_CRIT: <+pipeline.stages.validate_container.spec.execution.steps.container_security_gate.output.outputVariables.CONTAINER_CRITICAL>
                      CONT_HIGH: <+pipeline.stages.validate_container.spec.execution.steps.container_security_gate.output.outputVariables.CONTAINER_HIGH>
                      GATE_CODE_CRIT: <+pipeline.variables.SECURITY_GATE_CRITICAL>
                      GATE_CODE_HIGH: <+pipeline.variables.SECURITY_GATE_HIGH>
                      GATE_CODE_SEC: <+pipeline.variables.SECURITY_GATE_SECRETS>
                      GATE_CONT_CRIT: <+pipeline.variables.CONTAINER_GATE_CRITICAL>
                      GATE_CONT_HIGH: <+pipeline.variables.CONTAINER_GATE_HIGH>
                  when:
                    stageStatus: Success
                    condition: <+codebase.prNumber> != null && <+pipeline.triggerType> != "MANUAL"
              - step:
                  type: Run
                  name: Release Summary
                  identifier: release_summary
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║              🚀 RELEASE COMPLETED                            ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║  Mode: $RUN_MODE"
                      echo "║  Services: $SERVICES"
                      echo "║  Version: $VERSION"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║  ✅ Stage 1: Code Security Gate PASSED"
                      echo "║  ✅ Stage 2: Container Security Gate PASSED"
                      echo "║  ✅ Stage 3: Push & Release COMPLETED"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║  SECURITY SUMMARY:"
                      printf "║  Code:      Crit=%-2s High=%-2s Secrets=%-2s\n" "${CODE_CRIT:-0}" "${CODE_HIGH:-0}" "${CODE_SEC:-0}"
                      printf "║  Container: Crit=%-2s High=%-2s\n" "${CONT_CRIT:-0}" "${CONT_HIGH:-0}"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║  ARTIFACT:"
                      echo "║  crizstian/${SERVICES}-service:${VERSION}"
                      echo "║  crizstian/${SERVICES}-service:latest"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      echo "║  GIT TAG: ${TAG_NAME}"
                      echo "╚══════════════════════════════════════════════════════════════╝"
                    envVariables:
                      SERVICES: <+pipeline.variables.SERVICES>
                      RUN_MODE: <+pipeline.variables.RUN_MODE>
                      VERSION: <+execution.steps.release.steps.semantic_version.output.outputVariables.VERSION>
                      TAG_NAME: <+execution.steps.release.steps.semantic_version.output.outputVariables.TAG_NAME>
                      CODE_CRIT: <+pipeline.stages.validate_code.spec.execution.steps.code_security_gate.output.outputVariables.CODE_CRITICAL>
                      CODE_HIGH: <+pipeline.stages.validate_code.spec.execution.steps.code_security_gate.output.outputVariables.CODE_HIGH>
                      CODE_SEC: <+pipeline.stages.validate_code.spec.execution.steps.code_security_gate.output.outputVariables.CODE_SECRETS>
                      CONT_CRIT: <+pipeline.stages.validate_container.spec.execution.steps.container_security_gate.output.outputVariables.CONTAINER_CRITICAL>
                      CONT_HIGH: <+pipeline.stages.validate_container.spec.execution.steps.container_security_gate.output.outputVariables.CONTAINER_HIGH>
                  when:
                    stageStatus: Success
  allowStageExecutions: true
