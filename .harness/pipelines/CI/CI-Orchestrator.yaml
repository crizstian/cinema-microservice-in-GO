pipeline:
  name: CI Orchestrator
  identifier: CI_Orchestrator
  orgIdentifier: sandbox
  projectIdentifier: CristianRamirez
  tags:
    version: "1.0"
    type: orchestrator
  properties:
    ci:
      codebase:
        connectorRef: CristianConnector
        repoName: cinema-microservice-in-GO
        build: <+input>
        prCloneStrategy: SourceBranch
        sparseCheckout: []
        depth: 0
  stages:
    - stage:
        name: Detect and Classify Services
        identifier: detect_classify
        description: Detect changed files and classify by language using manifest files (STRATEGY 2)
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Detect Changed Services
                  identifier: detect_services
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    envVariables:
                      COMMITS_JSON: <+trigger.payload.commits>
                      PR_ACTION: <+trigger.payload.action>
                      PR_MERGED: <+trigger.payload.pull_request.merged>
                      PR_BASE_SHA: <+trigger.payload.pull_request.base.sha>
                      PR_HEAD_SHA: <+trigger.payload.pull_request.head.sha>
                      PR_NUMBER: <+trigger.payload.pull_request.number>
                    command: |
                      echo "=== CI Orchestrator: Detecting Changed Services ==="
                      echo "PR Action: $PR_ACTION"
                      echo "PR Number: $PR_NUMBER"
                      echo "PR Base SHA: $PR_BASE_SHA"
                      echo "PR Head SHA: $PR_HEAD_SHA"
                      echo ""

                      apk add --no-cache jq git > /dev/null 2>&1

                      CHANGED_FILES=""

                      # STRATEGY 1: For push events, use commits payload
                      if [ -n "$COMMITS_JSON" ] && [ "$COMMITS_JSON" != "null" ]; then
                        echo "Push event detected - extracting from commits payload..."
                        ADDED=$(echo "$COMMITS_JSON" | jq -r '.[].added[]? // empty' 2>/dev/null | sort -u)
                        MODIFIED=$(echo "$COMMITS_JSON" | jq -r '.[].modified[]? // empty' 2>/dev/null | sort -u)
                        REMOVED=$(echo "$COMMITS_JSON" | jq -r '.[].removed[]? // empty' 2>/dev/null | sort -u)
                        CHANGED_FILES=$(printf "%s\n%s\n%s" "$ADDED" "$MODIFIED" "$REMOVED" | grep -v '^$' | sort -u)
                      fi

                      # STRATEGY 2: For PR events, use base/head SHA diff
                      if [ -z "$CHANGED_FILES" ] && [ -n "$PR_BASE_SHA" ] && [ "$PR_BASE_SHA" != "null" ]; then
                        echo "PR event detected - using base/head SHA diff..."
                        git fetch origin "$PR_BASE_SHA" --depth=50 2>/dev/null || true
                        CHANGED_FILES=$(git diff --name-only "$PR_BASE_SHA"..."$PR_HEAD_SHA" 2>/dev/null || echo "")
                        if [ -z "$CHANGED_FILES" ]; then
                          echo "SHA diff failed, trying with target branch..."
                          git fetch origin <+codebase.targetBranch> 2>/dev/null || true
                          CHANGED_FILES=$(git diff --name-only "origin/<+codebase.targetBranch>"...HEAD 2>/dev/null || echo "")
                        fi
                      fi

                      # STRATEGY 3: Fallback to git log diff
                      if [ -z "$CHANGED_FILES" ]; then
                        echo "Fallback: using git log to find changed files..."
                        git fetch origin <+codebase.targetBranch> 2>/dev/null || true
                        CHANGED_FILES=$(git log --name-only --pretty=format: "origin/<+codebase.targetBranch>"..HEAD 2>/dev/null | grep -v '^$' | sort -u || echo "")
                      fi

                      echo "Changed files:"
                      echo "$CHANGED_FILES"
                      echo ""

                      SERVICES=""
                      for file in $CHANGED_FILES; do
                        case "$file" in
                          services/*/*)
                            svc=$(echo "$file" | cut -d'/' -f2)
                            case ",${SERVICES}," in
                              *",${svc},"*) ;;
                              *) SERVICES="${SERVICES:+$SERVICES,}${svc}" ;;
                            esac
                            ;;
                        esac
                      done

                      echo "Detected services: $SERVICES"
                      echo ""

                      if [ -z "$SERVICES" ]; then
                        echo "No services detected in changed files - skipping child pipelines"
                        SERVICES=""
                        SERVICES_JSON="[]"
                        SERVICE_COUNT=0
                      else
                        SERVICES_JSON=$(echo "$SERVICES" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(select(length > 0))')
                        SERVICE_COUNT=$(echo "$SERVICES" | tr ',' '\n' | grep -v '^$' | wc -l)
                      fi

                      echo "=== Detection Results ==="
                      echo "Services: $SERVICES"
                      echo "Services JSON: $SERVICES_JSON"
                      echo "Service Count: $SERVICE_COUNT"
                    outputVariables:
                      - name: SERVICES
                        type: String
                        value: SERVICES
                      - name: SERVICES_JSON
                        type: String
                        value: SERVICES_JSON
                      - name: SERVICE_COUNT
                        type: String
                        value: SERVICE_COUNT
              - step:
                  type: Run
                  name: Classify by Language
                  identifier: classify_language
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    envVariables:
                      SERVICES: <+execution.steps.detect_services.output.outputVariables.SERVICES>
                    command: |
                      echo "=== STRATEGY 2: Manifest File Detection ==="
                      echo "Classifying services by language using manifest files..."
                      echo ""

                      apk add --no-cache jq > /dev/null 2>&1

                      GO_SERVICES=""
                      JAVA_SERVICES=""
                      NODE_SERVICES=""
                      PYTHON_SERVICES=""
                      UNKNOWN_SERVICES=""

                      if [ -z "$SERVICES" ]; then
                        echo "No services to classify"
                      else
                        for service in $(echo "$SERVICES" | tr ',' ' '); do
                          SERVICE_PATH="services/$service"
                          echo -n "Checking $service... "
                          if [ -f "$SERVICE_PATH/go.mod" ]; then
                            echo "Go (go.mod found)"
                            GO_SERVICES="${GO_SERVICES:+$GO_SERVICES,}$service"
                          elif [ -f "$SERVICE_PATH/pom.xml" ] || [ -f "$SERVICE_PATH/build.gradle" ]; then
                            echo "Java (pom.xml/build.gradle found)"
                            JAVA_SERVICES="${JAVA_SERVICES:+$JAVA_SERVICES,}$service"
                          elif [ -f "$SERVICE_PATH/package.json" ]; then
                            echo "Node (package.json found)"
                            NODE_SERVICES="${NODE_SERVICES:+$NODE_SERVICES,}$service"
                          elif [ -f "$SERVICE_PATH/requirements.txt" ] || [ -f "$SERVICE_PATH/pyproject.toml" ] || [ -f "$SERVICE_PATH/setup.py" ] || [ -f "$SERVICE_PATH/Pipfile" ]; then
                            echo "Python (requirements.txt/pyproject.toml/setup.py/Pipfile found)"
                            PYTHON_SERVICES="${PYTHON_SERVICES:+$PYTHON_SERVICES,}$service"
                          else
                            echo "Unknown (no manifest found)"
                            UNKNOWN_SERVICES="${UNKNOWN_SERVICES:+$UNKNOWN_SERVICES,}$service"
                          fi
                        done
                      fi

                      echo ""
                      echo "=== Classification Results ==="

                      GO_SERVICES_JSON=$(echo "$GO_SERVICES" | tr ',' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null || echo "[]")
                      JAVA_SERVICES_JSON=$(echo "$JAVA_SERVICES" | tr ',' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null || echo "[]")
                      NODE_SERVICES_JSON=$(echo "$NODE_SERVICES" | tr ',' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null || echo "[]")
                      PYTHON_SERVICES_JSON=$(echo "$PYTHON_SERVICES" | tr ',' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(length > 0))' 2>/dev/null || echo "[]")

                      GO_COUNT=$(echo "$GO_SERVICES_JSON" | jq 'length')
                      JAVA_COUNT=$(echo "$JAVA_SERVICES_JSON" | jq 'length')
                      NODE_COUNT=$(echo "$NODE_SERVICES_JSON" | jq 'length')
                      PYTHON_COUNT=$(echo "$PYTHON_SERVICES_JSON" | jq 'length')

                      echo "Go services ($GO_COUNT): $GO_SERVICES_JSON"
                      echo "Java services ($JAVA_COUNT): $JAVA_SERVICES_JSON"
                      echo "Node services ($NODE_COUNT): $NODE_SERVICES_JSON"
                      echo "Python services ($PYTHON_COUNT): $PYTHON_SERVICES_JSON"
                      if [ -n "$UNKNOWN_SERVICES" ]; then
                        echo "Unknown services: $UNKNOWN_SERVICES"
                      fi

                      HAS_GO=$( [ "$GO_COUNT" -gt 0 ] && echo "true" || echo "false" )
                      HAS_JAVA=$( [ "$JAVA_COUNT" -gt 0 ] && echo "true" || echo "false" )
                      HAS_NODE=$( [ "$NODE_COUNT" -gt 0 ] && echo "true" || echo "false" )
                      HAS_PYTHON=$( [ "$PYTHON_COUNT" -gt 0 ] && echo "true" || echo "false" )

                      echo ""
                      echo "=== Child Pipelines to Trigger ==="
                      echo "Trigger Go pipeline: $HAS_GO"
                      echo "Trigger Java pipeline: $HAS_JAVA"
                      echo "Trigger Node pipeline: $HAS_NODE"
                      echo "Trigger Python pipeline: $HAS_PYTHON"
                    outputVariables:
                      - name: GO_SERVICES
                        type: String
                        value: GO_SERVICES
                      - name: GO_SERVICES_JSON
                        type: String
                        value: GO_SERVICES_JSON
                      - name: JAVA_SERVICES
                        type: String
                        value: JAVA_SERVICES
                      - name: JAVA_SERVICES_JSON
                        type: String
                        value: JAVA_SERVICES_JSON
                      - name: NODE_SERVICES
                        type: String
                        value: NODE_SERVICES
                      - name: NODE_SERVICES_JSON
                        type: String
                        value: NODE_SERVICES_JSON
                      - name: PYTHON_SERVICES
                        type: String
                        value: PYTHON_SERVICES
                      - name: PYTHON_SERVICES_JSON
                        type: String
                        value: PYTHON_SERVICES_JSON
                      - name: HAS_GO
                        type: String
                        value: HAS_GO
                      - name: HAS_JAVA
                        type: String
                        value: HAS_JAVA
                      - name: HAS_NODE
                        type: String
                        value: HAS_NODE
                      - name: HAS_PYTHON
                        type: String
                        value: HAS_PYTHON
              - step:
                  type: Run
                  name: Determine Run Mode
                  identifier: determine_run_mode
                  spec:
                    shell: Sh
                    envVariables:
                      PR_STATE: <+trigger.payload.pull_request.state>
                      PR_ACTION: <+trigger.payload.action>
                      PR_MERGED: <+trigger.payload.pull_request.merged>
                    command: |
                      echo "=== Determining Run Mode for Child Pipelines ==="
                      echo ""
                      echo "PR State: $PR_STATE"
                      echo "PR Action: $PR_ACTION"
                      echo "PR Merged: $PR_MERGED"
                      echo ""

                      # CI-Go-ShiftLeft expects: pr_open, pr_merge, full
                      if [ "$PR_STATE" = "open" ]; then
                        RUN_MODE="pr_open"
                      elif [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
                        RUN_MODE="pr_merge"
                      else
                        RUN_MODE="pr_open"
                      fi

                      echo "=== Run Mode Decision ==="
                      echo "RUN_MODE: $RUN_MODE"

                      PR_NUMBER="<+codebase.prNumber>"
                      SOURCE_BRANCH="<+codebase.sourceBranch>"

                      echo "PR_NUMBER: $PR_NUMBER"
                      echo "SOURCE_BRANCH: $SOURCE_BRANCH"
                    outputVariables:
                      - name: RUN_MODE
                        type: String
                        value: RUN_MODE
                      - name: PR_NUMBER
                        type: String
                        value: PR_NUMBER
                      - name: SOURCE_BRANCH
                        type: String
                        value: SOURCE_BRANCH
              - step:
                  type: Run
                  name: Build Services List
                  identifier: build_services_list
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    envVariables:
                      GO_SERVICES: <+execution.steps.classify_language.output.outputVariables.GO_SERVICES>
                    command: |
                      echo "=== Building Services List for CD Pipeline ==="
                      echo "Input: '$GO_SERVICES'"

                      # Convert to comma-separated service identifiers
                      # Input: "booking,movie"
                      # Output: "bookingservice,movieservice"

                      if [ -z "$GO_SERVICES" ] || [ "$GO_SERVICES" = "null" ]; then
                        SERVICES_LIST=""
                        echo "No Go services detected - SERVICES_LIST is empty"
                      else
                        SERVICES_LIST=$(echo "$GO_SERVICES" | tr ',' '\n' | sed 's/$/service/' | paste -sd ',' -)
                      fi

                      echo "Output: '$SERVICES_LIST'"
                      echo "SERVICES_LIST=$SERVICES_LIST" >> $HARNESS_OUTPUT_FILE
                    outputVariables:
                      - name: SERVICES_LIST
                        type: String
                        value: SERVICES_LIST
          buildIntelligence:
            enabled: false
    - stage:
        name: Trigger Go CICD
        identifier: trigger_go_cicd
        description: Trigger unified CICD pipeline for Go services (CI + CD)
        type: Pipeline
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.detect_classify.spec.execution.steps.classify_language.output.outputVariables.HAS_GO> == "true"
        spec:
          org: sandbox
          pipeline: CICD_Go_ShiftLeft
          project: CristianRamirez
          inputs:
            identifier: CICD_Go_ShiftLeft
            properties:
              ci:
                codebase:
                  build:
                    type: PR
                    spec:
                      number: <+pipeline.stages.detect_classify.spec.execution.steps.determine_run_mode.output.outputVariables.PR_NUMBER>
            variables:
              - name: RUN_MODE
                type: String
                value: <+pipeline.stages.detect_classify.spec.execution.steps.determine_run_mode.output.outputVariables.RUN_MODE>
              - name: SERVICES
                type: String
                value: <+pipeline.stages.detect_classify.spec.execution.steps.classify_language.output.outputVariables.GO_SERVICES>
              - name: SERVICES_LIST
                type: String
                value: <+pipeline.stages.detect_classify.spec.execution.steps.build_services_list.output.outputVariables.SERVICES_LIST>
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsFailure
    - stage:
        name: Trigger Python Services
        identifier: trigger_python
        description: Trigger Python child pipeline for detected Python services
        type: Pipeline
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.detect_classify.spec.execution.steps.classify_language.output.outputVariables.HAS_PYTHON> == "true"
        spec:
          org: sandbox
          pipeline: ci_shift_left_security
          project: CristianRamirez
          inputs:
            identifier: ci_shift_left_security
            properties:
              ci:
                codebase:
                  build:
                    type: PR
                    spec:
                      number: <+pipeline.stages.detect_classify.spec.execution.steps.determine_run_mode.output.outputVariables.PR_NUMBER>
            variables:
              - name: RUN_MODE
                type: String
                value: <+pipeline.stages.detect_classify.spec.execution.steps.determine_run_mode.output.outputVariables.RUN_MODE>
              - name: SERVICES
                type: String
                value: <+pipeline.stages.detect_classify.spec.execution.steps.classify_language.output.outputVariables.PYTHON_SERVICES>
              - name: PYTHON_VERSION
                type: String
                value: <+input>.default(3.12).selectOneFrom(3.11,3.12,3.13)
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: MarkAsSuccess
  allowStageExecutions: true
