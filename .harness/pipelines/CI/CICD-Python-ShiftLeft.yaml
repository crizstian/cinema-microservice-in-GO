pipeline:
  name: CI - python pipeline
  identifier: ci_shift_left_security
  orgIdentifier: sandbox
  projectIdentifier: CristianRamirez
  tags:
    version: "1.0"
    language: python
    type: shift-left
  description: |
    Shift-left CI pipeline for Python monorepo:
    - PR Open: Security Code + Test Code stages
    - PR Merge: Push and Release stage
  properties:
    ci:
      codebase:
        connectorRef: CristianConnector
        repoName: cinema-microservice-in-GO
        build: <+input>
        prCloneStrategy: SourceBranch
        sparseCheckout: []
        depth: 50
  variables:
    - name: RUN_MODE
      type: String
      description: "pr_open: Security + Tests | pr_merge: Build + Release | full: All
        stages"
      required: true
      value: <+input>.allowedValues(pr_open,pr_merge,full)
    - name: SERVICES
      type: String
      description: Comma-separated list of Python services to process (e.g., py-app-demo)
      required: true
      value: <+input>
    - name: PYTHON_VERSION_DEFAULT
      type: String
      description: Default Python version if auto-detect fails
      value: "3.12"
    - name: DOCKER_REGISTRY
      type: String
      description: Docker registry prefix
      value: crizstian
    - name: COVERAGE_THRESHOLD
      type: Number
      description: Minimum code coverage percentage
      value: 80
    - name: SECURITY_GATE_CRITICAL
      type: Number
      description: Max critical vulnerabilities allowed (code)
      value: 0
    - name: SECURITY_GATE_HIGH
      type: Number
      description: Max high vulnerabilities allowed (code)
      value: 5
    - name: SECURITY_GATE_SECRETS
      type: Number
      description: Max secrets allowed
      value: 0
    - name: CONTAINER_GATE_CRITICAL
      type: Number
      description: Max critical container vulnerabilities
      value: 0
    - name: CONTAINER_GATE_HIGH
      type: Number
      description: Max high container vulnerabilities
      value: 3
  stages:
    - parallel:
        - stage:
            name: Security Code
            identifier: security_code
            description: Code quality and security analysis with policy enforcement
            type: SecurityTests
            when:
              pipelineStatus: Success
              condition: <+pipeline.variables.RUN_MODE> == "pr_open" ||
                <+pipeline.variables.RUN_MODE> == "full"
            spec:
              cloneCodebase: true
              caching:
                enabled: true
                key: python-security-<+hashFiles("**/requirements.txt", "**/pyproject.toml")>
                paths:
                  - /harness/.cache/pip
              buildIntelligence:
                enabled: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - stepGroup:
                      name: Detect Python Versions
                      identifier: detect_versions
                      steps:
                        - step:
                            name: Detect Python Version
                            identifier: detect_python_version
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: alpine:3.19
                              shell: Sh
                              envVariables:
                                DEFAULT_VERSION: <+pipeline.variables.PYTHON_VERSION_DEFAULT>
                              command: |
                                cd services/<+repeat.item>
                                echo "=== Detecting Python version for <+repeat.item> ==="

                                PYTHON_VERSION=""

                                # Strategy 1: .python-version file
                                if [ -f ".python-version" ]; then
                                  PYTHON_VERSION=$(cat .python-version | head -1 | tr -d '[:space:]')
                                  echo "Found .python-version: $PYTHON_VERSION"
                                fi

                                # Strategy 2: pyproject.toml requires-python
                                if [ -z "$PYTHON_VERSION" ] && [ -f "pyproject.toml" ]; then
                                  PYTHON_VERSION=$(grep -E "^python\s*=" pyproject.toml | sed 's/.*"\([0-9.]*\)".*/\1/' | head -1)
                                  [ -z "$PYTHON_VERSION" ] && PYTHON_VERSION=$(grep -E "requires-python" pyproject.toml | sed 's/.*>=[^0-9]*\([0-9.]*\).*/\1/' | head -1)
                                  [ -n "$PYTHON_VERSION" ] && echo "Found in pyproject.toml: $PYTHON_VERSION"
                                fi

                                # Strategy 3: runtime.txt (Heroku style)
                                if [ -z "$PYTHON_VERSION" ] && [ -f "runtime.txt" ]; then
                                  PYTHON_VERSION=$(grep -oE "[0-9]+\.[0-9]+" runtime.txt | head -1)
                                  [ -n "$PYTHON_VERSION" ] && echo "Found in runtime.txt: $PYTHON_VERSION"
                                fi

                                # Fallback to default
                                if [ -z "$PYTHON_VERSION" ]; then
                                  PYTHON_VERSION="$DEFAULT_VERSION"
                                  echo "No version found, using default: $PYTHON_VERSION"
                                fi

                                # Normalize to major.minor (e.g., 3.12.1 -> 3.12)
                                PYTHON_VERSION=$(echo "$PYTHON_VERSION" | grep -oE "^[0-9]+\.[0-9]+")

                                echo "Detected Python version for <+repeat.item>: $PYTHON_VERSION"
                                echo "PYTHON_VERSION=$PYTHON_VERSION" >> $HARNESS_OUTPUT_FILE
                              outputVariables:
                                - name: PYTHON_VERSION
                      strategy:
                        repeat:
                          items: <+pipeline.variables.SERVICES.split(",")>
                          nodeName: <+repeat.item>
                          maxConcurrency: 4
                  - stepGroup:
                      name: Install Dependencies
                      identifier: install_deps
                      steps:
                        - step:
                            name: Install Requirements
                            identifier: install_requirements
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: python:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_python_version.output.outputVariables.PYTHON_VERSION>-slim
                              shell: Sh
                              command: |
                                cd services/<+repeat.item>
                                echo "=== Installing dependencies for <+repeat.item> ==="
                                pip install --upgrade pip
                                if [ -f "requirements.txt" ]; then
                                  pip install -r requirements.txt
                                elif [ -f "pyproject.toml" ]; then
                                  pip install .
                                fi
                                echo "=== Dependencies installed ==="
                      strategy:
                        repeat:
                          items: <+pipeline.variables.SERVICES.split(",")>
                          nodeName: <+repeat.item>
                          maxConcurrency: 4
                  - stepGroup:
                      name: Linting
                      identifier: linting
                      steps:
                        - parallel:
                            - step:
                                name: Ruff Lint
                                identifier: ruff_lint
                                type: Run
                                spec:
                                  connectorRef: account.harnessImage
                                  image: python:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_python_version.output.outputVariables.PYTHON_VERSION>-slim
                                  shell: Sh
                                  command: |
                                    pip install ruff > /dev/null 2>&1
                                    cd services/<+repeat.item>
                                    echo "=== Running Ruff linter (warnings only, non-blocking) ==="
                                    ruff check . --output-format=json > lint-report.json 2>&1 || true
                                    ruff check . || echo "⚠️ Lint issues found - review lint-report.json"
                            - step:
                                type: Gitleaks
                                name: Gitleaks
                                identifier: Gitleaks
                                spec:
                                  mode: orchestration
                                  config: default
                                  target:
                                    type: repository
                                    workspace: services/<+repeat.item>
                                    detection: auto
                                  advanced:
                                    log:
                                      level: info
                                    fail_on_severity: none
                                enforce:
                                  policySets:
                                    - security_secrets
                        - step:
                            name: Store Gitleaks Results
                            identifier: store_gitleaks
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: alpine:3.19
                              shell: Sh
                              envVariables:
                                GITLEAKS_TOTAL: <+execution.steps.linting.steps.Gitleaks.output.outputVariables.TOTAL>
                              command: |
                                mkdir -p /harness/security-results
                                SECRETS="${GITLEAKS_TOTAL:-0}"
                                [ "$SECRETS" = "null" ] || [ "$SECRETS" = "<+null>" ] && SECRETS=0
                                echo "$SECRETS" >> /harness/security-results/gitleaks.txt
                      strategy:
                        repeat:
                          items: <+pipeline.variables.SERVICES.split(",")>
                          nodeName: <+repeat.item>
                          maxConcurrency: 4
                  - stepGroup:
                      name: SCA Scans
                      identifier: sca_scans
                      steps:
                        - parallel:
                            - step:
                                type: HarnessSAST
                                name: HarnessSCA
                                identifier: HarnessSCA
                                spec:
                                  mode: orchestration
                                  config: sca
                                  target:
                                    type: repository
                                    workspace: services/<+repeat.item>
                                    detection: auto
                                  advanced:
                                    log:
                                      level: info
                                    fail_on_severity: none
                                  tool:
                                    app_name: <+repeat.item>
                                enforce:
                                  policySets:
                                    - STO_Policy
                                timeout: 3m
                                failureStrategies:
                                  - onFailure:
                                      errors:
                                        - Timeout
                                      action:
                                        type: Retry
                                        spec:
                                          retryCount: 3
                                          retryIntervals:
                                            - 5s
                                          onRetryFailure:
                                            action:
                                              type: Ignore
                            - step:
                                type: Snyk
                                name: Snyk SCA
                                identifier: Snyk_SCA
                                spec:
                                  mode: orchestration
                                  config: default
                                  target:
                                    type: repository
                                    workspace: services/<+repeat.item>
                                    detection: manual
                                    name: <+repeat.item>
                                    variant: <+codebase.branch>
                                  advanced:
                                    log:
                                      level: info
                                    fail_on_severity: none
                                    args:
                                      cli: "--skip-unresolved"
                                  privileged: true
                                  auth:
                                    access_token: <+secrets.getValue("snyk_token")>
                                  sbom:
                                    format: spdx-json
                                  tool:
                                    ingest_tool_severity: false
                                enforce:
                                  policySets:
                                    - STO_Policy
                        - step:
                            name: Store SCA Results
                            identifier: store_sca
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: alpine:3.19
                              shell: Sh
                              envVariables:
                                HARNESS_SCA_CRITICAL: <+execution.steps.sca_scans.steps.HarnessSCA.output.outputVariables.CRITICAL>
                                HARNESS_SCA_HIGH: <+execution.steps.sca_scans.steps.HarnessSCA.output.outputVariables.HIGH>
                                SNYK_SCA_CRITICAL: <+execution.steps.sca_scans.steps.Snyk_SCA.output.outputVariables.CRITICAL>
                                SNYK_SCA_HIGH: <+execution.steps.sca_scans.steps.Snyk_SCA.output.outputVariables.HIGH>
                              command: |
                                mkdir -p /harness/security-results
                                H_C="${HARNESS_SCA_CRITICAL:-0}"; [ "$H_C" = "null" ] && H_C=0
                                H_H="${HARNESS_SCA_HIGH:-0}"; [ "$H_H" = "null" ] && H_H=0
                                S_C="${SNYK_SCA_CRITICAL:-0}"; [ "$S_C" = "null" ] && S_C=0
                                S_H="${SNYK_SCA_HIGH:-0}"; [ "$S_H" = "null" ] && S_H=0
                                echo "$H_C $H_H $S_C $S_H" >> /harness/security-results/sca.txt
                      strategy:
                        repeat:
                          items: <+pipeline.variables.SERVICES.split(",")>
                          nodeName: <+repeat.item>
                          maxConcurrency: 3
                  - stepGroup:
                      name: SAST Scans
                      identifier: sast_scans
                      steps:
                        - parallel:
                            - step:
                                type: HarnessSAST
                                name: HarnessSAST
                                identifier: HarnessSAST
                                spec:
                                  mode: orchestration
                                  config: sast
                                  target:
                                    type: repository
                                    workspace: services/<+repeat.item>
                                    detection: auto
                                  advanced:
                                    log:
                                      level: info
                                    fail_on_severity: none
                                  tool:
                                    app_name: <+repeat.item>
                                enforce:
                                  policySets:
                                    - STO_Policy
                                timeout: 3m
                                failureStrategies:
                                  - onFailure:
                                      errors:
                                        - Timeout
                                      action:
                                        type: Retry
                                        spec:
                                          retryCount: 3
                                          retryIntervals:
                                            - 5s
                                          onRetryFailure:
                                            action:
                                              type: Ignore
                            - step:
                                type: Snyk
                                name: Snyk SAST
                                identifier: Snyk_SAST
                                spec:
                                  mode: orchestration
                                  config: default
                                  target:
                                    type: repository
                                    workspace: services/<+repeat.item>
                                    name: <+repeat.item>
                                    variant: <+codebase.branch>
                                  advanced:
                                    log:
                                      level: info
                                    fail_on_severity: none
                                    args:
                                      cli: "--skip-unresolved"
                                  privileged: true
                                  auth:
                                    access_token: <+secrets.getValue("snyk_token")>
                                  sbom:
                                    format: spdx-json
                                  tool:
                                    ingest_tool_severity: true
                                enforce:
                                  policySets:
                                    - STO_Policy
                        - step:
                            name: Store SAST Results
                            identifier: store_sast
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: alpine:3.19
                              shell: Sh
                              envVariables:
                                HARNESS_SAST_CRITICAL: <+execution.steps.sast_scans.steps.HarnessSAST.output.outputVariables.CRITICAL>
                                HARNESS_SAST_HIGH: <+execution.steps.sast_scans.steps.HarnessSAST.output.outputVariables.HIGH>
                                SNYK_SAST_CRITICAL: <+execution.steps.sast_scans.steps.Snyk_SAST.output.outputVariables.CRITICAL>
                                SNYK_SAST_HIGH: <+execution.steps.sast_scans.steps.Snyk_SAST.output.outputVariables.HIGH>
                              command: |
                                mkdir -p /harness/security-results
                                H_C="${HARNESS_SAST_CRITICAL:-0}"; [ "$H_C" = "null" ] && H_C=0
                                H_H="${HARNESS_SAST_HIGH:-0}"; [ "$H_H" = "null" ] && H_H=0
                                S_C="${SNYK_SAST_CRITICAL:-0}"; [ "$S_C" = "null" ] && S_C=0
                                S_H="${SNYK_SAST_HIGH:-0}"; [ "$S_H" = "null" ] && S_H=0
                                echo "$H_C $H_H $S_C $S_H" >> /harness/security-results/sast.txt
                      strategy:
                        repeat:
                          items: <+pipeline.variables.SERVICES.split(",")>
                          nodeName: <+repeat.item>
                          maxConcurrency: 3
                  - step:
                      type: Run
                      name: Evaluate Code Gate
                      identifier: evaluate_code_gate
                      spec:
                        connectorRef: account.harnessImage
                        image: alpine:3.19
                        shell: Sh
                        command: |
                          #!/bin/sh
                          set -e

                          MAX_CRITICAL=$GATE_CRITICAL
                          MAX_HIGH=$GATE_HIGH
                          MAX_SECRETS=$GATE_SECRETS

                          RESULTS_DIR="/harness/security-results"

                          TOTAL_SECRETS=0
                          if [ -f "$RESULTS_DIR/gitleaks.txt" ]; then
                            while read -r line; do
                              [ -n "$line" ] && TOTAL_SECRETS=$((TOTAL_SECRETS + line))
                            done < "$RESULTS_DIR/gitleaks.txt"
                          fi

                          SCA_CRITICAL=0; SCA_HIGH=0
                          if [ -f "$RESULTS_DIR/sca.txt" ]; then
                            while read -r h_c h_h s_c s_h; do
                              [ -n "$h_c" ] && SCA_CRITICAL=$((SCA_CRITICAL + h_c + s_c))
                              [ -n "$h_h" ] && SCA_HIGH=$((SCA_HIGH + h_h + s_h))
                            done < "$RESULTS_DIR/sca.txt"
                          fi

                          SAST_CRITICAL=0; SAST_HIGH=0
                          if [ -f "$RESULTS_DIR/sast.txt" ]; then
                            while read -r h_c h_h s_c s_h; do
                              [ -n "$h_c" ] && SAST_CRITICAL=$((SAST_CRITICAL + h_c + s_c))
                              [ -n "$h_h" ] && SAST_HIGH=$((SAST_HIGH + h_h + s_h))
                            done < "$RESULTS_DIR/sast.txt"
                          fi

                          TOTAL_CRITICAL=$((SCA_CRITICAL + SAST_CRITICAL))
                          TOTAL_HIGH=$((SCA_HIGH + SAST_HIGH))

                          GATE_PASSED=true
                          VIOLATIONS=""
                          [ "$TOTAL_CRITICAL" -gt "$MAX_CRITICAL" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}CRITICAL:${TOTAL_CRITICAL}(max:${MAX_CRITICAL}) "
                          [ "$TOTAL_HIGH" -gt "$MAX_HIGH" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}HIGH:${TOTAL_HIGH}(max:${MAX_HIGH}) "
                          [ "$TOTAL_SECRETS" -gt "$MAX_SECRETS" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}SECRETS:${TOTAL_SECRETS}(max:${MAX_SECRETS})"

                          echo ""
                          echo "╔══════════════════════════════════════════════════════════════╗"
                          echo "║              CODE SECURITY GATE - EVALUATION                 ║"
                          echo "╠══════════════════════════════════════════════════════════════╣"
                          echo "║  Aggregated across all Python services:                      ║"
                          printf "║  Critical: %-3s (max: %-3s)                                   ║\n" "$TOTAL_CRITICAL" "$MAX_CRITICAL"
                          printf "║  High:     %-3s (max: %-3s)                                   ║\n" "$TOTAL_HIGH" "$MAX_HIGH"
                          printf "║  Secrets:  %-3s (max: %-3s)                                   ║\n" "$TOTAL_SECRETS" "$MAX_SECRETS"
                          echo "╠══════════════════════════════════════════════════════════════╣"
                          if [ "$GATE_PASSED" = "true" ]; then
                            echo "║  ✅ GATE PASSED - All thresholds met                         ║"
                          else
                            echo "║  ⚠️  GATE FAILED - Violations: $VIOLATIONS"
                            echo "║  ⏳ Pending manual approval (4h timeout)                     ║"
                          fi
                          echo "╚══════════════════════════════════════════════════════════════╝"

                          {
                            echo "TOTAL_CRITICAL=$TOTAL_CRITICAL"
                            echo "TOTAL_HIGH=$TOTAL_HIGH"
                            echo "TOTAL_SECRETS=$TOTAL_SECRETS"
                            echo "CODE_GATE_PASSED=$GATE_PASSED"
                            echo "CODE_VIOLATIONS=$VIOLATIONS"
                          } >> $HARNESS_OUTPUT_FILE

                          [ "$GATE_PASSED" = "false" ] && exit 1 || exit 0
                        envVariables:
                          GATE_CRITICAL: <+pipeline.variables.SECURITY_GATE_CRITICAL>
                          GATE_HIGH: <+pipeline.variables.SECURITY_GATE_HIGH>
                          GATE_SECRETS: <+pipeline.variables.SECURITY_GATE_SECRETS>
                        outputVariables:
                          - name: TOTAL_CRITICAL
                          - name: TOTAL_HIGH
                          - name: TOTAL_SECRETS
                          - name: CODE_GATE_PASSED
                          - name: CODE_VIOLATIONS
                      enforce:
                        policySets:
                          - security_gate_code
                      failureStrategies:
                        - onFailure:
                            errors:
                              - AllErrors
                            action:
                              type: ManualIntervention
                              spec:
                                timeout: 4h
                                onTimeout:
                                  action:
                                    type: Abort
            policySetRef:
              - security_gate_code
        - stage:
            name: Test Code
            identifier: test_code
            description: Test execution with coverage enforcement
            type: CI
            when:
              pipelineStatus: Success
              condition: <+pipeline.variables.RUN_MODE> == "pr_open" ||
                <+pipeline.variables.RUN_MODE> == "full"
            spec:
              cloneCodebase: true
              caching:
                enabled: true
                key: python-test-<+hashFiles("**/requirements.txt", "**/pyproject.toml")>
                paths:
                  - /harness/.cache/pip
              buildIntelligence:
                enabled: true
              platform:
                os: Linux
                arch: Amd64
              runtime:
                type: Cloud
                spec: {}
              execution:
                steps:
                  - stepGroup:
                      name: Detect Python Versions
                      identifier: detect_versions
                      steps:
                        - step:
                            name: Detect Python Version
                            identifier: detect_python_version
                            type: Run
                            spec:
                              connectorRef: account.harnessImage
                              image: alpine:3.19
                              shell: Sh
                              envVariables:
                                DEFAULT_VERSION: <+pipeline.variables.PYTHON_VERSION_DEFAULT>
                              command: |
                                cd services/<+repeat.item>
                                echo "=== Detecting Python version for <+repeat.item> ==="

                                PYTHON_VERSION=""

                                if [ -f ".python-version" ]; then
                                  PYTHON_VERSION=$(cat .python-version | head -1 | tr -d '[:space:]')
                                  echo "Found .python-version: $PYTHON_VERSION"
                                fi

                                if [ -z "$PYTHON_VERSION" ] && [ -f "pyproject.toml" ]; then
                                  PYTHON_VERSION=$(grep -E "^python\s*=" pyproject.toml | sed 's/.*"\([0-9.]*\)".*/\1/' | head -1)
                                  [ -z "$PYTHON_VERSION" ] && PYTHON_VERSION=$(grep -E "requires-python" pyproject.toml | sed 's/.*>=[^0-9]*\([0-9.]*\).*/\1/' | head -1)
                                  [ -n "$PYTHON_VERSION" ] && echo "Found in pyproject.toml: $PYTHON_VERSION"
                                fi

                                if [ -z "$PYTHON_VERSION" ] && [ -f "runtime.txt" ]; then
                                  PYTHON_VERSION=$(grep -oE "[0-9]+\.[0-9]+" runtime.txt | head -1)
                                  [ -n "$PYTHON_VERSION" ] && echo "Found in runtime.txt: $PYTHON_VERSION"
                                fi

                                if [ -z "$PYTHON_VERSION" ]; then
                                  PYTHON_VERSION="$DEFAULT_VERSION"
                                  echo "No version found, using default: $PYTHON_VERSION"
                                fi

                                PYTHON_VERSION=$(echo "$PYTHON_VERSION" | grep -oE "^[0-9]+\.[0-9]+")

                                echo "Detected Python version for <+repeat.item>: $PYTHON_VERSION"
                                echo "PYTHON_VERSION=$PYTHON_VERSION" >> $HARNESS_OUTPUT_FILE
                              outputVariables:
                                - name: PYTHON_VERSION
                      strategy:
                        repeat:
                          items: <+pipeline.variables.SERVICES.split(",")>
                          nodeName: <+repeat.item>
                          maxConcurrency: 4
                  - stepGroup:
                      name: Tests
                      identifier: tests
                      steps:
                        - step:
                            type: Test
                            name: Unit Tests
                            identifier: unit_tests
                            spec:
                              connectorRef: account.harnessImage
                              image: python:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_python_version.output.outputVariables.PYTHON_VERSION>-slim
                              shell: Sh
                              envVariables:
                                COVERAGE_THRESHOLD: <+pipeline.variables.COVERAGE_THRESHOLD>
                              command: |
                                cd services/<+repeat.item>
                                echo "=== Running unit tests for <+repeat.item> ==="
                                echo "Python version: $(python --version)"

                                pip install pytest pytest-cov pytest-xdist > /dev/null 2>&1
                                if [ -f "requirements.txt" ]; then
                                  pip install -r requirements.txt > /dev/null 2>&1
                                elif [ -f "pyproject.toml" ]; then
                                  pip install . > /dev/null 2>&1
                                fi

                                pytest tests/ -v --tb=short \
                                  --cov=. --cov-report=term --cov-report=xml:coverage.xml \
                                  --junitxml=report.xml \
                                  -n auto || TEST_EXIT=$?

                                echo "=== Coverage Report ==="
                                COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); print(f\"{float(tree.getroot().get('line-rate', 0)) * 100:.1f}\")" 2>/dev/null || echo "0")
                                echo "Coverage: ${COVERAGE}%"
                                echo "Threshold: ${COVERAGE_THRESHOLD}%"

                                COVERAGE_INT=${COVERAGE%.*}
                                if [ "$COVERAGE_INT" -lt "$COVERAGE_THRESHOLD" ]; then
                                  echo "❌ Coverage ${COVERAGE}% is below threshold ${COVERAGE_THRESHOLD}%"
                                  exit 1
                                else
                                  echo "✅ Coverage ${COVERAGE}% meets threshold ${COVERAGE_THRESHOLD}%"
                                fi

                                exit ${TEST_EXIT:-0}
                              reports:
                                type: JUnit
                                spec:
                                  paths:
                                    - services/**/report.xml
                              intelligenceMode: true
                        - parallel:
                            - step:
                                name: Type Check
                                identifier: type_check
                                type: Run
                                spec:
                                  connectorRef: account.harnessImage
                                  image: python:<+execution.steps.detect_versions_<+repeat.item>.steps.detect_python_version.output.outputVariables.PYTHON_VERSION>-slim
                                  shell: Sh
                                  command: |
                                    pip install mypy > /dev/null 2>&1
                                    cd services/<+repeat.item>

                                    if [ -f "mypy.ini" ] || [ -f "pyproject.toml" ]; then
                                      echo "=== Running mypy type check for <+repeat.item> ==="
                                      mypy . --ignore-missing-imports || echo "⚠️ Type issues found"
                                    else
                                      echo "ℹ️ No mypy config found for <+repeat.item>"
                                    fi
                            - step:
                                name: OpenAPI Validation
                                identifier: openapi_validation
                                type: Run
                                spec:
                                  connectorRef: account.harnessImage
                                  image: node:20-alpine
                                  shell: Sh
                                  command: |
                                    npm install -g @stoplight/spectral-cli > /dev/null 2>&1

                                    SPEC="services/<+repeat.item>/api/openapi.yaml"
                                    SPEC_ALT="services/<+repeat.item>/api/openapi.yml"
                                    SPEC_JSON="services/<+repeat.item>/api/openapi.json"

                                    if [ -f "$SPEC" ]; then
                                      echo "=== Validating OpenAPI spec for <+repeat.item> ==="
                                      spectral lint "$SPEC" --fail-severity=error
                                    elif [ -f "$SPEC_ALT" ]; then
                                      spectral lint "$SPEC_ALT" --fail-severity=error
                                    elif [ -f "$SPEC_JSON" ]; then
                                      spectral lint "$SPEC_JSON" --fail-severity=error
                                    else
                                      echo "ℹ️ No OpenAPI spec found for <+repeat.item>"
                                    fi
                      strategy:
                        repeat:
                          items: <+pipeline.variables.SERVICES.split(",")>
                          nodeName: <+repeat.item>
                          maxConcurrency: 3
    - stage:
        name: Push and Release
        identifier: push_and_release
        description: Build, scan containers, and release if security gates pass
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.RUN_MODE> == "pr_merge" ||
            <+pipeline.variables.RUN_MODE> == "full"
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            key: python-release-<+hashFiles("**/requirements.txt", "**/pyproject.toml")>
            paths:
              - /harness/.cache/pip
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: Version
                  identifier: version
                  steps:
                    - step:
                        name: Semantic Version
                        identifier: semantic_version
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          command: |
                            apk add --no-cache curl jq > /dev/null 2>&1

                            BUMP="patch"
                            PREFIX=$(echo "$BRANCH" | cut -d'/' -f1 | tr '[:upper:]' '[:lower:]')
                            case "$PREFIX" in
                              major|breaking) BUMP="major" ;;
                              feature|feat) BUMP="minor" ;;
                              fix|hotfix|patch) BUMP="patch" ;;
                            esac

                            TAGS=$(curl -s "https://api.github.com/repos/${GITHUB_REPO}/tags?per_page=100" \
                              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                              -H "Accept: application/vnd.github.v3+json")

                            LATEST=$(echo "$TAGS" | jq -r --arg svc "$SERVICE" \
                              '[.[] | select(.name | startswith($svc + "-v"))] | sort_by(.name | ltrimstr($svc + "-v") | split(".") | map(tonumber)) | reverse | .[0].name // ""')

                            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
                              MAJOR=0; MINOR=0; PATCH=0
                            else
                              VER="${LATEST#${SERVICE}-v}"
                              MAJOR=$(echo "$VER" | cut -d. -f1)
                              MINOR=$(echo "$VER" | cut -d. -f2)
                              PATCH=$(echo "$VER" | cut -d. -f3)
                            fi

                            case "$BUMP" in
                              major) NEW_VERSION="v$((MAJOR + 1)).0.0" ;;
                              minor) NEW_VERSION="v${MAJOR}.$((MINOR + 1)).0" ;;
                              *) NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
                            esac

                            TAG_NAME="${SERVICE}-${NEW_VERSION}"
                            IMAGE_TAG="${NEW_VERSION#v}"

                            echo "╔══════════════════════════════════════════════════════════════╗"
                            echo "║  Service: $SERVICE"
                            echo "║  Branch:  $BRANCH → Bump: $BUMP"
                            echo "║  Current: ${LATEST:-none} → New: $NEW_VERSION"
                            echo "║  Tag:     $TAG_NAME"
                            echo "╚══════════════════════════════════════════════════════════════╝"

                            {
                              echo "VERSION=$NEW_VERSION"
                              echo "IMAGE_TAG=$IMAGE_TAG"
                              echo "TAG_NAME=$TAG_NAME"
                            } >> $HARNESS_OUTPUT_FILE
                          envVariables:
                            SERVICE: <+repeat.item>
                            BRANCH: <+codebase.branch>
                            GITHUB_REPO: crizstian/cinema-microservice-in-GO
                            GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                          outputVariables:
                            - name: VERSION
                            - name: IMAGE_TAG
                            - name: TAG_NAME
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 4
              - stepGroup:
                  name: Build and Scan
                  identifier: build_and_scan
                  steps:
                    - step:
                        name: Build Docker Image
                        identifier: build_docker_image
                        type: BuildAndPushDockerRegistry
                        spec:
                          connectorRef: DockerCristian
                          repo: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                          tags:
                            - <+execution.steps.version_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                          dockerfile: services/<+repeat.item>/Dockerfile
                          context: services/<+repeat.item>
                          buildArgs:
                            VERSION: <+execution.steps.version_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                          caching: true
                          envVariables:
                            PLUGIN_NO_PUSH: "true"
                            PLUGIN_BUILDX_LOAD: "true"
                            PLUGIN_TAR_PATH: /harness/images/<+repeat.item>-service.tar
                    - parallel:
                        - step:
                            type: AquaTrivy
                            name: Trivy Scan
                            identifier: trivy_scan
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                workspace: /harness/images/<+repeat.item>-service.tar
                                name: <+repeat.item>-service
                                variant: <+execution.steps.version_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                              advanced:
                                log:
                                  level: info
                                fail_on_severity: none
                              privileged: true
                              image:
                                type: local_archive
                                tag: <+execution.steps.version_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                                name: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                              sbom:
                                format: spdx-json
                            enforce:
                              policySets:
                                - security_container
                        - step:
                            type: HarnessSCA
                            name: Harness Container
                            identifier: harness_container
                            spec:
                              mode: orchestration
                              config: default
                              target:
                                type: container
                                workspace: /harness/images/<+repeat.item>-service.tar
                                detection: auto
                              advanced:
                                log:
                                  level: info
                              privileged: true
                              image:
                                type: local_archive
                                tag: <+execution.steps.version_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                                name: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 2
              - step:
                  type: Run
                  name: Evaluate Container Gate
                  identifier: evaluate_container_gate
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      #!/bin/sh
                      set -e

                      sanitize() {
                        val="$1"
                        [ -z "$val" ] || [ "$val" = "null" ] || [ "$val" = "<+null>" ] && echo "0" || echo "$val"
                      }

                      MAX_CRITICAL=$GATE_CRITICAL
                      MAX_HIGH=$GATE_HIGH

                      TRIVY_C=$(sanitize "$TRIVY_CRITICAL"); TRIVY_H=$(sanitize "$TRIVY_HIGH")
                      HARNESS_C=$(sanitize "$HARNESS_CRITICAL"); HARNESS_H=$(sanitize "$HARNESS_HIGH")
                      NEW_CRIT=$(sanitize "$TRIVY_NEW_CRITICAL")

                      TOTAL_CRITICAL=$((TRIVY_C + HARNESS_C))
                      TOTAL_HIGH=$((TRIVY_H + HARNESS_H))

                      GATE_PASSED=true
                      VIOLATIONS=""
                      [ "$TOTAL_CRITICAL" -gt "$MAX_CRITICAL" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}CRITICAL:${TOTAL_CRITICAL}(max:${MAX_CRITICAL}) "
                      [ "$TOTAL_HIGH" -gt "$MAX_HIGH" ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}HIGH:${TOTAL_HIGH}(max:${MAX_HIGH}) "
                      [ "$NEW_CRIT" -gt 0 ] && GATE_PASSED=false && VIOLATIONS="${VIOLATIONS}NEW_CRITICAL:${NEW_CRIT}"

                      echo ""
                      echo "╔══════════════════════════════════════════════════════════════╗"
                      echo "║            CONTAINER SECURITY GATE - EVALUATION              ║"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      printf "║  Critical:     %-3s (max: %-3s)                               ║\n" "$TOTAL_CRITICAL" "$MAX_CRITICAL"
                      printf "║  High:         %-3s (max: %-3s)                               ║\n" "$TOTAL_HIGH" "$MAX_HIGH"
                      printf "║  New Critical: %-3s                                          ║\n" "$NEW_CRIT"
                      echo "╠══════════════════════════════════════════════════════════════╣"
                      if [ "$GATE_PASSED" = "true" ]; then
                        echo "║  ✅ GATE PASSED - Image approved for release                 ║"
                      else
                        echo "║  ⚠️  GATE FAILED - Violations: $VIOLATIONS"
                        echo "║  ⏳ Pending manual approval (4h timeout)                     ║"
                      fi
                      echo "╚══════════════════════════════════════════════════════════════╝"

                      {
                        echo "CONTAINER_CRITICAL=$TOTAL_CRITICAL"
                        echo "CONTAINER_HIGH=$TOTAL_HIGH"
                        echo "CONTAINER_GATE_PASSED=$GATE_PASSED"
                        echo "CONTAINER_VIOLATIONS=$VIOLATIONS"
                      } >> $HARNESS_OUTPUT_FILE

                      [ "$GATE_PASSED" = "false" ] && exit 1 || exit 0
                    envVariables:
                      GATE_CRITICAL: <+pipeline.variables.CONTAINER_GATE_CRITICAL>
                      GATE_HIGH: <+pipeline.variables.CONTAINER_GATE_HIGH>
                      TRIVY_CRITICAL: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.CRITICAL>
                      TRIVY_HIGH: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.HIGH>
                      TRIVY_NEW_CRITICAL: <+execution.steps.build_and_scan.steps.trivy_scan.output.outputVariables.NEW_CRITICAL>
                      HARNESS_CRITICAL: <+execution.steps.build_and_scan.steps.harness_container.output.outputVariables.CRITICAL>
                      HARNESS_HIGH: <+execution.steps.build_and_scan.steps.harness_container.output.outputVariables.HIGH>
                    outputVariables:
                      - name: CONTAINER_CRITICAL
                      - name: CONTAINER_HIGH
                      - name: CONTAINER_GATE_PASSED
                      - name: CONTAINER_VIOLATIONS
                  enforce:
                    policySets:
                      - security_gate_container
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: ManualIntervention
                          spec:
                            timeout: 4h
                            onTimeout:
                              action:
                                type: Abort
              - stepGroup:
                  name: Release
                  identifier: release
                  when:
                    stageStatus: Success
                    condition: <+execution.steps.evaluate_container_gate.output.outputVariables.CONTAINER_GATE_PASSED>
                      == "true"
                  steps:
                    - step:
                        type: BuildAndPushDockerRegistry
                        name: Push Docker Image
                        identifier: push_docker_image
                        spec:
                          connectorRef: DockerCristian
                          repo: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service
                          tags:
                            - <+execution.steps.version_<+repeat.item>.steps.semantic_version.output.outputVariables.IMAGE_TAG>
                            - latest
                          caching: true
                          envVariables:
                            PLUGIN_PUSH_ONLY: "true"
                            PLUGIN_SOURCE_TAR_PATH: /harness/images/<+repeat.item>-service.tar
                    - step:
                        name: Create Git Tag
                        identifier: create_git_tag
                        type: Run
                        spec:
                          connectorRef: account.harnessImage
                          image: alpine:3.19
                          shell: Sh
                          command: |
                            apk add --no-cache curl jq > /dev/null 2>&1

                            TAG_NAME="<+execution.steps.version_<+repeat.item>.steps.semantic_version.output.outputVariables.TAG_NAME>"

                            echo "=== Creating Git Tag: $TAG_NAME ==="

                            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                              "https://api.github.com/repos/${GITHUB_REPO}/git/refs" \
                              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                              -H "Accept: application/vnd.github.v3+json" \
                              -d "{\"ref\":\"refs/tags/${TAG_NAME}\",\"sha\":\"${COMMIT_SHA}\"}")

                            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
                            BODY=$(echo "$RESPONSE" | sed '$d')

                            if [ "$HTTP_CODE" = "201" ]; then
                              echo "✅ Tag created: $TAG_NAME"
                            elif [ "$HTTP_CODE" = "422" ]; then
                              echo "ℹ️ Tag already exists: $TAG_NAME"
                            else
                              echo "❌ Failed to create tag: $HTTP_CODE"
                              echo "$BODY"
                              exit 1
                            fi
                          envVariables:
                            GITHUB_REPO: crizstian/cinema-microservice-in-GO
                            GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                            COMMIT_SHA: <+codebase.commitSha>
                  strategy:
                    repeat:
                      items: <+pipeline.variables.SERVICES.split(",")>
                      nodeName: <+repeat.item>
                      maxConcurrency: 2
              - step:
                  name: PR Comment - Consolidated
                  identifier: pr_comment_consolidated
                  type: Run
                  when:
                    stageStatus: Success
                  spec:
                    connectorRef: account.harnessImage
                    image: alpine:3.19
                    shell: Sh
                    command: |
                      apk add --no-cache curl jq > /dev/null 2>&1

                      COMMENT_MARKER="<!-- harness-cicd-summary -->"

                      PR_NUMBER="$INPUT_PR_NUMBER"
                      if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
                        PR_DATA=$(curl -s "https://api.github.com/repos/${GITHUB_REPO}/commits/${COMMIT_SHA}/pulls" \
                          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                          -H "Accept: application/vnd.github.v3+json")
                        PR_NUMBER=$(echo "$PR_DATA" | jq -r '.[0].number // empty')
                      fi

                      if [ -z "$PR_NUMBER" ]; then
                        echo "No PR found - skipping comment"
                        exit 0
                      fi

                      CONTAINER_PASSED="$CONTAINER_GATE_PASSED"
                      if [ "$CONTAINER_PASSED" = "true" ]; then
                        OVERALL_STATUS="✅ All checks passed"
                        OVERALL_ICON="✅"
                      else
                        OVERALL_STATUS="⚠️ Issues require attention"
                        OVERALL_ICON="⚠️"
                      fi

                      SUMMARY_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
                      SERVICE_COUNT=$(echo "$SERVICES" | tr ',' '\n' | grep -c .)

                      COMMENT="${COMMENT_MARKER}
                      ## ${OVERALL_ICON} CI/CD Summary

                      **Status:** ${OVERALL_STATUS}
                      **Services:** ${SERVICES} (Python ${PYTHON_VERSION})
                      **Updated:** ${SUMMARY_DATE}

                      ---

                      <details>
                      <summary>🔒 Security Scan Results</summary>

                      | Metric | Count | Threshold | Status |
                      |--------|-------|-----------|--------|
                      | Critical | ${CONTAINER_CRITICAL:-0} | 0 | $([ \"${CONTAINER_CRITICAL:-0}\" = \"0\" ] && echo '✅' || echo '❌') |
                      | High | ${CONTAINER_HIGH:-0} | 3 | $([ \"${CONTAINER_HIGH:-0}\" -le 3 ] && echo '✅' || echo '⚠️') |

                      </details>

                      <details>
                      <summary>📦 Build & Release (${SERVICE_COUNT} services)</summary>

                      | Service | Image | Status |
                      |---------|-------|--------|"

                      for svc in $(echo "$SERVICES" | tr ',' ' '); do
                        COMMENT="${COMMENT}
                      | ${svc} | \`${DOCKER_REGISTRY}/${svc}-service\` | ${OVERALL_ICON} |"
                      done

                      COMMENT="${COMMENT}

                      </details>

                      ---

                      📋 [View Pipeline Execution](${EXECUTION_URL}) • Commit: \`${COMMIT_SHA:0:7}\` • Run: #${PIPELINE_SEQ}"

                      EXISTING_COMMENT=$(curl -s \
                        "https://api.github.com/repos/${GITHUB_REPO}/issues/${PR_NUMBER}/comments" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github.v3+json" | \
                        jq -r ".[] | select(.body | contains(\"${COMMENT_MARKER}\")) | .id" | head -1)

                      if [ -n "$EXISTING_COMMENT" ]; then
                        curl -s -X PATCH \
                          "https://api.github.com/repos/${GITHUB_REPO}/issues/comments/${EXISTING_COMMENT}" \
                          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                          -H "Accept: application/vnd.github.v3+json" \
                          -d "$(jq -n --arg body "$COMMENT" '{body: $body}')" > /dev/null
                        echo "✅ Updated existing PR comment"
                      else
                        curl -s -X POST \
                          "https://api.github.com/repos/${GITHUB_REPO}/issues/${PR_NUMBER}/comments" \
                          -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                          -H "Accept: application/vnd.github.v3+json" \
                          -d "$(jq -n --arg body "$COMMENT" '{body: $body}')" > /dev/null
                        echo "✅ Created new PR comment"
                      fi

                      STATE=$([ "$CONTAINER_PASSED" = "true" ] && echo "success" || echo "failure")
                      curl -s -X POST \
                        "https://api.github.com/repos/${GITHUB_REPO}/statuses/${COMMIT_SHA}" \
                        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                        -H "Accept: application/vnd.github.v3+json" \
                        -d "{\"state\":\"${STATE}\",\"target_url\":\"${EXECUTION_URL}\",\"description\":\"CI/CD ${OVERALL_STATUS}\",\"context\":\"harness-ci/summary\"}" > /dev/null
                    envVariables:
                      SERVICES: <+pipeline.variables.SERVICES>
                      PYTHON_VERSION: <+pipeline.variables.PYTHON_VERSION_DEFAULT>
                      DOCKER_REGISTRY: <+pipeline.variables.DOCKER_REGISTRY>
                      GITHUB_REPO: crizstian/cinema-microservice-in-GO
                      GITHUB_TOKEN: <+secrets.getValue("CristianGithub")>
                      COMMIT_SHA: <+codebase.commitSha>
                      EXECUTION_URL: <+pipeline.executionUrl>
                      PIPELINE_NAME: <+pipeline.name>
                      PIPELINE_SEQ: <+pipeline.sequenceId>
                      INPUT_PR_NUMBER: <+codebase.prNumber>
                      CONTAINER_GATE_PASSED: <+execution.steps.evaluate_container_gate.output.outputVariables.CONTAINER_GATE_PASSED>
                      CONTAINER_CRITICAL: <+execution.steps.evaluate_container_gate.output.outputVariables.CONTAINER_CRITICAL>
                      CONTAINER_HIGH: <+execution.steps.evaluate_container_gate.output.outputVariables.CONTAINER_HIGH>
        policySetRef:
          - security_gate_container
    - stage:
        name: Deploy to DEV
        identifier: deploy_dev
        description: Sequential deployment of each Python service to DEV
        type: Deployment
        when:
          pipelineStatus: Success
          condition: (<+pipeline.variables.RUN_MODE> == "pr_merge" ||
            <+pipeline.variables.RUN_MODE> == "full") &&
            <+pipeline.variables.SERVICES> != "" &&
            <+pipeline.variables.SERVICES> != "null"
        variables:
          - name: ARTIFACT_TAG
            type: String
            description: Docker image tag to deploy (auto-resolved from CI or manual input)
            required: true
            value: <+pipeline.stages.push_and_release.spec.execution.steps.release_<+repeat.item>.steps.push_docker_image.artifact_release_<+repeat.item>_push_docker_image.stepArtifacts.publishedImageArtifacts[0].tag>
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+repeat.item>service
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: artifact
                      sources:
                        - identifier: artifact
                          type: DockerRegistry
                          spec:
                            tag: <+stage.variables.ARTIFACT_TAG>
          environment:
            environmentRef: sandbox
            deployToAll: false
            infrastructureDefinitions:
              - identifier: sesandboxkubernetes
                inputs:
                  identifier: sesandboxkubernetes
                  type: KubernetesDirect
                  spec:
                    namespace: cinema-dev
          execution:
            steps:
              - step:
                  name: Rolling Deployment
                  identifier: rollingDeployment
                  type: K8sRollingDeploy
                  timeout: 10m
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
              - step:
                  name: HTTP Liveness Check
                  identifier: httpLiveness
                  type: Http
                  timeout: 30s
                  spec:
                    url: http://<+service.name>.cinema-dev.svc.cluster.local:<+serviceVariables.port>/health/live
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
              - step:
                  name: HTTP Readiness Check
                  identifier: httpReadiness
                  type: Http
                  timeout: 30s
                  spec:
                    url: http://<+service.name>.cinema-dev.svc.cluster.local:<+serviceVariables.port>/health/ready
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
              - step:
                  name: Smoke Test
                  identifier: smokeTest
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -euo pipefail
                          echo "=== Smoke Test: <+service.name> ==="

                          SERVICE_URL="http://<+service.name>.cinema-dev.svc.cluster.local:<+serviceVariables.port>"

                          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health" || echo "000")

                          if [ "$RESPONSE" = "200" ]; then
                            echo "Smoke test passed"
                          else
                            echo "Warning: API returned $RESPONSE"
                          fi
            rollbackSteps:
              - step:
                  name: Rollback Deployment
                  identifier: rollbackDeployment
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        strategy:
          repeat:
            items: <+pipeline.variables.SERVICES.split(",")>
            nodeName: <+repeat.item>service
            maxConcurrency: 1
  allowStageExecutions: true
