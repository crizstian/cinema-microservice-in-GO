pipeline:
  name: Cinema GitOps Deploy
  identifier: Cinema_GitOps_Deploy
  projectIdentifier: CristianRamirez
  orgIdentifier: sandbox
  tags:
    version: "2.0"
    type: gitops
    app: cinema-microservices
  description: |
    Multi-service GitOps deployment pipeline for Cinema microservices.
    Supports deploying multiple services in a single pipeline run.
    Uses Harness GitOps with ArgoCD for declarative deployments.
  properties:
    ci:
      codebase:
        connectorRef: CristianConnector
        repoName: cinema-microservice-in-GO
        build: <+input>
        prCloneStrategy: SourceBranch
  variables:
    - name: SERVICES
      type: String
      description: Comma-separated list of services to deploy (e.g., booking,movie,cinema)
      required: true
      value: <+input>
    - name: IMAGE_TAG
      type: String
      description: Docker image tag to deploy (e.g., 1.0.0, latest)
      required: true
      value: <+input>
    - name: DOCKER_REGISTRY
      type: String
      description: Docker registry prefix
      value: crizstian
  stages:
    - stage:
        name: Dev
        identifier: Dev
        description: Deploy all services to development environment
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: <+repeat.item>servicegitops
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: serviceimage
                      sources:
                        - identifier: serviceimage
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Release Repo
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: image_tag
                        type: String
                        value: <+pipeline.variables.IMAGE_TAG>
                      - name: service_name
                        type: String
                        value: <+repeat.item>
                      - name: replicas
                        type: String
                        value: "1"
                      - name: environment
                        type: String
                        value: dev
              - step:
                  type: HarnessApproval
                  name: PR Review
                  identifier: PR_Review
                  spec:
                    approvalMessage: |
                      Review GitOps PR for <+repeat.item>
                      Environment: Dev
                      Image: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service:<+pipeline.variables.IMAGE_TAG>
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - account.SalesEngineers
                      minimumCount: 1
                      disallowPipelineExecutor: false
                  timeout: 1d
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  spec:
                    deleteSourceBranch: true
                  timeout: 10m
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec: {}
              - step:
                  type: GitOpsSync
                  name: Sync to Cluster
                  identifier: GitOpsSync
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: true
                    applicationRegex: <+repeat.item>-dev
                    showResourceProgress: true
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: true
                      pruneResourcesAtLast: true
                      applyOutOfSyncOnly: true
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      serverSideApply: true
                  timeout: 10m
              - step:
                  type: Http
                  name: Liveness Check
                  identifier: livenessCheck
                  timeout: 30s
                  spec:
                    url: http://<+repeat.item>-service.cinema-dev.svc.cluster.local:8000/health/live
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 10s
                            onRetryFailure:
                              action:
                                type: MarkAsFailure
              - step:
                  type: Http
                  name: Readiness Check
                  identifier: readinessCheck
                  timeout: 30s
                  spec:
                    url: http://<+repeat.item>-service.cinema-dev.svc.cluster.local:8000/health/ready
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 10s
                            onRetryFailure:
                              action:
                                type: MarkAsFailure
              - step:
                  type: ShellScript
                  name: Smoke Test
                  identifier: smokeTest
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -euo pipefail

                          SERVICE="<+repeat.item>"
                          NAMESPACE="cinema-dev"
                          SERVICE_URL="http://${SERVICE}-service.${NAMESPACE}.svc.cluster.local:8000"

                          echo "╔══════════════════════════════════════════════════════════════╗"
                          echo "║  Smoke Test: ${SERVICE}-service                              "
                          echo "║  Environment: dev                                            "
                          echo "╚══════════════════════════════════════════════════════════════╝"

                          # Test health endpoint
                          echo "=== Testing /api/health ==="
                          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health" || echo "000")
                          if [ "$RESPONSE" = "200" ]; then
                            echo "✅ Health check passed"
                          else
                            echo "⚠️  Health check returned: $RESPONSE"
                          fi

                          # Test service-specific endpoint
                          echo "=== Testing service endpoint ==="
                          case "$SERVICE" in
                            movie)
                              curl -s "$SERVICE_URL/api/movies" | head -c 200 || true
                              ;;
                            cinema)
                              curl -s "$SERVICE_URL/api/cinemas" | head -c 200 || true
                              ;;
                            booking)
                              curl -s "$SERVICE_URL/api/bookings/health" | head -c 200 || true
                              ;;
                            *)
                              echo "ℹ️  No specific endpoint test for $SERVICE"
                              ;;
                          esac

                          echo ""
                          echo "✅ Smoke test completed for ${SERVICE}"
            rollbackSteps:
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: RevertPR
                  spec:
                    commitId: <+execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
                    prTitle: "Rollback: <+repeat.item> dev"
                  timeout: 10m
              - step:
                  type: MergePR
                  name: Merge Rollback
                  identifier: MergeRollback
                  spec:
                    deleteSourceBranch: true
                  timeout: 10m
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Apps
                  identifier: FetchApps
                  spec: {}
                  timeout: 10m
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: SyncRollback
                  spec:
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: true
                    applicationRegex: <+repeat.item>-dev
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      serverSideApply: true
                  timeout: 10m
          environment:
            environmentRef: dev
            deployToAll: false
            gitOpsClusters:
              - identifier: incluster
                agentIdentifier: gitops
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        strategy:
          repeat:
            items: <+pipeline.variables.SERVICES.split(",")>
            nodeName: <+repeat.item>
            maxConcurrency: 1

    - stage:
        name: Staging Gate
        identifier: Staging_Gate
        description: Approval for staging deployment
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve Staging
                  identifier: ApproveStaging
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |
                      Approve deployment to Staging?
                      Services: <+pipeline.variables.SERVICES>
                      Image Tag: <+pipeline.variables.IMAGE_TAG>
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 1
                      disallowPipelineExecutor: false
                      userGroups:
                        - account.SalesEngineers
                    isAutoRejectEnabled: false
        tags: {}

    - stage:
        name: Staging
        identifier: Staging
        description: Deploy all services to staging environment
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: <+repeat.item>servicegitops
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: serviceimage
                      sources:
                        - identifier: serviceimage
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Release Repo
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: image_tag
                        type: String
                        value: <+pipeline.variables.IMAGE_TAG>
                      - name: service_name
                        type: String
                        value: <+repeat.item>
                      - name: replicas
                        type: String
                        value: "2"
                      - name: environment
                        type: String
                        value: staging
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  spec:
                    deleteSourceBranch: true
                  timeout: 10m
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec: {}
              - step:
                  type: GitOpsSync
                  name: Sync to Cluster
                  identifier: GitOpsSync
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: true
                    applicationRegex: <+repeat.item>-staging
                    showResourceProgress: true
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: true
                      serverSideApply: true
                      pruneResourcesAtLast: true
                      applyOutOfSyncOnly: true
                      replaceResources: false
                      prunePropagationPolicy: foreground
                  timeout: 10m
              - step:
                  type: Http
                  name: Liveness Check
                  identifier: livenessCheck
                  timeout: 30s
                  spec:
                    url: http://<+repeat.item>-service.cinema-staging.svc.cluster.local:8000/health/live
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 10s
                            onRetryFailure:
                              action:
                                type: MarkAsFailure
              - step:
                  type: Http
                  name: Readiness Check
                  identifier: readinessCheck
                  timeout: 30s
                  spec:
                    url: http://<+repeat.item>-service.cinema-staging.svc.cluster.local:8000/health/ready
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 10s
                            onRetryFailure:
                              action:
                                type: MarkAsFailure
              - step:
                  type: ShellScript
                  name: Smoke Test
                  identifier: smokeTest
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -euo pipefail

                          SERVICE="<+repeat.item>"
                          NAMESPACE="cinema-staging"
                          SERVICE_URL="http://${SERVICE}-service.${NAMESPACE}.svc.cluster.local:8000"

                          echo "╔══════════════════════════════════════════════════════════════╗"
                          echo "║  Smoke Test: ${SERVICE}-service                              "
                          echo "║  Environment: staging                                        "
                          echo "╚══════════════════════════════════════════════════════════════╝"

                          # Test health endpoint
                          echo "=== Testing /api/health ==="
                          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health" || echo "000")
                          if [ "$RESPONSE" = "200" ]; then
                            echo "✅ Health check passed"
                          else
                            echo "⚠️  Health check returned: $RESPONSE"
                          fi

                          # Test service-specific endpoint
                          echo "=== Testing service endpoint ==="
                          case "$SERVICE" in
                            movie)
                              curl -s "$SERVICE_URL/api/movies" | head -c 200 || true
                              ;;
                            cinema)
                              curl -s "$SERVICE_URL/api/cinemas" | head -c 200 || true
                              ;;
                            booking)
                              curl -s "$SERVICE_URL/api/bookings/health" | head -c 200 || true
                              ;;
                            *)
                              echo "ℹ️  No specific endpoint test for $SERVICE"
                              ;;
                          esac

                          echo ""
                          echo "✅ Smoke test completed for ${SERVICE}"
            rollbackSteps:
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: RevertPR
                  spec:
                    commitId: <+execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
                    prTitle: "Rollback: <+repeat.item> staging"
                  timeout: 10m
              - step:
                  type: MergePR
                  name: Merge Rollback
                  identifier: MergeRollback
                  spec:
                    deleteSourceBranch: true
                  timeout: 10m
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Apps
                  identifier: FetchApps
                  spec: {}
                  timeout: 10m
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: SyncRollback
                  spec:
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: true
                    applicationRegex: <+repeat.item>-staging
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      serverSideApply: true
                  timeout: 10m
          environment:
            environmentRef: staging
            deployToAll: false
            gitOpsClusters:
              - identifier: incluster
                agentIdentifier: gitops
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        strategy:
          repeat:
            items: <+pipeline.variables.SERVICES.split(",")>
            nodeName: <+repeat.item>
            maxConcurrency: 1

    - stage:
        name: Prod Gate
        identifier: Prod_Gate
        description: Approval for production deployment
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  name: Approve Production
                  identifier: ApproveProd
                  type: HarnessApproval
                  timeout: 1d
                  spec:
                    approvalMessage: |
                      ⚠️ PRODUCTION DEPLOYMENT ⚠️
                      Services: <+pipeline.variables.SERVICES>
                      Image Tag: <+pipeline.variables.IMAGE_TAG>

                      Please verify staging deployment before approving.
                    includePipelineExecutionHistory: true
                    approvers:
                      minimumCount: 2
                      disallowPipelineExecutor: true
                      userGroups:
                        - account.SalesEngineers
                    isAutoRejectEnabled: false
        tags: {}

    - stage:
        name: Prod
        identifier: Prod
        description: Deploy all services to production environment
        type: Deployment
        spec:
          deploymentType: Kubernetes
          gitOpsEnabled: true
          service:
            serviceRef: <+repeat.item>servicegitops
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: serviceimage
                      sources:
                        - identifier: serviceimage
                          type: DockerRegistry
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
          execution:
            steps:
              - step:
                  type: GitOpsUpdateReleaseRepo
                  name: Update Release Repo
                  identifier: updateReleaseRepo
                  timeout: 10m
                  spec:
                    variables:
                      - name: image_tag
                        type: String
                        value: <+pipeline.variables.IMAGE_TAG>
                      - name: service_name
                        type: String
                        value: <+repeat.item>
                      - name: replicas
                        type: String
                        value: "3"
                      - name: environment
                        type: String
                        value: prod
              - step:
                  type: HarnessApproval
                  name: Final PR Review
                  identifier: FinalPRReview
                  spec:
                    approvalMessage: |
                      Review production PR before merge
                      Service: <+repeat.item>
                      Image: <+pipeline.variables.DOCKER_REGISTRY>/<+repeat.item>-service:<+pipeline.variables.IMAGE_TAG>
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - account.SalesEngineers
                      minimumCount: 1
                      disallowPipelineExecutor: false
                  timeout: 4h
              - step:
                  type: MergePR
                  name: Merge PR
                  identifier: mergePR
                  spec:
                    deleteSourceBranch: true
                  timeout: 10m
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Linked Apps
                  identifier: fetchLinkedApps
                  timeout: 10m
                  spec: {}
              - step:
                  type: GitOpsSync
                  name: Sync to Cluster
                  identifier: GitOpsSync
                  spec:
                    prune: true
                    dryRun: false
                    applyOnly: false
                    forceApply: true
                    applicationRegex: <+repeat.item>-prod
                    showResourceProgress: true
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: true
                      serverSideApply: true
                      pruneResourcesAtLast: true
                      applyOutOfSyncOnly: true
                      replaceResources: false
                      prunePropagationPolicy: foreground
                  timeout: 15m
              - step:
                  type: Http
                  name: Liveness Check
                  identifier: livenessCheck
                  timeout: 30s
                  spec:
                    url: http://<+repeat.item>-service.cinema-prod.svc.cluster.local:8000/health/live
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 10s
                            onRetryFailure:
                              action:
                                type: MarkAsFailure
              - step:
                  type: Http
                  name: Readiness Check
                  identifier: readinessCheck
                  timeout: 30s
                  spec:
                    url: http://<+repeat.item>-service.cinema-prod.svc.cluster.local:8000/health/ready
                    method: GET
                    headers: []
                    assertion: <+httpResponseCode> == 200
                  failureStrategies:
                    - onFailure:
                        errors:
                          - AllErrors
                        action:
                          type: Retry
                          spec:
                            retryCount: 3
                            retryIntervals:
                              - 10s
                            onRetryFailure:
                              action:
                                type: MarkAsFailure
              - step:
                  type: ShellScript
                  name: Smoke Test
                  identifier: smokeTest
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          #!/bin/bash
                          set -euo pipefail

                          SERVICE="<+repeat.item>"
                          NAMESPACE="cinema-prod"
                          SERVICE_URL="http://${SERVICE}-service.${NAMESPACE}.svc.cluster.local:8000"

                          echo "╔══════════════════════════════════════════════════════════════╗"
                          echo "║  Smoke Test: ${SERVICE}-service                              "
                          echo "║  Environment: prod                                           "
                          echo "╚══════════════════════════════════════════════════════════════╝"

                          # Test health endpoint
                          echo "=== Testing /api/health ==="
                          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/api/health" || echo "000")
                          if [ "$RESPONSE" = "200" ]; then
                            echo "✅ Health check passed"
                          else
                            echo "⚠️  Health check returned: $RESPONSE"
                          fi

                          # Test service-specific endpoint
                          echo "=== Testing service endpoint ==="
                          case "$SERVICE" in
                            movie)
                              curl -s "$SERVICE_URL/api/movies" | head -c 200 || true
                              ;;
                            cinema)
                              curl -s "$SERVICE_URL/api/cinemas" | head -c 200 || true
                              ;;
                            booking)
                              curl -s "$SERVICE_URL/api/bookings/health" | head -c 200 || true
                              ;;
                            *)
                              echo "ℹ️  No specific endpoint test for $SERVICE"
                              ;;
                          esac

                          echo ""
                          echo "✅ Smoke test completed for ${SERVICE}"
            rollbackSteps:
              - step:
                  type: RevertPR
                  name: Revert PR
                  identifier: RevertPR
                  spec:
                    commitId: <+execution.steps.updateReleaseRepo.updateReleaseRepoOutcome.commitId>
                    prTitle: "ROLLBACK: <+repeat.item> PRODUCTION"
                  timeout: 10m
              - step:
                  type: MergePR
                  name: Merge Rollback
                  identifier: MergeRollback
                  spec:
                    deleteSourceBranch: true
                  timeout: 10m
              - step:
                  type: GitOpsFetchLinkedApps
                  name: Fetch Apps
                  identifier: FetchApps
                  spec: {}
                  timeout: 10m
              - step:
                  type: GitOpsSync
                  name: Sync Rollback
                  identifier: SyncRollback
                  spec:
                    prune: false
                    dryRun: false
                    applyOnly: false
                    forceApply: true
                    applicationRegex: <+repeat.item>-prod
                    syncOptions:
                      skipSchemaValidation: false
                      autoCreateNamespace: false
                      pruneResourcesAtLast: false
                      applyOutOfSyncOnly: false
                      replaceResources: false
                      prunePropagationPolicy: foreground
                      serverSideApply: true
                  timeout: 10m
          environment:
            environmentRef: prod
            deployToAll: false
            gitOpsClusters:
              - identifier: seprod
                agentIdentifier: gitops
        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
        strategy:
          repeat:
            items: <+pipeline.variables.SERVICES.split(",")>
            nodeName: <+repeat.item>
            maxConcurrency: 1
  allowStageExecutions: true
