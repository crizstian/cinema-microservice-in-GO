version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - staticcheck
    - unused
    - govet
    - ineffassign

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
    - path: test/
      linters:
        - errcheck
    - text: "redundant break statement"
      linters:
        - staticcheck

  max-issues-per-linter: 50
  max-same-issues: 10
