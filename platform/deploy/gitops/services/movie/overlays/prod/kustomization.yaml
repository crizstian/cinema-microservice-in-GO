apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cinema-prod

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/environment: prod
  harness.io/envRef: prod

images:
  - name: crizstian/movie-service
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: movie-service
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
  - target:
      kind: ConfigMap
      name: movie-service-config
    patch: |
      - op: add
        path: /data/LOG_LEVEL
        value: warn
      - op: add
        path: /data/DB_SERVERS
        value: mongodb.cinema-infra.svc.cluster.local:27017
      - op: add
        path: /data/NATS_URL
        value: nats://nats.cinema-infra.svc.cluster.local:4222
  - target:
      kind: HorizontalPodAutoscaler
      name: movie-service
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
