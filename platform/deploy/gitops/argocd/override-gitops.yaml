## Harness GitOps Agent - Overrides File
## For default overrides, please refer to https://github.com/harness/gitops-helm/blob/main/values.yaml
## Argo CD overrides can be found at https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml

# <---Harness configuration overrides--->
harness:
  identity:
    accountIdentifier: EeRjnXTnS4GrLG5VNNJZUw
    orgIdentifier: sandbox
    projectIdentifier: CristianRamirez
    agentIdentifier: selatamgke

  secrets:
    agentSecret: 
    # <---CA data overrides--->
    caData:
      enabled: false
      secret:
    redisPassword: lAnrH9D8ANw7UA==

  gitopsServerHost: https://app.harness.io/gratis/gitops
  networkPolicy:
    create: false
  createClusterRoles: true

  configMap:
    logLevel: DEBUG

    # <---ArgoCD service names for BYOA--->
    argocd:
      redis: "argocd-redis-ha-haproxy"
      redisHa: "argocd-redis-ha"
      redisHaProxy: "argocd-redis-ha-haproxy"
      redisSvc: "argocd-redis-ha-haproxy"
      redisHaProxySvc: "argocd-redis-ha-haproxy"

    # <---Agent communication protocol details--->
    http:
      agentHttpTarget: https://app.harness.io/gitops
      tlsEnabled: false
      certPath: /tmp/ca.bundle

    reconcile:
      appsetReconcile: true

  # <---Disaster Recovery override values--->
  disasterRecovery:
    enabled: false
    identifier:

      # <---Openshift override values--->
  openshift:
    enabled: false
  flux:
    enabled: false
  argocdHarnessPlugin:
    enabled: false

argo-cd:
  enabled: false

# Redis HA configuration (BYOA with existing ArgoCD redis-ha)
redis-ha:
  enabled: true
  name: "argocd-redis-ha"
  haproxy:
    enabled: true
  existingSecret: argocd-redis

# <---Agent overrides--->
agent:
  harnessName: se-latam-gke
  image:
    repository: docker.io/harness/gitops-agent
    tag: v0.115.0

  replicas: 1
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Schedule on agent-nodepool
  nodeSelector:
    cloud.google.com/gke-nodepool: agent-nodepool

  # Toleration for dedicated delegate nodepool
  tolerations:
    - key: "dedicated"
      operator: "Equal"
      value: "delegate"
      effect: "NoSchedule"

  fipsEnabled: false

  autoscaling:
    enabled: false

  highAvailability: false
  # <---Agent Proxy Config overrides--->
  proxy:
    enabled: false
    httpProxy:
    httpsProxy:

      # <---Agent upgrader overrides--->
upgrader:
  enabled: true
  image: docker.io/harness/upgrader:latest

  config:
    # -- Proxy configuration for upgrader
    # HTTPS_PROXY=proxyScheme://proxyUser:proxyPassword@proxyHost:proxyPort
    proxyHost:
    proxyPort:
    proxyScheme:
    noProxy:
    proxyUser:
    proxyPassword:
