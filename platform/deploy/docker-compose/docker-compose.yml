version: '3'

services:
  mongo1:
    # Nueva convención: registry/organization/service:version
    image: crizstian/cinema/cinemas-db:v0.1
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      DB_ADMIN_USER: "cristian"
      DB_ADMIN_PASS: "cristianPassword2017"
      DB_REPLICA_ADMIN: "replicaAdmin"
      DB_REPLICA_ADMIN_PASS: "replicaAdminPassword2017"
      DB_REPLSET_NAME: "rs1"
      DB_PORT: "27017"
      DB1: "10.7.0.3"
      DB2: "10.7.0.4"
      DB3: "10.7.0.5"
      IS_PRIMARY: "false"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      dc1:
        ipv4_address: 10.7.0.3

  mongo2:
    image: crizstian/cinema/cinemas-db:v0.1
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      DB_ADMIN_USER: "cristian"
      DB_ADMIN_PASS: "cristianPassword2017"
      DB_REPLICA_ADMIN: "replicaAdmin"
      DB_REPLICA_ADMIN_PASS: "replicaAdminPassword2017"
      DB_REPLSET_NAME: "rs1"
      DB_PORT: "27017"
      DB1: "10.7.0.3"
      DB2: "10.7.0.4"
      DB3: "10.7.0.5"
      IS_PRIMARY: "false"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      dc1:
        ipv4_address: 10.7.0.4

  mongo3:
    image: crizstian/cinema/cinemas-db:v0.1
    restart: unless-stopped
    ports:
      - "27019:27017"
    environment:
      DB_ADMIN_USER: "cristian"
      DB_ADMIN_PASS: "cristianPassword2017"
      DB_REPLICA_ADMIN: "replicaAdmin"
      DB_REPLICA_ADMIN_PASS: "replicaAdminPassword2017"
      DB_REPLSET_NAME: "rs1"
      DB_PORT: "27017"
      DB1: "10.7.0.3"
      DB2: "10.7.0.4"
      DB3: "10.7.0.5"
      IS_PRIMARY: "true"
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      - mongo1
      - mongo2
    networks:
      dc1:
        ipv4_address: 10.7.0.5

  movie:
    image: crizstian/cinema/movie-service:v0.5
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DB_USER: "cristian"
      DB_PASS: "cristianPassword2017"
      DB_SERVERS: "10.7.0.3:27017,10.7.0.4:27017,10.7.0.5:27017"
      DB_NAME: "movies"
      DB_REPLICA: "rs1"
      SERVICE_PORT: "8000"
    depends_on:
      - mongo3
    networks:
      dc1:
        ipv4_address: 10.7.0.6

  payment:
    image: crizstian/cinema/payment-service:v0.5
    restart: on-failure
    ports:
      - "8100:8000"
    environment:
      DB_USER: "cristian"
      DB_PASS: "cristianPassword2017"
      DB_SERVERS: "10.7.0.3:27017,10.7.0.4:27017,10.7.0.5:27017"
      DB_NAME: "payment"
      DB_REPLICA: "rs1"
      SERVICE_PORT: "8000"
    depends_on:
      - mongo3
    networks:
      dc1:
        ipv4_address: 10.7.0.7

  notification:
    image: crizstian/cinema/notification-service:v0.5
    restart: on-failure
    ports:
      - "8200:8000"
    environment:
      SERVICE_PORT: "8000"
      EMAIL: "your-email@gmail.com"
      EMAIL_PASS: "your-password"
    networks:
      dc1:
        ipv4_address: 10.7.0.8

  booking:
    image: crizstian/cinema/booking-service:v0.5
    restart: on-failure
    ports:
      - "8300:8000"
    environment:
      DB_USER: "cristian"
      DB_PASS: "cristianPassword2017"
      DB_SERVERS: "10.7.0.3:27017,10.7.0.4:27017,10.7.0.5:27017"
      DB_NAME: "booking"
      DB_REPLICA: "rs1"
      SERVICE_PORT: "8000"
      PAYMENT_URL: "http://10.7.0.7:8000"
      NOTIFICATION_URL: "http://10.7.0.8:8000"
      ENABLE_TRACING: "false"
    networks:
      dc1:
        ipv4_address: 10.7.0.9

