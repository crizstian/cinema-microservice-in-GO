# ============================================================
# Docker Compose - Cinema Microservices
# ============================================================
# Unified compose file with profiles for dev and test environments.
#
# Profiles:
#   - dev:  3 MongoDB replicas, persistent volumes (production-like)
#   - test: 1 MongoDB node, tmpfs (fast, ephemeral)
#
# Usage:
#   task dev:up          # Start dev environment
#   task dev:down        # Stop dev environment
#   task test:e2e        # Run E2E tests
#
# Manual:
#   docker compose --profile dev up -d
#   docker compose --profile test up -d
#   docker compose --profile test --profile e2e up
# ============================================================

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 15s

x-mongo-env: &mongo-env
  DB_USER: ""
  DB_PASS: ""
  DB_NAME: "cinema"
  DB_REPLICA: "rs0"

x-nats-env: &nats-env
  NATS_URL: "nats://nats:4222"

services:
  # ============================================================
  # MongoDB - Dev (3 replicas with persistent volumes)
  # ============================================================

  mongo1:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-dev}-mongo1
    hostname: mongo1
    profiles: [dev]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    volumes:
      - mongo1_data:/data/db
    networks:
      - cinema-network

  mongo2:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-dev}-mongo2
    hostname: mongo2
    profiles: [dev]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27018:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    volumes:
      - mongo2_data:/data/db
    networks:
      - cinema-network

  mongo3:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-dev}-mongo3
    hostname: mongo3
    profiles: [dev]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    volumes:
      - mongo3_data:/data/db
    networks:
      - cinema-network

  mongo-init-dev:
    build:
      context: ../../docker/mongodb
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX:-dev}-mongo-init
    profiles: [dev]
    environment:
      MONGO_HOST: mongo1
      REPLICA_SET: rs0
      REPLICA_MEMBERS: "mongo1,mongo2,mongo3"
      AUTH_ENABLED: "false"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    restart: "no"
    networks:
      - cinema-network

  # ============================================================
  # MongoDB - Test (single node with tmpfs)
  # ============================================================

  mongo:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-test}-mongo
    hostname: mongo
    profiles: [test]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    tmpfs:
      - /data/db
    networks:
      - cinema-network

  mongo-init-test:
    build:
      context: ../../docker/mongodb
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX:-test}-mongo-init
    profiles: [test]
    environment:
      MONGO_HOST: mongo
      REPLICA_SET: rs0
      AUTH_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - cinema-network

  # ============================================================
  # Redis (shared, profile-specific storage)
  # ============================================================

  redis-dev:
    image: redis:7-alpine
    container_name: ${ENV_PREFIX:-dev}-redis
    hostname: redis
    profiles: [dev]
    ports:
      - "6379:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - redis_data:/data
    networks:
      - cinema-network

  redis-test:
    image: redis:7-alpine
    container_name: ${ENV_PREFIX:-test}-redis
    hostname: redis
    profiles: [test]
    ports:
      - "6379:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    tmpfs:
      - /data
    networks:
      - cinema-network

  # ============================================================
  # NATS (shared between profiles)
  # ============================================================

  nats:
    image: nats:2.10-alpine
    container_name: ${ENV_PREFIX:-cinema}-nats
    hostname: nats
    profiles: [dev, test]
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222", "-js"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
    networks:
      - cinema-network

  # ============================================================
  # Microservices (shared between dev and test)
  # ============================================================

  movie:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: movie
        SERVICE_PORT: 8000
    image: ${REGISTRY:-cinema}/movie:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-movie
    hostname: movie
    profiles: [dev, test]
    ports:
      - "8000:8000"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      SERVICE_PORT: "8000"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ping | grep -q pong"]
    networks:
      - cinema-network

  cinema:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: cinema
        SERVICE_PORT: 8085
    image: ${REGISTRY:-cinema}/cinema:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-cinema
    hostname: cinema
    profiles: [dev, test]
    ports:
      - "8085:8085"
    environment:
      <<: *nats-env
      MONGO_URI: "mongodb://${MONGO_SERVERS:-mongo:27017}/?replicaSet=rs0"
      MONGO_DB: "cinema"
      PORT: "8085"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/ping | grep -q pong"]
    networks:
      - cinema-network

  user:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: user
        SERVICE_PORT: 8004
    image: ${REGISTRY:-cinema}/user:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-user
    hostname: user
    profiles: [dev, test]
    ports:
      - "8004:8004"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      SERVICE_PORT: "8004"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/ping | grep -q pong"]
    networks:
      - cinema-network

  showtime:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: showtime
        SERVICE_PORT: 3003
    image: ${REGISTRY:-cinema}/showtime:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-showtime
    hostname: showtime
    profiles: [dev, test]
    ports:
      - "3003:3003"
    environment:
      <<: *nats-env
      MONGO_URI: "mongodb://${MONGO_SERVERS:-mongo:27017}/?replicaSet=rs0"
      MONGO_DB: "cinema"
      PORT: "3003"
      MOVIE_SERVICE_URL: "http://movie:8000"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/ping | grep -q pong"]
    networks:
      - cinema-network

  seat:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: seat
        SERVICE_PORT: 3004
    image: ${REGISTRY:-cinema}/seat:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-seat
    hostname: seat
    profiles: [dev, test]
    ports:
      - "3004:3004"
    environment:
      <<: *nats-env
      MONGO_URI: "mongodb://${MONGO_SERVERS:-mongo:27017}/cinema_seats?replicaSet=rs0"
      MONGO_DB: "cinema_seats"
      REDIS_ADDR: "redis:6379"
      REDIS_PASS: ""
      PORT: "3004"
      HOLD_TTL_SECONDS: "300"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/ping | grep -q pong"]
    networks:
      - cinema-network

  payment:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: payment
        SERVICE_PORT: 8000
    image: ${REGISTRY:-cinema}/payment:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-payment
    hostname: payment
    profiles: [dev, test]
    ports:
      - "8001:8000"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      SERVICE_PORT: "8000"
      STRIPE_PUBLIC: "pk_test_mock"
      STRIPE_SECRET: "sk_test_mock"
      STRIPE_MOCK: "true"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ping | grep -q pong"]
    networks:
      - cinema-network

  notification:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: notification
        SERVICE_PORT: 8000
    image: ${REGISTRY:-cinema}/notification:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-notification
    hostname: notification
    profiles: [dev, test]
    ports:
      - "8002:8000"
    environment:
      <<: *nats-env
      SERVICE_PORT: "8000"
      EMAIL: "${NOTIFICATION_EMAIL:-dev@cinema.local}"
      EMAIL_PASS: "${NOTIFICATION_PASS:-dev-password}"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ping | grep -q pong"]
    networks:
      - cinema-network

  booking:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: booking
        SERVICE_PORT: 8082
    image: ${REGISTRY:-cinema}/booking:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-booking
    hostname: booking
    profiles: [dev, test]
    ports:
      - "8082:8082"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      SERVICE_PORT: "8082"
      PAYMENT_URL: "http://payment:8000"
      NOTIFICATION_URL: "http://notification:8000"
      SEAT_SERVICE_URL: "http://seat:3004"
      SHOWTIME_SERVICE_URL: "http://showtime:3003"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/ping | grep -q pong"]
    networks:
      - cinema-network

  # ============================================================
  # E2E Test Runner (test profile only)
  # ============================================================

  e2e-runner:
    build:
      context: ../../..
      dockerfile: platform/docker/e2e-runner/Dockerfile
    container_name: ${ENV_PREFIX:-test}-e2e-runner
    profiles: [e2e]
    environment:
      GOWORK: "off"
      USER_SERVICE_URL: "http://user:8004"
      MOVIE_SERVICE_URL: "http://movie:8000"
      CINEMA_SERVICE_URL: "http://cinema:8085"
      SHOWTIME_SERVICE_URL: "http://showtime:3003"
      SEAT_SERVICE_URL: "http://seat:3004"
      PAYMENT_SERVICE_URL: "http://payment:8000"
      BOOKING_SERVICE_URL: "http://booking:8082"
      NOTIFICATION_SERVICE_URL: "http://notification:8000"
    networks:
      - cinema-network

networks:
  cinema-network:
    name: cinema-${ENV_PREFIX:-dev}-network

volumes:
  mongo1_data:
    driver: local
  mongo2_data:
    driver: local
  mongo3_data:
    driver: local
  redis_data:
    driver: local
