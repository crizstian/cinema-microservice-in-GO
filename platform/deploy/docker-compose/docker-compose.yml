# ============================================================
# Docker Compose - Cinema Microservices
# ============================================================
# Unified compose file with profiles for dev and test environments.
#
# Profiles:
#   - dev:   3 MongoDB replicas, persistent volumes (production-like)
#   - test:  1 MongoDB node, tmpfs (fast, ephemeral)
#   - debug: Dev profile + debug ports exposed
#   - perf:  Dev profile optimized for performance testing
#   - e2e:   E2E test runner container
#
# Usage:
#   task dev:up          # Start dev environment
#   task dev:down        # Stop dev environment
#   task test:e2e        # Run E2E tests
#
# Manual:
#   docker compose --profile dev up -d
#   docker compose --profile test up -d
#   docker compose --profile test --profile e2e up
#   docker compose --profile debug up -d   # With debug ports
#   docker compose --profile perf up -d    # For load testing
# ============================================================

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 15s

x-mongo-env: &mongo-env
  DB_USER: ""
  DB_PASS: ""
  DB_NAME: "cinema"
  DB_REPLICA: "rs0"

x-nats-env: &nats-env
  NATS_URL: "nats://nats:4222"

services:
  # ============================================================
  # MongoDB - Dev (3 replicas with persistent volumes)
  # ============================================================

  mongo1:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-dev}-mongo1
    hostname: mongo1
    profiles: [dev, debug, perf]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    volumes:
      - mongo1_data:/data/db
    networks:
      - cinema-network

  mongo2:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-dev}-mongo2
    hostname: mongo2
    profiles: [dev, debug, perf]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27018:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    volumes:
      - mongo2_data:/data/db
    networks:
      - cinema-network

  mongo3:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-dev}-mongo3
    hostname: mongo3
    profiles: [dev, debug, perf]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27019:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    volumes:
      - mongo3_data:/data/db
    networks:
      - cinema-network

  mongo-init-dev:
    build:
      context: ../../docker/mongodb
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX:-dev}-mongo-init
    profiles: [dev, debug, perf]
    environment:
      MONGO_HOST: mongo1
      REPLICA_SET: rs0
      REPLICA_MEMBERS: "mongo1,mongo2,mongo3"
      AUTH_ENABLED: "false"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    restart: "no"
    networks:
      - cinema-network

  # ============================================================
  # MongoDB - Test (single node with tmpfs)
  # ============================================================

  mongo:
    image: mongo:8.0
    container_name: ${ENV_PREFIX:-test}-mongo
    hostname: mongo
    profiles: [test]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    tmpfs:
      - /data/db
    networks:
      - cinema-network

  mongo-init-test:
    build:
      context: ../../docker/mongodb
      dockerfile: Dockerfile
    container_name: ${ENV_PREFIX:-test}-mongo-init
    profiles: [test]
    environment:
      MONGO_HOST: mongo
      REPLICA_SET: rs0
      AUTH_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - cinema-network

  # ============================================================
  # Redis (shared, profile-specific storage)
  # ============================================================

  redis-dev:
    image: redis:7-alpine
    container_name: ${ENV_PREFIX:-dev}-redis
    hostname: redis
    profiles: [dev, debug, perf]
    ports:
      - "6379:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    volumes:
      - redis_data:/data
    networks:
      - cinema-network

  redis-test:
    image: redis:7-alpine
    container_name: ${ENV_PREFIX:-test}-redis
    hostname: redis
    profiles: [test]
    ports:
      - "6379:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    tmpfs:
      - /data
    networks:
      - cinema-network

  # ============================================================
  # NATS (shared between profiles)
  # ============================================================

  nats:
    image: nats:2.10-alpine
    container_name: ${ENV_PREFIX:-cinema}-nats
    hostname: nats
    profiles: [dev, test, debug, perf]
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222", "-js"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
    networks:
      - cinema-network

  # ============================================================
  # Microservices (shared between dev and test)
  # ============================================================

  movie:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: movie
        SERVICE_PORT: ${MOVIE_PORT:-8002}
    image: ${MOVIE_IMAGE:-crizstian/movie-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-movie
    hostname: movie
    profiles: [dev, test, debug, perf]
    ports:
      - "${MOVIE_PORT:-8002}:${MOVIE_PORT:-8002}"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      DB_NAME: "${MOVIE_DB:-movie}"
      SERVICE_PORT: "${MOVIE_PORT:-8002}"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${MOVIE_PORT:-8002}/health/live || exit 1"]
    depends_on:
      mongo-init-dev:
        condition: service_completed_successfully
        required: false
      mongo-init-test:
        condition: service_completed_successfully
        required: false
    networks:
      - cinema-network

  cinema:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: cinema
        SERVICE_PORT: ${CINEMA_PORT:-8003}
    image: ${CINEMA_IMAGE:-crizstian/cinema-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-cinema
    hostname: cinema
    profiles: [dev, test, debug, perf]
    ports:
      - "${CINEMA_PORT:-8003}:${CINEMA_PORT:-8003}"
    environment:
      <<: *nats-env
      MONGO_URI: "mongodb://${MONGO_SERVERS:-mongo:27017}/?replicaSet=rs0"
      MONGO_DB: "${CINEMA_DB:-cinema}"
      PORT: "${CINEMA_PORT:-8003}"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CINEMA_PORT:-8003}/health/live || exit 1"]
    depends_on:
      mongo-init-dev:
        condition: service_completed_successfully
        required: false
      mongo-init-test:
        condition: service_completed_successfully
        required: false
    networks:
      - cinema-network

  user:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: user
        SERVICE_PORT: ${USER_PORT:-8004}
    image: ${USER_IMAGE:-crizstian/user-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-user
    hostname: user
    profiles: [dev, test, debug, perf]
    ports:
      - "${USER_PORT:-8004}:${USER_PORT:-8004}"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      DB_NAME: "${USER_DB:-user}"
      SERVICE_PORT: "${USER_PORT:-8004}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      REDIS_URL: "redis://redis:6379"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${USER_PORT:-8004}/health/live || exit 1"]
    depends_on:
      mongo-init-dev:
        condition: service_completed_successfully
        required: false
      mongo-init-test:
        condition: service_completed_successfully
        required: false
      redis-dev:
        condition: service_healthy
        required: false
      redis-test:
        condition: service_healthy
        required: false
    networks:
      - cinema-network

  showtime:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: showtime
        SERVICE_PORT: ${SHOWTIME_PORT:-8006}
    image: ${SHOWTIME_IMAGE:-crizstian/showtime-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-showtime
    hostname: showtime
    profiles: [dev, test, debug, perf]
    ports:
      - "${SHOWTIME_PORT:-8006}:${SHOWTIME_PORT:-8006}"
    environment:
      <<: *nats-env
      MONGO_URI: "mongodb://${MONGO_SERVERS:-mongo:27017}/?replicaSet=rs0"
      MONGO_DB: "${SHOWTIME_DB:-showtime}"
      PORT: "${SHOWTIME_PORT:-8006}"
      MOVIE_SERVICE_URL: "http://movie:${MOVIE_PORT:-8002}"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SHOWTIME_PORT:-8006}/health/live || exit 1"]
    depends_on:
      mongo-init-dev:
        condition: service_completed_successfully
        required: false
      mongo-init-test:
        condition: service_completed_successfully
        required: false
    networks:
      - cinema-network

  seat:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: seat
        SERVICE_PORT: ${SEAT_PORT:-8005}
    image: ${SEAT_IMAGE:-crizstian/seat-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-seat
    hostname: seat
    profiles: [dev, test, debug, perf]
    ports:
      - "${SEAT_PORT:-8005}:${SEAT_PORT:-8005}"
    environment:
      <<: *nats-env
      MONGO_URI: "mongodb://${MONGO_SERVERS:-mongo:27017}/${SEAT_DB:-seat}?replicaSet=rs0"
      MONGO_DB: "${SEAT_DB:-seat}"
      REDIS_ADDR: "redis:6379"
      REDIS_PASS: ""
      PORT: "${SEAT_PORT:-8005}"
      HOLD_TTL_SECONDS: "${HOLD_TTL_SECONDS:-300}"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${SEAT_PORT:-8005}/health/live || exit 1"]
    depends_on:
      mongo-init-dev:
        condition: service_completed_successfully
        required: false
      mongo-init-test:
        condition: service_completed_successfully
        required: false
      redis-dev:
        condition: service_healthy
        required: false
      redis-test:
        condition: service_healthy
        required: false
    networks:
      - cinema-network

  payment:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: payment
        SERVICE_PORT: ${PAYMENT_PORT:-8007}
    image: ${PAYMENT_IMAGE:-crizstian/payment-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-payment
    hostname: payment
    profiles: [dev, test, debug, perf]
    ports:
      - "${PAYMENT_PORT:-8007}:${PAYMENT_PORT:-8007}"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      DB_NAME: "${PAYMENT_DB:-payment}"
      SERVICE_PORT: "${PAYMENT_PORT:-8007}"
      STRIPE_PUBLIC: "pk_test_mock"
      STRIPE_SECRET: "sk_test_mock"
      STRIPE_MOCK: "true"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PAYMENT_PORT:-8007}/health/live || exit 1"]
    depends_on:
      mongo-init-dev:
        condition: service_completed_successfully
        required: false
      mongo-init-test:
        condition: service_completed_successfully
        required: false
    networks:
      - cinema-network

  notification:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: notification
        SERVICE_PORT: ${NOTIFICATION_PORT:-8008}
    image: ${NOTIFICATION_IMAGE:-crizstian/notification-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-notification
    hostname: notification
    profiles: [dev, test, debug, perf]
    ports:
      - "${NOTIFICATION_PORT:-8008}:${NOTIFICATION_PORT:-8008}"
    environment:
      <<: *nats-env
      SERVICE_PORT: "${NOTIFICATION_PORT:-8008}"
      EMAIL: "${NOTIFICATION_EMAIL:-dev@cinema.local}"
      EMAIL_PASS: "${NOTIFICATION_PASS:-dev-password}"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${NOTIFICATION_PORT:-8008}/health/live || exit 1"]
    networks:
      - cinema-network

  booking:
    build:
      context: ../../..
      dockerfile: platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: booking
        SERVICE_PORT: ${BOOKING_PORT:-8001}
    image: ${BOOKING_IMAGE:-crizstian/booking-service}:${VERSION:-dev}
    container_name: ${ENV_PREFIX:-cinema}-booking
    hostname: booking
    profiles: [dev, test, debug, perf]
    ports:
      - "${BOOKING_PORT:-8001}:${BOOKING_PORT:-8001}"
    environment:
      <<: [*mongo-env, *nats-env]
      DB_SERVERS: "${MONGO_SERVERS:-mongo:27017}"
      DB_NAME: "${BOOKING_DB:-booking}"
      SERVICE_PORT: "${BOOKING_PORT:-8001}"
      PAYMENT_URL: "http://payment:${PAYMENT_PORT:-8007}"
      NOTIFICATION_URL: "http://notification:${NOTIFICATION_PORT:-8008}"
      SEAT_SERVICE_URL: "http://seat:${SEAT_PORT:-8005}"
      SHOWTIME_SERVICE_URL: "http://showtime:${SHOWTIME_PORT:-8006}"
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:${BOOKING_PORT:-8001}/health/live || exit 1"]
    depends_on:
      mongo-init-dev:
        condition: service_completed_successfully
        required: false
      mongo-init-test:
        condition: service_completed_successfully
        required: false
    networks:
      - cinema-network

  # ============================================================
  # E2E Test Runner (test profile only)
  # ============================================================

  e2e-runner:
    build:
      context: ../../..
      dockerfile: platform/docker/e2e-runner/Dockerfile
    container_name: ${ENV_PREFIX:-test}-e2e-runner
    profiles: [e2e]
    environment:
      GOWORK: "off"
      USER_SERVICE_URL: "http://user:${USER_PORT:-8004}"
      MOVIE_SERVICE_URL: "http://movie:${MOVIE_PORT:-8002}"
      CINEMA_SERVICE_URL: "http://cinema:${CINEMA_PORT:-8003}"
      SHOWTIME_SERVICE_URL: "http://showtime:${SHOWTIME_PORT:-8006}"
      SEAT_SERVICE_URL: "http://seat:${SEAT_PORT:-8005}"
      PAYMENT_SERVICE_URL: "http://payment:${PAYMENT_PORT:-8007}"
      BOOKING_SERVICE_URL: "http://booking:${BOOKING_PORT:-8001}"
      NOTIFICATION_SERVICE_URL: "http://notification:${NOTIFICATION_PORT:-8008}"
      HOLD_TTL_SECONDS: "${HOLD_TTL_SECONDS:-5}"
    networks:
      - cinema-network

networks:
  cinema-network:
    name: cinema-${ENV_PREFIX:-dev}-network

volumes:
  mongo1_data:
    driver: local
  mongo2_data:
    driver: local
  mongo3_data:
    driver: local
  redis_data:
    driver: local
