services:
  # ============================================================
  # MongoDB Replica Set - 3 nodos
  # ============================================================

  mongo1:
    image: mongo:8.0
    container_name: mongo1
    hostname: mongo1
    restart: unless-stopped
    command: mongod --replSet rs1 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: admin
    volumes:
      - mongodb1_data:/data/db
      - mongodb1_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      dc1:
        ipv4_address: 10.7.0.3

  mongo2:
    image: mongo:8.0
    container_name: mongo2
    hostname: mongo2
    restart: unless-stopped
    command: mongod --replSet rs1 --bind_ip_all --port 27017
    ports:
      - "27018:27017"
    volumes:
      - mongodb2_data:/data/db
      - mongodb2_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      dc1:
        ipv4_address: 10.7.0.4

  mongo3:
    image: mongo:8.0
    container_name: mongo3
    hostname: mongo3
    restart: unless-stopped
    command: mongod --replSet rs1 --bind_ip_all --port 27017
    ports:
      - "27019:27017"
    volumes:
      - mongodb3_data:/data/db
      - mongodb3_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      dc1:
        ipv4_address: 10.7.0.5

  # ============================================================
  # MongoDB Initializer - Configuración del Replica Set
  # ============================================================

  mongo-init:
    image: mongo:8.0
    container_name: mongo-init
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    environment:
      DB_ADMIN_USER: "cristian"
      DB_ADMIN_PASS: "cristianPassword2017"
      DB_REPLICA_ADMIN: "replicaAdmin"
      DB_REPLICA_ADMIN_PASS: "replicaAdminPassword2017"
      DB_REPLSET_NAME: "rs1"
    volumes:
      - ./scripts/init-replica.sh:/init-replica.sh
    command: bash /init-replica.sh
    restart: "no"
    networks:
      dc1:
        ipv4_address: 10.7.0.2

  movie:
    image: crizstian/cinema/movie:v0.1
    container_name: movie
    hostname: movie
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      DB_USER: "cristian"
      DB_PASS: "cristianPassword2017"
      DB_SERVERS: "mongo1:27017,mongo2:27017,mongo3:27017"
      DB_NAME: "admin"
      DB_REPLICA: "rs1"
      SERVICE_PORT: "8000"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      dc1:
        ipv4_address: 10.7.0.6

  payment:
    image: crizstian/cinema/payment:v0.1
    container_name: payment
    hostname: payment
    restart: on-failure
    ports:
      - "8100:8000"
    environment:
      DB_USER: "cristian"
      DB_PASS: "cristianPassword2017"
      DB_SERVERS: "mongo1:27017,mongo2:27017,mongo3:27017"
      DB_NAME: "admin"
      DB_REPLICA: "rs1"
      SERVICE_PORT: "8000"
      STRIPE_PUBLIC: "pk_test_l10342hIODZmOJsBpY6GVPHj"
      STRIPE_SECRET: "sk_test_lPPoJjmmbSjymtgo4r0O3z89"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    networks:
      dc1:
        ipv4_address: 10.7.0.7

  notification:
    image: crizstian/cinema/notification:v0.1
    container_name: notification
    hostname: notification
    restart: on-failure
    ports:
      - "8200:8000"
    environment:
      SERVICE_PORT: "8000"
      EMAIL: "your-email@gmail.com"
      EMAIL_PASS: "your-password"
    networks:
      dc1:
        ipv4_address: 10.7.0.8

  booking:
    image: crizstian/cinema/booking:v0.1
    container_name: booking
    hostname: booking
    restart: on-failure
    ports:
      - "8300:8000"
    environment:
      DB_USER: "cristian"
      DB_PASS: "cristianPassword2017"
      DB_SERVERS: "mongo1:27017,mongo2:27017,mongo3:27017"
      DB_NAME: "admin"
      DB_REPLICA: "rs1"
      SERVICE_PORT: "8000"
      PAYMENT_URL: "http://payment:8000"
      NOTIFICATION_URL: "http://notification:8000"
      ENABLE_TRACING: "false"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy      
    networks:
      dc1:
        ipv4_address: 10.7.0.9

