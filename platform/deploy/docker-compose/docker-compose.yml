networks:
  dc1:
    driver: bridge
    ipam:
     config:
       - subnet: 10.7.0.0/16

# ============================================================
# Volúmenes - Persistencia de datos MongoDB
# ============================================================
volumes:
  mongodb1_data:
    driver: local
  mongodb1_config:
    driver: local
  mongodb2_data:
    driver: local
  mongodb2_config:
    driver: local
  mongodb3_data:
    driver: local
  mongodb3_config:
    driver: local