# Harness Service Definition
# GitOps pattern - configuration lives in values files, not here

service:
  name: booking-service
  identifier: bookingservice
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: templates
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: CristianConnector
                  gitFetchType: Branch
                  paths:
                    - platform/deploy/kubernetes/templates/services/
                  repoName: cinema-microservice-in-GO
                  branch: <+pipeline.variables.branch>
              valuesPaths:
                - platform/deploy/kubernetes/values/base.yaml
                - platform/deploy/kubernetes/values/environments/<+env.name>.yaml
                - platform/deploy/kubernetes/values/services/booking.yaml
              skipResourceVersioning: true
      artifacts:
        primary:
          primaryArtifactRef: artifact
          sources:
            - identifier: artifact
              type: DockerRegistry
              spec:
                connectorRef: DockerCristian
                imagePath: crizstian/booking-service
                tag: <+input>
  gitOpsEnabled: false
