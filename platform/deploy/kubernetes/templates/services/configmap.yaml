apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.serviceName }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
    app.kubernetes.io/version: {{ quote .Values.version }}
    app.kubernetes.io/component: config
    app.kubernetes.io/environment: {{ .Values.environment }}
data:
  # Base configuration
  SERVICE_PORT: {{ quote (default "8080" .Values.port) }}
  LOG_LEVEL: {{ quote .Values.observability.logLevel }}

  # Database configuration (standard pattern)
  {{- if .Values.database }}
  DB_NAME: {{ quote (default .Values.serviceName .Values.dbName) }}
  DB_SERVERS: {{ quote .Values.database.servers }}
  DB_REPLICA: {{ quote (default "" .Values.database.replica) }}
  {{- end }}

  # Legacy MongoDB configuration (cinema, showtime)
  {{- if .Values.mongodb }}
  MONGO_URI: {{ quote .Values.mongodb.uri }}
  MONGO_DB: {{ quote .Values.mongodb.database }}
  PORT: {{ quote .Values.port }}
  {{- end }}

  # Service discovery URLs
  {{- if .Values.services }}
  BOOKING_URL: {{ quote .Values.services.booking }}
  MOVIE_URL: {{ quote .Values.services.movie }}
  CINEMA_URL: {{ quote .Values.services.cinema }}
  USER_URL: {{ quote .Values.services.user }}
  SEAT_URL: {{ quote .Values.services.seat }}
  SHOWTIME_URL: {{ quote .Values.services.showtime }}
  PAYMENT_URL: {{ quote .Values.services.payment }}
  NOTIFICATION_URL: {{ quote .Values.services.notification }}
  {{- end }}

  # Service-specific extra config
  {{- range $key, $value := .Values.extraConfig }}
  {{ $key }}: {{ quote $value }}
  {{- end }}
