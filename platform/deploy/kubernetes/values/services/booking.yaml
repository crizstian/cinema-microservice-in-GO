# Booking Service Values
# Static configuration - no Harness expressions except service.name and artifact.tag

serviceName: <+service.name>
version: <+artifact.tag>

port: 8001
dbName: booking

dependencies:
  - seat-service
  - payment-service
  - showtime-service
  - notification-service

autoscaling:
  minReplicas: 2
  maxReplicas: 10

pdb:
  minAvailable: 1

# Booking-specific config (service URLs)
extraConfig:
  SEAT_SERVICE_URL: http://seat-service.cinema-dev.svc.cluster.local:8005
  SHOWTIME_SERVICE_URL: http://showtime-service.cinema-dev.svc.cluster.local:8006
