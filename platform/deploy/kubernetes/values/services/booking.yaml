# Booking Service Values
# Orchestrates the booking SAGA pattern

serviceName: booking-service
version: <+artifact.tag>

port: 8001
dbName: booking

# Dependencies
dependencies:
  - seat-service
  - payment-service
  - showtime-service
  - notification-service

# Resource defaults (overrides base)
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# HPA defaults
autoscaling:
  minReplicas: 2
  maxReplicas: 10

# PDB
pdb:
  minAvailable: 1
