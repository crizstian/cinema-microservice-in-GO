# Booking Service Values
# Static configuration - no Harness expressions except service.name and artifact.tag

serviceName: <+service.name>
version: <+artifact.tag>

port: 8001
dbName: booking

dependencies:
  - seat-service
  - payment-service
  - showtime-service
  - notification-service

autoscaling:
  minReplicas: 2
  maxReplicas: 10

pdb:
  minAvailable: 1
