# Payment Service Values
# Static configuration - no Harness expressions except service.name and artifact.tag

serviceName: <+service.name>
version: <+artifact.tag>

port: 8007
dbName: payment

dependencies: []

autoscaling:
  minReplicas: 2
  maxReplicas: 10

pdb:
  minAvailable: 1

# Payment-specific config (Stripe)
extraConfig:
  STRIPE_PUBLIC: pk_test_mock
  STRIPE_MOCK: "true"

# Payment-specific secrets (Stripe)
extraSecrets:
  STRIPE_SECRET: <+secrets.getValue("stripe_secret")>
