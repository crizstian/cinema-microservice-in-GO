# Movie Service Values
# Manages movie catalog and schedules

serviceName: movie-service
version: <+artifact.tag>

port: 8002
dbName: movie

dependencies:
  - cinema-service

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  minReplicas: 1
  maxReplicas: 5

pdb:
  minAvailable: 1
