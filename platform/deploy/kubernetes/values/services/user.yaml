# User Service Values
# Static configuration - no Harness expressions except service.name and artifact.tag

serviceName: <+service.name>
version: <+artifact.tag>

port: 8004
dbName: user

dependencies: []

autoscaling:
  minReplicas: 1
  maxReplicas: 5

pdb:
  minAvailable: 1

# User-specific config (Redis)
extraConfig:
  REDIS_URL: redis://redis.cinema-dev.svc.cluster.local:6379

# User-specific secrets (JWT)
extraSecrets:
  JWT_SECRET: <+secrets.getValue("jwt_secret")>
