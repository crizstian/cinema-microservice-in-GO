# Notification Service Values
# Static configuration - no Harness expressions except service.name and artifact.tag

serviceName: <+service.name>
version: <+artifact.tag>

port: 8008
dbName: notification

dependencies: []

autoscaling:
  minReplicas: 1
  maxReplicas: 5

pdb:
  minAvailable: 1

# Notification-specific config (Email)
extraConfig:
  EMAIL: notifications@cinema.local

# Notification-specific secrets (Email credentials)
extraSecrets:
  EMAIL_PASS: <+secrets.getValue("email_password")>
