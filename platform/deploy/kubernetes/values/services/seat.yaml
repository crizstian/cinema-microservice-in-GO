# Seat Service Values
# Static configuration - no Harness expressions except service.name and artifact.tag

serviceName: <+service.name>
version: <+artifact.tag>

port: 8005
dbName: seat

dependencies:
  - showtime-service

autoscaling:
  minReplicas: 2
  maxReplicas: 8

pdb:
  minAvailable: 1

# Seat uses legacy MongoDB config pattern
mongodb:
  uri: mongodb://<+secrets.getValue("db_user")>:<+secrets.getValue("db_password")>@mongodb.cinema-dev.svc.cluster.local:27017
  database: seat

# Seat-specific config (Redis for seat holds)
extraConfig:
  REDIS_ADDR: redis.cinema-dev.svc.cluster.local:6379
  HOLD_TTL_SECONDS: "300"

# Seat-specific secrets (Redis)
extraSecrets:
  REDIS_PASS: <+secrets.getValue("redis_password")>
