# Seat Service Values
# Manages seat availability and reservations

serviceName: seat-service
version: <+artifact.tag>

port: 8005
dbName: seat

dependencies:
  - showtime-service

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  minReplicas: 2
  maxReplicas: 8

pdb:
  minAvailable: 1
