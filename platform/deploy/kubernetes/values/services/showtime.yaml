# Showtime Service Values
# Static configuration - no Harness expressions except service.name and artifact.tag

serviceName: <+service.name>
version: <+artifact.tag>

port: 8006
dbName: showtime

dependencies:
  - movie-service
  - cinema-service

autoscaling:
  minReplicas: 1
  maxReplicas: 5

pdb:
  minAvailable: 1

# Showtime uses legacy MongoDB config pattern
mongodb:
  uri: mongodb://<+secrets.getValue("db_user")>:<+secrets.getValue("db_password")>@mongodb.cinema-dev.svc.cluster.local:27017
  database: showtime

extraConfig:
  MOVIE_SERVICE_URL: http://movie-service:8002
