# Cinema Microservices - E2E Testing Environment
#
# Infrastructure Components:
#   - MongoDB 8.0 (replica set for transactions)
#   - Redis 7 (session/cache management)
#   - NATS (async messaging between services)
#
# Profiles:
#   - infra: Infrastructure only (MongoDB + Redis + NATS)
#   - full:  All microservices (requires infra)
#   - e2e:   E2E test runner (requires full)
#
# Usage:
#   task infra:up           # Infrastructure only
#   task test:e2e           # Full E2E test run (recommended)

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 10s

x-service-healthcheck: &service-healthcheck
  interval: 5s
  timeout: 3s
  retries: 10
  start_period: 15s

x-mongo-env: &mongo-env
  DB_USER: ""
  DB_PASS: ""
  DB_SERVERS: "mongo:27017"
  DB_NAME: "cinema"
  DB_REPLICA: "rs0"

x-nats-env: &nats-env
  NATS_URL: "nats://nats:4222"

services:
  # ============================================================
  # Infrastructure (profile: infra, full)
  # ============================================================

  mongo:
    image: mongo:8.0
    container_name: test-mongo
    hostname: mongo
    profiles: [infra, full]
    command: mongod --replSet rs0 --bind_ip_all
    ports:
      - "27017:27017"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    tmpfs:
      - /data/db
    networks:
      - test-network

  mongo-init:
    build:
      context: ./mongo-init
      dockerfile: mongo-init.Dockerfile
    container_name: test-mongo-init
    profiles: [infra, full]
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    networks:
      - test-network

  redis:
    image: redis:7-alpine
    container_name: test-redis
    hostname: redis
    profiles: [infra, full]
    ports:
      - "6379:6379"
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]
    tmpfs:
      - /data
    networks:
      - test-network

  nats:
    image: nats:2.10-alpine
    container_name: test-nats
    hostname: nats
    profiles: [infra, full]
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222", "-js"]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
    networks:
      - test-network

  # ============================================================
  # Microservices (profile: full)
  # ============================================================

  movie:
    build:
      context: ../../../services/movie
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: movie
        SERVICE_PORT: 8000
    profiles: [full]
    container_name: test-movie
    hostname: movie
    ports:
      - "8000:8000"
    environment:
      <<: *mongo-env
      NATS_URL: "nats://nats:4222"
      SERVICE_PORT: "8000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ping | grep -q pong"]
    networks:
      - test-network

  cinema:
    build:
      context: ../../../services/cinema
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: cinema
        SERVICE_PORT: 8085
    profiles: [full]
    container_name: test-cinema
    hostname: cinema
    ports:
      - "8085:8085"
    environment:
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      MONGO_DB: "cinema"
      NATS_URL: "nats://nats:4222"
      PORT: "8085"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/ping | grep -q pong"]
    networks:
      - test-network

  user:
    build:
      context: ../../../services/user
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: user
        SERVICE_PORT: 8004
    profiles: [full]
    container_name: test-user
    hostname: user
    ports:
      - "8004:8004"
    environment:
      <<: *mongo-env
      NATS_URL: "nats://nats:4222"
      SERVICE_PORT: "8004"
      JWT_SECRET: "test-secret-key-for-e2e-testing"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/ping | grep -q pong"]
    networks:
      - test-network

  showtime:
    build:
      context: ../../../services/showtime
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: showtime
        SERVICE_PORT: 3003
    profiles: [full]
    container_name: test-showtime
    hostname: showtime
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      MONGO_DB: "cinema"
      NATS_URL: "nats://nats:4222"
      MOVIE_SERVICE_URL: "http://movie:8000"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      movie:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/ping | grep -q pong"]
    networks:
      - test-network

  seat:
    build:
      context: ../../../services/seat
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: seat
        SERVICE_PORT: 3004
    profiles: [full]
    container_name: test-seat
    hostname: seat
    ports:
      - "3004:3004"
    environment:
      MONGO_URI: "mongodb://mongo:27017/?replicaSet=rs0"
      MONGO_DB: "cinema_seats"
      REDIS_ADDR: "redis:6379"
      REDIS_PASS: ""
      PORT: "3004"
      NATS_URL: "nats://nats:4222"
      HOLD_TTL_SECONDS: "300"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/ping | grep -q pong"]
    networks:
      - test-network

  payment:
    build:
      context: ../../../services/payment
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: payment
        SERVICE_PORT: 8000
    profiles: [full]
    container_name: test-payment
    hostname: payment
    ports:
      - "8001:8000"
    environment:
      <<: *mongo-env
      NATS_URL: "nats://nats:4222"
      SERVICE_PORT: "8000"
      STRIPE_PUBLIC: "pk_test_mock"
      STRIPE_SECRET: "sk_test_mock"
      STRIPE_MOCK: "true"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ping | grep -q pong"]
    networks:
      - test-network

  notification:
    build:
      context: ../../../services/notification
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: notification
        SERVICE_PORT: 8000
    profiles: [full]
    container_name: test-notification
    hostname: notification
    ports:
      - "8002:8000"
    environment:
      <<: *nats-env
      SERVICE_PORT: "8000"
      EMAIL: "test@cinema.local"
      EMAIL_PASS: "test-password"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/ping | grep -q pong"]
    networks:
      - test-network

  booking:
    build:
      context: ../../../services/booking
      dockerfile: ../../../platform/docker/go-service/Dockerfile
      args:
        SERVICE_NAME: booking
        SERVICE_PORT: 8082
    profiles: [full]
    container_name: test-booking
    hostname: booking
    ports:
      - "8082:8082"
    environment:
      <<: *mongo-env
      NATS_URL: "nats://nats:4222"
      SERVICE_PORT: "8082"
      PAYMENT_URL: "http://payment:8000"
      NOTIFICATION_URL: "http://notification:8000"
      SEAT_SERVICE_URL: "http://seat:3004"
      SHOWTIME_SERVICE_URL: "http://showtime:3003"
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
      seat:
        condition: service_healthy
      showtime:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      <<: *service-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/ping | grep -q pong"]
    networks:
      - test-network

  # ============================================================
  # E2E Test Runner (profile: e2e)
  # ============================================================

  e2e-runner:
    build:
      context: .
      dockerfile: e2e-runner.Dockerfile
    profiles: [e2e]
    container_name: test-e2e-runner
    environment:
      GOWORK: "off"
      USER_SERVICE_URL: "http://user:8004"
      MOVIE_SERVICE_URL: "http://movie:8000"
      CINEMA_SERVICE_URL: "http://cinema:8085"
      SHOWTIME_SERVICE_URL: "http://showtime:3003"
      SEAT_SERVICE_URL: "http://seat:3004"
      PAYMENT_SERVICE_URL: "http://payment:8000"
      BOOKING_SERVICE_URL: "http://booking:8082"
      NOTIFICATION_SERVICE_URL: "http://notification:8000"
    depends_on:
      booking:
        condition: service_healthy
      user:
        condition: service_healthy
      movie:
        condition: service_healthy
      cinema:
        condition: service_healthy
      showtime:
        condition: service_healthy
      seat:
        condition: service_healthy
      payment:
        condition: service_healthy
      notification:
        condition: service_healthy
    networks:
      - test-network

networks:
  test-network:
    name: cinema-test-network
