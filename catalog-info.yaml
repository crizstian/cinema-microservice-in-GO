apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: cinema-platform
  description: Cinema Microservices Platform - A complete booking and management system for cinemas
  annotations:
    harness.io/project-url: https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/CristianRamirez
    github.com/project-slug: crizstian/cinema-microservice-in-GO
    backstage.io/techdocs-ref: dir:docs/
  tags:
    - go
    - microservices
    - cinema
    - kubernetes
    - gitops
  links:
    - url: https://app.harness.io/ng/account/EeRjnXTnS4GrLG5VNNJZUw/all/orgs/sandbox/projects/CristianRamirez/deployments
      title: Harness Deployments
      icon: dashboard
    - url: https://github.com/crizstian/cinema-microservice-in-GO
      title: GitHub Repository
      icon: github
spec:
  owner: team-cinema
  domain: entertainment
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: entertainment
  description: Entertainment and media services domain
spec:
  owner: team-cinema
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: team-cinema
  description: Cinema Platform Development Team
spec:
  type: team
  profile:
    displayName: Cinema Platform Team
    email: cinema-team@example.com
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: booking-api
  description: Booking API for cinema reservations
  tags:
    - rest
    - booking
spec:
  type: openapi
  lifecycle: production
  owner: team-cinema
  system: cinema-platform
  definition: |
    openapi: "3.0.0"
    info:
      title: Booking API
      version: "1.0"
    paths:
      /bookings:
        get:
          summary: List all bookings
        post:
          summary: Create a new booking
---
